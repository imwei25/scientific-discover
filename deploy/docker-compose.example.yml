# 这是 render-compose.sh 生成物的样子（示例，2 个用户）。真实 docker-compose.yml 由脚本从 users/*.env 生成、已 gitignore（含明文密码）。
# 不要手改真实文件；改 users/*.env 后跑 scripts/render-compose.sh。
# 要点：① 每用户独立容器 + 三卷（ocdata 持久化 opencode 会话历史，按需停机不丢对话）；
#       ② 端口只发布到 127.0.0.1（回环）→ 公网无法直连、也避免触发 app 的 isLocal 免登录旁路；
#       ③ restart: "no" —— 空闲停机是我们主动 docker stop（退出码 143），on-failure 会误判为崩溃反复重启，故禁用；
#       ④ 仓库根 .opencode/skills 与 AGENTS.md 以【只读】挂进容器（内核级写保护）——技能/主控的唯一源头，
#          宿主 git pull 后即生效，覆盖镜像内的同名拷贝。
services:
  agent-alice:
    image: sci-agent:latest
    container_name: agent-alice
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 deploy/.env 设置 DEEPSEEK_API_KEY}
      OC_MODEL: ${OC_MODEL:-deepseek/deepseek-v4-pro}
      LAN_AUTH: "1"
      LAN_USER: "alice"
      LAN_PASSWORD: "示例-真实值来自-users-alice-env"
      BASE_PATH: "/alice"
    volumes:
      - alice-uploads:/app/uploads
      - alice-outputs:/app/outputs
      - alice-ocdata:/root/.local/share/opencode
      - ../.opencode/skills:/app/.opencode/skills:ro
      - ../AGENTS.md:/app/AGENTS.md:ro
    ports:
      - "127.0.0.1:3001:3000"
    restart: "no"
    mem_limit: 1750m
    cpus: 1.5
  agent-bob:
    image: sci-agent:latest
    container_name: agent-bob
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 deploy/.env 设置 DEEPSEEK_API_KEY}
      OC_MODEL: ${OC_MODEL:-deepseek/deepseek-v4-pro}
      LAN_AUTH: "1"
      LAN_USER: "bob"
      LAN_PASSWORD: "示例-真实值来自-users-bob-env"
      BASE_PATH: "/bob"
    volumes:
      - bob-uploads:/app/uploads
      - bob-outputs:/app/outputs
      - bob-ocdata:/root/.local/share/opencode
      - ../.opencode/skills:/app/.opencode/skills:ro
      - ../AGENTS.md:/app/AGENTS.md:ro
    ports:
      - "127.0.0.1:3002:3000"
    restart: "no"
    mem_limit: 1750m
    cpus: 1.5
volumes:
  alice-uploads:
    name: alice-uploads
  alice-outputs:
    name: alice-outputs
  alice-ocdata:
    name: alice-ocdata
  bob-uploads:
    name: bob-uploads
  bob-outputs:
    name: bob-outputs
  bob-ocdata:
    name: bob-ocdata
