<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Windows/macOS 中文字体名 → 容器内真实字体的显式别名。

  为什么需要：ppt-master 的 svg_to_pptx 转换器把 CJK 字体名解析成 Windows 家族名
  （Microsoft YaHei / SimHei / SimSun / KaiTi，见 FONT_FALLBACK_WIN）写进 pptx——
  面向用户本机 Office 打开，这个方向是对的。但容器里没有这些字体，LibreOffice 转
  预览 PDF 时静默兜底到 Noto CJK TTC 的【JP】变体（实测：简体中文用日文字形渲染，
  多数汉字相同、少数字形有差异，且完全静默）。docx/odt 预览同理。

  为什么别名目标是文泉驿/AR PL、而不是同样已安装的 Noto CJK SC（实测锚定，勿改回）：
  本镜像的 LibreOffice 对 10 个 face 合一的 NotoSansCJK-Regular.ttc 存在 face 索引缺陷
  ——即使文档【直接声明】"Noto Sans CJK SC"，导出 PDF 仍装载 TTC 的 0 号 face（JP）；
  fontconfig 层返回什么都救不了（FC_DEBUG 实测 14 次全部命中 SC、0 次 JP，PDF 里却是
  NotoSansCJKjp）。而指向单文件字体（wqy-microhei / gbsn00lp.ttf / gkai00mp.ttf）
  立刻正确内嵌。matplotlib 不受此影响（rc 里已直接用 WenQuanYi Zen Hei）。

  取舍备忘：AR PL 两款只覆盖 GB2312（约 6763 常用字），生僻字会继续走通用回退
  （可能再落回 JP face），故 prefer 里都垫了一层文泉驿微米黑（覆盖 GB18030）兜生僻字；
  常用汉字的字形正确性优先于宋体生僻字的风格一致性。

  日/韩别名刻意用 binding="weak"：Debian 的 65-nonlatin.conf 会往每个 sans-serif 查询
  prepend 一张大列表，MS Gothic 排在 Microsoft YaHei 前面——若 JP 别名是 strong，
  它会在所有中文回退链里抢在 SC 前面（第一版实测踩坑）。weak 只在真正请求日文字体时生效。

  镜像构建时有 fc-match + 真实 soffice 渲染双自检（见 Dockerfile），别名失效会在构建期炸掉。
-->
<fontconfig>
  <!-- 黑体系（无衬线） → 文泉驿微米黑（单文件，GB18030 覆盖） -->
  <alias binding="strong"><family>Microsoft YaHei</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>Microsoft YaHei UI</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>微软雅黑</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>SimHei</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>黑体</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>DengXian</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>等线</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>PingFang SC</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>Heiti SC</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>Source Han Sans SC</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>Source Han Sans CN</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>Noto Sans SC</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>

  <!-- 宋体/仿宋系（衬线） → AR PL 报宋（单文件），垫文泉驿兜 GB2312 外的生僻字 -->
  <alias binding="strong"><family>SimSun</family><prefer><family>AR PL SungtiL GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>宋体</family><prefer><family>AR PL SungtiL GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>NSimSun</family><prefer><family>AR PL SungtiL GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>新宋体</family><prefer><family>AR PL SungtiL GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>Songti SC</family><prefer><family>AR PL SungtiL GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>STSong</family><prefer><family>AR PL SungtiL GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>FangSong</family><prefer><family>AR PL SungtiL GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>仿宋</family><prefer><family>AR PL SungtiL GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>Source Han Serif SC</family><prefer><family>AR PL SungtiL GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>Noto Serif SC</family><prefer><family>AR PL SungtiL GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>

  <!-- 楷体系 → AR PL 中楷（单文件），同样垫文泉驿兜生僻字 -->
  <alias binding="strong"><family>KaiTi</family><prefer><family>AR PL KaitiM GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>楷体</family><prefer><family>AR PL KaitiM GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>STKaiti</family><prefer><family>AR PL KaitiM GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>Kaiti SC</family><prefer><family>AR PL KaitiM GB</family><family>WenQuanYi Micro Hei</family></prefer></alias>

  <!-- 繁体：明体走 AR PL 明体（单文件 Big5），黑体走文泉驿（覆盖 Big5 码位） -->
  <alias binding="strong"><family>Microsoft JhengHei</family><prefer><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>MingLiU</family><prefer><family>AR PL Mingti2L Big5</family><family>WenQuanYi Micro Hei</family></prefer></alias>
  <alias binding="strong"><family>PMingLiU</family><prefer><family>AR PL Mingti2L Big5</family><family>WenQuanYi Micro Hei</family></prefer></alias>

  <!-- 日/韩：weak——只在真正请求这些字体时生效，绝不能抢中文回退链（见文件头注释） -->
  <alias binding="weak"><family>Meiryo</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="weak"><family>Yu Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="weak"><family>MS Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="weak"><family>Malgun Gothic</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
</fontconfig>
