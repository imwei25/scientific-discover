<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Windows/macOS 中文字体名 → 容器内真实字体的显式别名。

  为什么需要：ppt-master 的 svg_to_pptx 转换器把 CJK 字体名解析成 Windows 家族名
  （Microsoft YaHei / SimHei / SimSun / KaiTi，见 FONT_FALLBACK_WIN）写进 pptx——
  面向用户本机 Office 打开，这个方向是对的。但容器里没有这些字体，LibreOffice 转
  预览 PDF 时按 fontconfig 兜底命中 Noto CJK TTC 的【JP】变体（实测：简体中文用
  日文字形变体渲染，多数汉字相同、少数字形有差异，且完全静默）。docx/odt 预览同理。

  这里把常见 Windows/macOS CJK 家族名显式别名到容器实际安装的 SC 字体
  （fc-list :lang=zh 实测：Noto Sans/Serif/Sans Mono CJK SC、AR PL KaitiM GB、
  文泉驿系列），使所有走 LibreOffice/fontconfig 的渲染都出正确的简体字形。
  不影响 pptx 内记录的字体名，用户下载后在自己机器上仍按原名解析。

  镜像构建时有 fc-match 自检（见 Dockerfile），别名失效会在构建期炸掉。
-->
<fontconfig>
  <!-- 黑体系（无衬线） → Noto Sans CJK SC -->
  <alias binding="strong"><family>Microsoft YaHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Microsoft YaHei UI</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>微软雅黑</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>SimHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>黑体</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>DengXian</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>等线</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>PingFang SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Heiti SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Source Han Sans SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Source Han Sans CN</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Noto Sans SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>

  <!-- 宋体/仿宋系（衬线） → Noto Serif CJK SC -->
  <alias binding="strong"><family>SimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>NSimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>新宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Songti SC</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>STSong</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>FangSong</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>仿宋</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Source Han Serif SC</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="strong"><family>Noto Serif SC</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>

  <!-- 楷体系 → AR PL KaitiM GB（容器内唯一真楷体字面） -->
  <alias binding="strong"><family>KaiTi</family><prefer><family>AR PL KaitiM GB</family></prefer></alias>
  <alias binding="strong"><family>楷体</family><prefer><family>AR PL KaitiM GB</family></prefer></alias>
  <alias binding="strong"><family>STKaiti</family><prefer><family>AR PL KaitiM GB</family></prefer></alias>
  <alias binding="strong"><family>Kaiti SC</family><prefer><family>AR PL KaitiM GB</family></prefer></alias>

  <!-- 繁体 / 日文 / 韩文：兜到对应 locale 变体，别再静默混字形 -->
  <alias binding="strong"><family>Microsoft JhengHei</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="strong"><family>MingLiU</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="strong"><family>PMingLiU</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="strong"><family>Meiryo</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>Yu Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>MS Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>Malgun Gothic</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
</fontconfig>
