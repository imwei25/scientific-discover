<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>用户管理台 · Niuma Science</title>
<style>
  :root { --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c; --fg:#e7ecf2; --mut:#93a1b0; --acc:#4f8cff; --ok:#39b57a; --warn:#e6a23c; --bad:#e05a5a; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--mut); font-size:12px; }
  header .spacer { flex:1; }
  .btn { border:1px solid var(--line); background:var(--panel2); color:var(--fg); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .btn:hover { border-color:var(--acc); }
  .btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  a.btn { text-decoration:none; }
  main { max-width:960px; margin:0 auto; padding:22px 20px 60px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:22px; }
  section h2 { font-size:14px; margin:0 0 14px; font-weight:600; }
  section h2 .hint { color:var(--mut); font-weight:400; font-size:12px; margin-left:8px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--mut); font-weight:500; font-size:12px; }
  td.name { font-weight:600; }
  select, input { background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:5px 8px; font-size:13px; }
  input.num { width:130px; }
  .bar { position:relative; height:8px; border-radius:5px; background:var(--panel2); overflow:hidden; min-width:120px; }
  .bar > i { position:absolute; inset:0 auto 0 0; background:var(--ok); }
  .bar.warn > i { background:var(--warn); } .bar.bad > i { background:var(--bad); }
  .usage { white-space:nowrap; font-variant-numeric:tabular-nums; }
  .usage .mut { color:var(--mut); }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; background:var(--panel2); border:1px solid var(--line); color:var(--mut); }
  .msg { font-size:13px; padding:8px 12px; border-radius:8px; margin-bottom:12px; display:none; }
  .msg.ok { display:block; background:rgba(57,181,122,.12); color:#7fe0ac; }
  .msg.err { display:block; background:rgba(224,90,90,.12); color:#ff9b9b; }
  .tiergrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .tiercard { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .tiercard .row { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .tiercard label { color:var(--mut); font-size:12px; width:56px; }
  .tiercard input { flex:1; }
  .foot { color:var(--mut); font-size:12px; margin-top:6px; }
  code { background:var(--panel2); padding:1px 5px; border-radius:5px; }
</style>
</head>
<body>
<header>
  <h1>用户管理台</h1>
  <span class="sub" id="whoami"></span>
  <span class="spacer"></span>
  <button class="btn" id="refresh" type="button">刷新</button>
  <a class="btn" href="./">返回对话</a>
</header>
<main>
  <div class="msg" id="msg"></div>

  <section>
    <h2>用户与今日用量<span class="hint">token = 输入+输出+推理合计，北京时间每日 0 点重置；改档位即时生效</span></h2>
    <table>
      <thead><tr><th style="width:22%">用户</th><th style="width:16%">档位</th><th style="width:32%">今日用量</th><th style="width:22%">剩余</th><th style="width:8%"></th></tr></thead>
      <tbody id="urows"><tr><td colspan="5" style="color:var(--mut)">加载中…</td></tr></tbody>
    </table>
    <div class="foot">新用户第一次访问后会自动出现在此表（默认档位）。也可手动指定：在下方任一用户行的下拉里改档，或直接编辑服务器上的 <code>deploy/state/users.json</code>。</div>
  </section>

  <section>
    <h2>档位与每日额度<span class="hint">改额度对该档位下所有用户即时生效；额度填 0 = 不限</span></h2>
    <div class="tiergrid" id="tiers"></div>
    <div class="row" style="display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap">
      <input id="ntKey" placeholder="新档位键（英文，如 vip）" style="width:170px" />
      <input id="ntLabel" placeholder="显示名（如 贵宾）" style="width:150px" />
      <input id="ntTokens" class="num" type="number" min="0" placeholder="每日 token（0=不限）" style="width:190px" />
      <button class="btn primary" id="addTier" type="button">新增/更新档位</button>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s)
const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString())
const msg = (t, ok) => { const m = $("#msg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); setTimeout(() => { m.className = "msg" }, 3500) }
async function jget(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json() }
async function jpost(url, body) { const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); return r.json() }

let TIERS = {}, DEFTIER = "free"

function usageCell(q) {
  if (q.unlimited) return `<span class="usage">${fmt(q.used)} <span class="mut">/ 不限</span></span>`
  const pct = q.limit > 0 ? Math.min(100, Math.round(q.used / q.limit * 100)) : 0
  const cls = pct >= 100 ? "bad" : pct >= 80 ? "warn" : ""
  return `<div style="display:flex;flex-direction:column;gap:5px">
    <span class="usage">${fmt(q.used)} <span class="mut">/ ${fmt(q.limit)}（${pct}%）</span></span>
    <div class="bar ${cls}"><i style="width:${pct}%"></i></div></div>`
}

function tierOptions(sel) {
  return Object.keys(TIERS).map((k) => `<option value="${k}"${k === sel ? " selected" : ""}>${TIERS[k].label || k}${TIERS[k].dailyTokens ? "（" + fmt(TIERS[k].dailyTokens) + "）" : "（不限）"}</option>`).join("")
}

async function load() {
  const d = await jget("api/admin/overview")
  TIERS = d.tiers || {}; DEFTIER = d.defaultTier || "free"
  // 用户表
  const tb = $("#urows")
  tb.innerHTML = d.users.map((q) => `<tr data-name="${q.name}">
    <td class="name">${q.name}</td>
    <td><select class="tiersel">${tierOptions(q.tier)}</select></td>
    <td>${usageCell(q)}</td>
    <td>${q.unlimited ? '<span class="pill">不限</span>' : fmt(q.remaining) + " tokens"}</td>
    <td><button class="btn save" type="button">保存</button></td>
  </tr>`).join("") || `<tr><td colspan="5" style="color:var(--mut)">暂无用户</td></tr>`
  tb.querySelectorAll("tr[data-name]").forEach((tr) => {
    tr.querySelector(".save").onclick = async () => {
      const name = tr.dataset.name, tier = tr.querySelector(".tiersel").value
      const r = await jpost("api/admin/user", { name, tier })
      if (r.ok) { msg(`已把 ${name} 设为「${TIERS[tier]?.label || tier}」`, true); load() } else msg(r.err || "保存失败", false)
    }
  })
  // 档位卡片
  $("#tiers").innerHTML = Object.keys(TIERS).map((k) => {
    const t = TIERS[k]
    return `<div class="tiercard" data-key="${k}">
      <div style="font-weight:600">${t.label || k} <span class="pill">${k}</span></div>
      <div class="row"><label>显示名</label><input class="tl" value="${(t.label || "").replace(/"/g, "&quot;")}" /></div>
      <div class="row"><label>每日额度</label><input class="tt num" type="number" min="0" value="${t.dailyTokens || 0}" /></div>
      <div class="row"><span style="color:var(--mut);font-size:12px;flex:1">0 = 不限</span><button class="btn save2" type="button">保存</button></div>
    </div>`
  }).join("")
  $("#tiers").querySelectorAll(".tiercard").forEach((c) => {
    c.querySelector(".save2").onclick = async () => {
      const key = c.dataset.key, label = c.querySelector(".tl").value.trim(), dailyTokens = Number(c.querySelector(".tt").value) || 0
      const r = await jpost("api/admin/tier", { key, label, dailyTokens })
      if (r.ok) { msg(`档位「${label || key}」已更新`, true); load() } else msg(r.err || "保存失败", false)
    }
  })
}

$("#refresh").onclick = load
$("#addTier").onclick = async () => {
  const key = $("#ntKey").value.trim(), label = $("#ntLabel").value.trim(), dailyTokens = Number($("#ntTokens").value) || 0
  if (!key) return msg("请填档位键", false)
  const r = await jpost("api/admin/tier", { key, label: label || key, dailyTokens })
  if (r.ok) { msg(`档位「${label || key}」已新增/更新`, true); $("#ntKey").value = $("#ntLabel").value = $("#ntTokens").value = ""; load() } else msg(r.err || "失败", false)
}
jget("api/quota").then((q) => { $("#whoami").textContent = `管理员：${q.name}` }).catch(() => {})
load().catch((e) => msg("加载失败：" + e.message, false))
</script>
</body>
</html>
