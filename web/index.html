<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>科研 Agent（自托管 · DeepSeek）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; }
  header { padding: 14px 20px; background: #1e293b; font-weight: 600; border-bottom: 1px solid #334155; }
  header small { color: #94a3b8; font-weight: 400; }
  main { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px; height: calc(100vh - 52px); }
  #chat { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 8px; background: #111827; border: 1px solid #334155; border-radius: 10px; }
  .msg { margin: 8px 0; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; line-height: 1.5; }
  .user { background: #2563eb; color: #fff; align-self: flex-end; max-width: 85%; margin-left: auto; }
  .bot { background: #1f2937; border: 1px solid #374151; max-width: 95%; }
  .tools { color: #38bdf8; font-size: 12px; margin: 4px 2px; font-family: ui-monospace, monospace; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  #q { flex: 1; padding: 11px; border-radius: 8px; border: 1px solid #475569; background: #0b1220; color: #e2e8f0; }
  button { padding: 11px 16px; border: 0; border-radius: 8px; background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  aside { background: #111827; border: 1px solid #334155; border-radius: 10px; padding: 14px; overflow-y: auto; }
  aside h3 { margin: 0 0 8px; font-size: 14px; color: #cbd5e1; }
  .panel { margin-bottom: 20px; }
  #files a { display: block; color: #7dd3fc; margin: 6px 0; text-decoration: none; word-break: break-all; }
  #up { width: 100%; font-size: 13px; color: #cbd5e1; }
  .hint { color: #64748b; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>科研 Agent <small>· 自托管 OpenCode + DeepSeek + 本地科学计算环境</small></header>
<main>
  <section id="chat">
    <div id="log"></div>
    <form id="f">
      <input id="q" placeholder="例如：分析 uploads/sample.csv，做线性回归并画图" autocomplete="off" />
      <button id="send" type="submit">发送</button>
    </form>
  </section>
  <aside>
    <div class="panel">
      <h3>① 上传数据文件</h3>
      <input id="up" type="file" />
      <div id="upmsg" class="hint">上传后会放进 uploads/，可在对话里让 agent 分析。</div>
    </div>
    <div class="panel">
      <h3>② 产出文件（可下载）</h3>
      <div id="files"><span class="hint">还没有产出</span></div>
    </div>
  </aside>
</main>
<script>
const log = document.getElementById("log")
const f = document.getElementById("f")
const q = document.getElementById("q")
const sendBtn = document.getElementById("send")
const filesEl = document.getElementById("files")

function add(cls, text) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d }
function renderFiles(list) {
  if (!list || !list.length) { filesEl.innerHTML = '<span class="hint">还没有产出</span>'; return }
  filesEl.innerHTML = ""
  for (const name of list) { const a = document.createElement("a"); a.href = "api/download?name=" + encodeURIComponent(name); a.textContent = "⬇ " + name; a.download = name; filesEl.appendChild(a) }
}
fetch("api/files").then(r => r.json()).then(renderFiles).catch(() => {})

f.addEventListener("submit", (e) => {
  e.preventDefault()
  const text = q.value.trim(); if (!text) return
  q.value = ""; sendBtn.disabled = true
  add("user", text)
  const tools = document.createElement("div"); tools.className = "tools"; log.appendChild(tools)
  const bot = add("bot", "…")
  const es = new EventSource("api/chat?q=" + encodeURIComponent(text))
  es.addEventListener("tool", (ev) => { const d = JSON.parse(ev.data); tools.textContent = `⚙ ${d.tool}: ${d.status}`; log.scrollTop = log.scrollHeight })
  es.addEventListener("text", (ev) => { bot.textContent = JSON.parse(ev.data); log.scrollTop = log.scrollHeight })
  es.addEventListener("final", (ev) => { const t = JSON.parse(ev.data).text; if (t) bot.textContent = t })
  es.addEventListener("files", (ev) => renderFiles(JSON.parse(ev.data)))
  es.addEventListener("done", () => { es.close(); sendBtn.disabled = false; tools.textContent = "" })
  es.onerror = () => { es.close(); sendBtn.disabled = false; if (bot.textContent === "…") bot.textContent = "(连接中断)" }
})

document.getElementById("up").addEventListener("change", async (e) => {
  const file = e.target.files[0]; if (!file) return
  const msg = document.getElementById("upmsg"); msg.textContent = "上传中…"
  const r = await fetch("api/upload?name=" + encodeURIComponent(file.name), { method: "POST", body: file })
  const j = await r.json()
  msg.textContent = `✅ 已上传 ${j.path}（${j.size} 字节）`
})
</script>
</body>
</html>
