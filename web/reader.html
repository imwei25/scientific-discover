        if (t === "inlineStr") val = tag(c, "t").map((x) => x.textContent).join("")
        else {
          const v = c.getElementsByTagName("v")[0]
          const raw = v ? v.textContent : ""
          if (t === "s") val = shared[Number(raw)] ?? ""
          else if (t === "b") val = raw === "1" ? "TRUE" : "FALSE"
          else if (t === "e") val = raw                     // 错误值（#DIV/0! 等）原样显示
          else if (raw !== "" && dateStyles.has(sIdx) && !isNaN(Number(raw))) val = excelDate(Number(raw))
          else val = raw
        }
        while (line.length < idx) line.push("")
        line[idx] = val
      }
      rows.push(line)
    }
    sheets.push({ name: en.name, rows, total: rowsXml.length })
  }
  return sheets
}

/** 把当前选中的工作表画出来（多表时上面带一个切换下拉） */
function renderXlsxSheet() {
  const V = XLSX_VIEW
  if (!V) return
  const sh = V.sheets[V.cur] || V.sheets[0]
  const rows = sh.rows.filter((r) => r.some((c) => String(c || "").trim() !== ""))
  const width = rows.reduce((m, r) => Math.max(m, r.length), 0)
  let h = '<div class="tablewrap">'
  if (V.sheets.length > 1) {
    h += '<div class="sheetbar"><span>工作表</span><select id="xlsxSheet">'
      + V.sheets.map((s, i) => '<option value="' + i + '"' + (i === V.cur ? " selected" : "") + ">" + esc(s.name) + "</option>").join("")
      + "</select><span>共 " + V.sheets.length + " 个</span></div>"
  }
  if (!rows.length) h += '<div class="docmsg">这个工作表是空的</div>'
  else {
    const head = rows[0], body = rows.slice(1)
    const cell = (r, i) => esc(r[i] == null ? "" : String(r[i]))
    h += "<table><thead><tr>"
      + Array.from({ length: width }, (_, i) => "<th>" + cell(head, i) + "</th>").join("")
      + "</tr></thead><tbody>"
      + body.map((r) => "<tr>" + Array.from({ length: width }, (_, i) => "<td>" + cell(r, i) + "</td>").join("") + "</tr>").join("")
      + "</tbody></table>"
    if (sh.total > XLSX_MAX_ROWS)
      h += '<div class="more">只显示前 ' + XLSX_MAX_ROWS + " 行（这张表共 " + sh.total + " 行）——完整的表交给分析那边读，不受这里影响。</div>"
  }
  $("docView").innerHTML = h + "</div>"
  const sel = $("xlsxSheet")
  if (sel) sel.addEventListener("change", () => { XLSX_VIEW.cur = Number(sel.value); renderXlsxSheet() })
}

/** csv/tsv → 表格。只画前 200 行：几万行的表全塞进 DOM 会把页面卡死，而左栏是用来"对着看"的。 */
/**
 * CSV/TSV 切行切格。**必须认引号**：裸按分隔符切的话，`table1.csv` 的效应量列
 * （`"均值差 1.00 (-2.02, 4.02)"`）会被劈成两格，那一行往右错一列而表头还在原位 ——
 * 看起来就像统计算错了。医生自己的表里"备注"列带逗号同样常见。
 */
function splitDelim(text, sep, maxRows) {
  const t = String(text).replace(/^﻿/, "").replace(/\r\n?/g, "\n")
  const rows = []
  let row = [], cell = "", inQ = false
  for (let i = 0; i < t.length; i++) {
    const c = t[i]
    if (inQ) {
      if (c !== '"') { cell += c; continue }
      if (t[i + 1] === '"') { cell += '"'; i++; continue }   // "" = 一个字面引号
      inQ = false
    } else if (c === '"' && !cell) inQ = true
    else if (c === sep) { row.push(cell); cell = "" }
    else if (c === "\n") {
      row.push(cell); cell = ""
      if (row.length > 1 || row[0].trim()) rows.push(row)    // 空行跳过
      row = []
      if (maxRows && rows.length >= maxRows) return rows
    } else cell += c
  }
  if (cell || row.length) { row.push(cell); rows.push(row) }
  return rows
}

function renderCsv(text, sep) {
  const rows = splitDelim(text, sep, 201).map((r) => r.map((c) => c.trim()))
  if (!rows.length) return '<div class="docmsg">这个文件是空的</div>'
  const head = rows[0], body = rows.slice(1, 201)
  return '<div class="tablewrap"><table><thead><tr>'
    + head.map((c) => "<th>" + esc(c) + "</th>").join("")
    + "</tr></thead><tbody>"
    + body.map((r) => "<tr>" + head.map((_, i) => "<td>" + esc(r[i] == null ? "" : r[i]) + "</td>").join("") + "</tr>").join("")
    + "</tbody></table>"
    + (rows.length > 200 ? '<div class="more">只显示前 200 行——完整的表交给分析那边读，不受这里影响。</div>' : "")
    + "</div>"
}

async function renderDoc() {
  const view = $("docView")
  if (!docName) {
    view.innerHTML = '<div class="docmsg">' + (isMulti() ? "还没有文件——点上面的「＋ 再传一张」传一份进来。" : "还没有文件") + "</div>"
    return
  }
  const e = extOf(docName)

  if (CFG.source.kind === "table") {
    $("zoomBox").hidden = true
    if (["csv", "tsv", "txt"].includes(e)) {
      view.innerHTML = '<div class="docmsg">正在读表…</div>'
      try {
        const r = await jget(docUrl())
        if (!r.ok) throw new Error("HTTP " + r.status)
        view.innerHTML = renderCsv(await r.text(), e === "tsv" ? "	" : ",")
      } catch (err) {
        if (String((err && err.message) || err) === "unauthorized") return
        view.innerHTML = '<div class="docmsg">这张表读不出来（' + esc(String((err && err.message) || err)) + '）。<br>不影响右边的分析——那边读的是文件本身。</div>'
      }
      return
    }
    // xlsx/xlsm：就地解析、渲染成表。xlsx 本身是个 zip，解压用浏览器自带的
    // DecompressionStream('deflate-raw')，所以【不引任何前端库】也能读（见 xlsxSheets）。
    // 旧版在这里只放一句"没法预览"，于是用户传了 xlsx 之后左边整片是灰的 —— 而这个模块的
    // 全部价值就是"左边摆着你的原表，算出来的数能对回去"。老的 .xls（BIFF 二进制，不是 zip）
    // 仍然读不了，那种情况照旧如实说明。
    if (["xlsx", "xlsm"].includes(e)) {
      view.innerHTML = '<div class="docmsg">正在读表…</div>'
      try {
        const r = await jget(docUrl())
        if (!r.ok) throw new Error("HTTP " + r.status)
        const sheets = await xlsxSheets(await r.arrayBuffer())
        if (!sheets.length) throw new Error("这个工作簿里没有工作表")
        XLSX_VIEW = { file: docName, sheets, cur: 0 }
        renderXlsxSheet()
        // 顺便把真表头喂给「变量对应」的下拉：服务端读不了 xlsx（不背二进制解析依赖），
        // 此前 xlsx 一律降级成手填列名 —— 而"列名写错"正是这个模块最高频的失败模式。
        const head = (sheets[0].rows[0] || []).map((x) => String(x == null ? "" : x).trim()).filter(Boolean)
        // 浏览器自己解析出来的表头：没有消歧处理，显示名与真列名同一份
        if (head.length && CFG.vars) { HEADERS = head; HEADER_VALS = head.slice(); HEADER_DUPES = []; HEADERS_WHY = ""; renderVars() }
      } catch (err) {
        if (String((err && err.message) || err) === "unauthorized") return
        view.innerHTML = '<div class="docmsg">这个 Excel 表在浏览器里没能解析（' + esc(String((err && err.message) || err)) + '）。<br><br>'
          + '<b>不影响分析</b>——右边每个模式读的都是文件本身。<br>'
          + '想核对内容可以点右上角「原文」下载，或先跑一次「数据体检」，它会把每一列的类型、缺失与分布都列出来。</div>'
      }
      return
    }
    // 老的 .xls（BIFF 二进制，不是 zip）：如实讲，别装作能预览
    view.innerHTML = '<div class="docmsg">老格式的 Excel（.' + esc(e) + '）在这里没法直接预览。<br><br>'
      + '<b>不影响分析</b>——右边每个模式读的都是文件本身。<br>'
      + '想在左栏直接看表，用 Excel 另存为 .xlsx 或 .csv 再传一次即可。</div>'
    return
  }

  const scalable = e !== "pdf"                       // PDF 用浏览器自带阅读器，缩放归它管
  $("zoomBox").hidden = !scalable
  const url = docUrl()
  // Word 走 /api/preview（服务端转 HTML/PDF），这一路是会失败的：没装 LibreOffice、
  // 转换超时、mammoth 抛错……iframe 的 error 事件【对 HTTP 错误不触发】，直接塞进去的话
  // 用户看到的是一框服务端返回的纯文本报错，还以为是正文。所以先探一次，失败就自己说人话。
  if (scalable) {
    view.innerHTML = '<div class="docmsg">正在转换以便预览…</div>'
    let msg = ""
    try {
      const r = await jget(url)
      if (!r.ok) msg = (await r.text().catch(() => "")) || "预览转换失败（HTTP " + r.status + "）"
    } catch (err) {
      if (String((err && err.message) || err) === "unauthorized") return
      msg = "预览请求没发出去（网络异常）"
    }
    if (msg) {
      view.innerHTML = '<div class="docmsg">' + esc(msg.slice(0, 300))
        + '<br><br>左栏只是预览——<b>不影响右边的各个模式</b>，那些读的是文件本身。'
        + '<br>想看原件可以点右上角「原文」下载到本地。</div>'
      return
    }
  }
  view.innerHTML = ""
  const f = document.createElement("iframe")
  f.id = "docFrame"
  // docx 预览是服务端 mammoth 直出的 HTML，响应头带 CSP sandbox（不许脚本、不接触本站源）；
  // PDF 走浏览器内置阅读器。两种都只读。
  f.src = url
  view.appendChild(f)
  applyZoom()
}
function applyZoom() {
  const f = $("docFrame"); if (!f) return
  const z = extOf(docName) !== "pdf" ? zoom : 1
  f.style.width = (100 / z) + "%"
  f.style.height = (100 / z) + "%"
  f.style.transform = "scale(" + z + ")"
  $("zval").textContent = Math.round(z * 100) + "%"
}
$("zoomIn").addEventListener("click", () => { zoom = Math.min(2, +(zoom + 0.1).toFixed(2)); applyZoom() })
$("zoomOut").addEventListener("click", () => { zoom = Math.max(0.6, +(zoom - 0.1).toFixed(2)); applyZoom() })
// （原来这里还有一个「原文」按钮，用 window.open 把原件开到新标签。已按要求撤掉：
//   左栏本来就在显示这份原文，而在桌面壳里 target=_blank 那条路未必通。）

/* ---- 右栏：模式条 ---- */
function renderRail() {
  // 跑起来 / 跑完时按钮的可点状态会变（跑的过程中不许删文件），顺手把文件条也重画一遍
  renderStrip()
  const rail = $("rail")
  rail.innerHTML = ""
  ORDER.forEach((k) => {
    const M = MODES[k]
    const b = document.createElement("button")
    b.type = "button"
    b.className = "tool-btn" + (k === mode ? " active" : "")
    b.title = M.label
    // chat 也走同一套 status。原来它只判 msgs.length，于是聊天轮一开跑右条上就是【绿点（已完成）】，
    // 失败了还是绿点 —— 而 S.chat.status 本来就在 run()/close()/failRun 里被正常维护着。
    const st = S[k].status === "running" ? "run" : S[k].status === "error" ? "err"
      : S[k].status === "done" ? "done" : (k === "chat" && S.chat.msgs.length ? "done" : "")
    b.innerHTML = M.icon + "<span>" + esc(M.label) + "</span>" + (st ? '<i class="dot ' + st + '"></i>' : "")
    b.addEventListener("click", () => onRail(k))
    rail.appendChild(b)
  })
}

/**
 * 这个模式现在跑得了吗？跑不了要说清缺什么，而不是发出去让模型自己发现。
 * need 的三种写法（定义在 workflows.mjs 的 modes[].need）：
 *   "data"        需要配套数值表（refcheck 的数据完整性）
 *   "var:xxx"     需要「变量对应」里指定某一列（stats 的基线表要分组列）
 *   "after:yyy"   需要先跑过另一个模式（humanize 的改动对照要先有润色稿）
 */
function blockedBy(k) {
  const M = MODES[k]
  const miss = []
  for (const n of M.need || []) {
    if (n === "data" && !dataFiles.length) miss.push({ kind: "data" })
    else if (n.startsWith("var:")) { const f = n.slice(4); const v = SETTINGS[f]; if (v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length)) miss.push({ kind: "var", field: f }) }
    else if (n.startsWith("after:")) { const m2 = n.slice(6); if (!S[m2] || S[m2].status === "idle") miss.push({ kind: "after", mode: m2 }) }
  }
  return miss.length ? miss : null
}

/**
 * 点模式按钮：【只切过去看，不开跑】。
 * ★ 这里原来是"没跑过就顺手跑一轮"。改掉的原因：点一下模式条就直接开始，等于用户还没看清
 *   这个模式要干什么、也还没来得及改设置/补数值表，一轮就已经发出去了（花掉额度，且要停下来
 *   得再找终止按钮）。现在切过去只看到空面板 + 上方的「开始」，什么时候跑由用户说了算。
 *   面板中央那个大按钮和上方的「开始」是同一件事，都走 tryRun。
 */
function onRail(k) {
  const fresh = S[k] && S[k].status === "idle"     // 这个模式还一轮都没跑过
  setMode(k)
  if (k === "chat") { $("q").focus(); return }
  // 没跑过 → 把设置摊开：这些口径（严格程度 / 语言 / 是否保护引用）跑完再改就得整轮重来，
  // 所以先问一遍，用户填完点弹层里的「开始」就直接开跑。
  // ★ 只在这里做。setMode 还会被恢复会话、首次进入调用，那两处弹出来纯属打扰。
  // 模块没有任何设置项时不弹空弹层，用户照常点头部的「开始」。
  // ★ 必须延到本次点击【冒泡完】再弹：document 上那个"点空白处收起菜单"的监听会在本函数
  //   返回之后才跑（模式条按钮身上没有 data-act），同步打开的话会被它当场关掉 —— 表现就是
  //   "点了模式条，设置闪一下就没了"。
  //   settingsSeen() 也必须在延迟【之后】判：从一个开着设置的模式切过来时，"用户已看过"这件事
  //   正是由那个 document 监听记下的，同步判会读到旧值，于是一模一样的设置又弹一遍。
  if (fresh && !busy() && (CFG.settings || []).length) {
    setTimeout(() => { if (!settingsSeen()) openSettings(true) }, 0)
  }
}

/** 缺前置条件：就地说清缺什么、并把用户送到能补上它的地方（展开变量面板 / 亮出上传按钮） */
/** 闸红横幅 + 「仍要出件」。只在闸红（或已放行）时出现 —— 常驻一个"绕过质量闸"的按钮
 *  等于明示可以绕，而绝大多数情况下闸是对的，该改稿就得改稿。与聊天页 gateBypassBtn 同一个接口。 */
function gateBannerHtml() {
  if (!GATES.length && !BYPASS) return ""
  const names = GATES.map((id) => GATE_STEPS.find((s) => s.id === id)?.name || id)
  const body = BYPASS
    ? "你已放行本会话的拦截：闸未过也能出件。" + (names.length ? `「${names.join("、")}」仍判定为未通过——出的件没有过闸。` : "")
    : `质量闸未过：「${names.join("、")}」。Markdown 稿件照常产出，但 Word / PDF 送审件会被拦下，`
      + "直到改完稿子并重新跑一遍那道闸。若你判断是误判（报告通篇英文、或结论其实是「通过」却被读成红），可以放行。"
  return '<div class="notebox ' + (BYPASS ? "info" : "err") + '" id="gateBanner">' + esc(body)
    + ' <button class="gbypass" data-on="' + (BYPASS ? "1" : "0") + '">' + (BYPASS ? "恢复拦截" : "仍要出件") + "</button></div>"
}
// 事件委托：横幅是 innerHTML 拼出来的，每次 render 都换新节点，挂不住直接绑定的监听
document.addEventListener("click", async (e) => {
  const b = e.target.closest(".gbypass"); if (!b || !sid) return
  const on = b.dataset.on !== "1"
  b.disabled = true
  try {
    const r = await jget("api/workflow/gate-bypass", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sid, on }) }).then((x) => x.json())
    BYPASS = !!r.on
  } catch (_) { b.disabled = false; return }
  render(mode)
})
function showBlocked(k, miss) {
  const M = MODES[k]
  S[k].err = ""
  const parts = miss.map((x) => {
    if (x.kind === "data") return "还没有配套的数值表"
    if (x.kind === "var") { const f = fieldDef(x.field); return "还没指定「" + (f ? f.label : x.field) + "」" }
    if (x.kind === "after") return "得先跑一次「" + (MODES[x.mode] ? MODES[x.mode].label : x.mode) + "」"
    return ""
  }).filter(Boolean)
  S[k].block = parts.join("；") + "。" + (M.needHint || "")
  // 缺的是什么【种类】要留着：render 据此决定要不要在提示下面摆一个上传按钮。
  // 只留文字的话，用户看到"请先上传配套的数值表"却没有任何地方能传 —— 死路一条。
  S[k].blockMiss = miss
  if (miss.some((x) => x.kind === "var")) {
    $("varsBox").open = true
    renderVars(miss.filter((x) => x.kind === "var").map((x) => x.field))
  }
  render(k)
}

function setMode(k) {
  mode = k
  ORDER.forEach((x) => { const el = $("pane-" + x); if (el) el.classList.toggle("on", x === k) })
  const M = MODES[k]
  $("paneTitle").innerHTML = M.icon + "<span>" + esc(M.label) + "</span>"
  document.querySelector(".ai-head .badge").textContent = M.badge
  // 输入框（智能助手 + 有结果的模式的追问入口）、头部那几个按钮（开始 / 终止 / 重新生成）
  // 与底栏的显隐都由 updateFoot 一处决定，
  // 别在这里再写一遍：两处各判一次，迟早会出现"切模式时对、跑完又不对"的错位。
  renderRail()
  render(k)
  $("aiBody").scrollTop = 0
}

/**
 * 起一轮的【唯一入口】——先过前置条件闸，再决定发不发。
 *
 * ★ 这里踩过一次：闸只接在了模式条那一个入口上，而面板中央那个按钮和「重新生成」都直接调
 *   run()。于是 refcheck 里点面板里的「数据完整性」，没有数值表也照发；stats 的「基线表」
 *   没指分组列也照发 —— 右边条子拦得住、面板里拦不住，同一件事两种行为。
 *   凡是"起一轮"都必须走这里。
 */
function tryRun(k, force, stage2) {
  if (busy()) return
  const miss = blockedBy(k)
  if (miss) { setMode(k); showBlocked(k, miss); return }
  run(k, force, undefined, false, stage2)
}
$("btnResume").addEventListener("click", () => resumeDropped(mode))
$("btnRerun").addEventListener("click", () => tryRun(mode, true))
$("btnGo").addEventListener("click", () => tryRun(mode))
$("btnHalt").addEventListener("click", abortRun)
// 面板里那些按钮每次重画都会换一个新的 DOM 节点，所以一律走委托，别逐个绑
$("aiBody").addEventListener("click", (e) => {
  const b = e.target.closest("[data-run]")
  if (b) { tryRun(b.dataset.run); return }
  const s2 = e.target.closest("[data-stage2]")       // 阶段卡上的「按这份大纲出片」
  if (s2) { tryRun(s2.dataset.stage2, false, true); return }
  const rs = e.target.closest("[data-resume]")       // 断线后那条提示里的「继续」（与头部那颗同一个动作）
  if (rs) { resumeDropped(rs.dataset.resume); return }
  const p = e.target.closest("[data-pv]")            // 产物那一行的「预览」
  if (p) { openPv(p.dataset.pv); return }
  const add = e.target.closest("[data-dataadd]")     // 配套数值表：添加
  if (add) { pickDataFiles(); return }
  const del = e.target.closest("[data-datadel]")     // 配套数值表：移除某一份
  if (del) removeDataFile(del.dataset.datadel)
})

/* ============================================================
   5. 面板渲染
   ============================================================ */
function runHtml(m) {
  if (!RUN || RUN.mode !== m) return ""
  const tools = [...RUN.tools.values()]
  const live = tools.filter((t) => t.status === "running" || t.status === "pending").length
  return '<div class="runbox"><div class="rh"><span class="spin"></span><span>' + esc(RUN.label) + "</span></div>"
    + (RUN.skills.length ? '<div class="pills">' + RUN.skills.map((s) => '<span class="pill">' + esc(s) + "</span>").join("") + "</div>" : "")
    + (tools.length ? '<details><summary>工具调用（' + tools.length + (live ? "，" + live + " 个在跑" : "") + "）</summary>"
        + tools.map((t) => '<div class="trow"><span class="st">' + (t.status === "completed" ? "✓" : t.status === "error" ? "✕" : "○") + "</span><span>" + esc(t.label) + "</span></div>").join("")
        + "</details>" : "")
    + "</div>"
}
/* 图片产物直接【铺出来】，不只列一行文件名。
   【为什么】统计分析 / 出版级图跑完，图就在产物里，但一行 "plot_km.png" + 一颗眼睛按钮，
   看上去与一份 csv 没有任何区别 —— 用户的原话是"统计分析完没有作图"，实际是图出了、
   但屏幕上没有任何一个像图的东西。缩略图点一下仍走同一个预览浮层（看大图 / 下载）。
   脱敏对照表这类 isSecret 的文件不铺（它本来就不许在界面里展示）。 */
function thumbsHtml(list) {
  const imgs = (list || []).filter((n) => PV_IMG.test(n) && !isSecret(n)).slice(0, 8)
  if (!imgs.length) return ""
  return '<div class="figs">' + imgs.map((n) =>
    '<figure class="fig" data-pv="' + esc(n) + '" title="点开看大图">'
    + '<img loading="lazy" alt="' + esc(n) + '" src="api/raw?name=' + encodeURIComponent(n) + sidQ() + '">'
    + "<figcaption>" + esc(String(n).split("/").pop()) + "</figcaption></figure>").join("") + "</div>"
}
function filesHtml(list, title) {
  if (!list || !list.length) return ""
  return thumbsHtml(list) + '<div class="files"><div class="ft">' + esc(title || "本轮产物") + "</div>" + list.map((n) => {
    // download 属性只给最后一段：带 "pdfs/" 前缀的话浏览器保存时会把斜杠清洗成怪名字
    const dl = '<a class="fbtn" href="api/download?name=' + encodeURIComponent(n) + sidQ()
      + '" download="' + esc(String(n).split("/").pop()) + '" title="下载" aria-label="下载 ' + esc(n) + '">' + ICON.download + "</a>"
    // 预览不再是 target=_blank 的链接：.md/.csv/.json/.py 这些浏览器只会下载不会显示，
    // 点下去新标签一闪就没 —— 症状正是"点了没反应"。改成就地开预览浮层（眼睛按钮）。
    const act = isSecret(n) ? '<span class="fnote" title="含可还原到个人的对照信息，不在界面内展示">不在界面内预览</span>'
      : canPv(n) ? '<button type="button" class="fbtn" title="预览" aria-label="预览 ' + esc(n) + '" data-pv="' + esc(n) + '">' + ICON.eye + "</button>"
      : ""   // 预览不了的类型（xlsx/zip…）不给假按钮，只留下载
    return '<div class="frow">' + ICON.file + "<b>" + esc(n) + "</b>" + act + dl + "</div>"
  }).join("") + "</div>"
}

/* ---- 产物预览浮层 ----
   能力对齐聊天页（index.html）的半屏预览，但这里是居中浮层：阅读器已经是"左原文 / 中助手 /
   右模式条"三列，再劈一半会把两边都挤没。
   分工与左栏 renderDoc 一致：pdf/html/图片/纯文本/表格前端自己渲染，Word/PPT 交服务端
   /api/preview 转换（那一路会失败——没装 LibreOffice、转换超时——所以先探一次再塞 iframe）。 */
const PV_IMG = /\.(png|jpe?g|gif|webp|svg|bmp)$/i
const PV_MD = /\.(md|markdown)$/i
const PV_CSV = /\.[ct]sv$/i
const PV_TXT = /\.(txt|log|json|ya?ml|py|r|sh|ps1|sql|bib|tex|js|mjs|css|ini|toml)$/i
const PV_PDF = /\.pdf$/i
const PV_HTML = /\.html?$/i
const PV_OFFICE = /\.(docx?|pptx?|odt|odp)$/i
const canPv = (n) => PV_IMG.test(n) || PV_MD.test(n) || PV_CSV.test(n) || PV_TXT.test(n) || PV_PDF.test(n) || PV_HTML.test(n) || PV_OFFICE.test(n)
// 脱敏还原表（真名/住院号 ↔ 假名）绝不内联预览：那等于把病人真名铺在界面上。判据与
// index.html 的 SECRET_RE、workflows.mjs 的 secret 组保持一致；下载保留（用户在自己机器上看）。
const SECRET_RE = /(mapping|_map|crosswalk|keyfile|对照表|还原表)[^/]*\.csv$/i
const isSecret = (n) => SECRET_RE.test(String(n).split("/").pop())
const PV_MAXTXT = 400000   // 文本/表格最多读这么多字节，几十 MB 的日志会把页面卡死

function closePv() { $("pvMask").classList.remove("on"); $("pvBody").innerHTML = "" }
$("pvClose").addEventListener("click", closePv)
// 按下与松开都在遮罩上才关：预览里拖选文字、松手滑出到遮罩时，click 会落到共同祖先（遮罩）上，误关预览
let pvDownOnMask = false
$("pvMask").addEventListener("pointerdown", (e) => { pvDownOnMask = (e.target === $("pvMask")) })
$("pvMask").addEventListener("click", (e) => { if (pvDownOnMask && e.target === $("pvMask")) closePv(); pvDownOnMask = false })
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("pvMask").classList.contains("on")) closePv() })

async function openPv(name) {
  const body = $("pvBody")
  const q = "?name=" + encodeURIComponent(name) + sidQ()
  $("pvName").textContent = name
  $("pvDl").href = "api/download" + q
  const e = extOf(name)
  $("pvMask").classList.add("on")
  body.className = "pvbody"
  body.innerHTML = '<div class="pvmsg">正在打开…</div>'

  const fail = (msg) => { body.className = "pvbody"; body.innerHTML = '<div class="pvmsg">' + esc(msg) + "<br><br>可以点右上角「下载」，在本机打开。</div>" }
  const frame = (url) => { body.className = "pvbody"; body.innerHTML = ""; const f = document.createElement("iframe"); f.src = url; body.appendChild(f) }

  try {
    if (PV_IMG.test(name)) {
      body.className = "pvbody pad"
      body.innerHTML = '<img class="shot" alt="' + esc(name) + '" src="api/raw' + q + '">'
      return
    }
    if (PV_PDF.test(name) || PV_HTML.test(name)) { frame("api/raw" + q); return }   // html 由服务端带 CSP sandbox
    if (PV_OFFICE.test(name)) {
      // 先探一次：iframe 的 error 事件对 HTTP 错误不触发，直接塞进去用户会看到一框英文报错当成正文
      const r = await jget("api/preview" + q)
      if (!r.ok) { fail((await r.text().catch(() => "")) || "预览转换失败（HTTP " + r.status + "）"); return }
      frame("api/preview" + q)
      return
    }
    const r = await jget("api/raw" + q)
    if (!r.ok) { fail((await r.text().catch(() => "")) || "打不开这个文件（HTTP " + r.status + "）"); return }
    let t = await r.text()
    const cut = t.length > PV_MAXTXT
    if (cut) t = t.slice(0, PV_MAXTXT)
    body.className = "pvbody" + (PV_CSV.test(name) ? "" : " pad")
    if (PV_CSV.test(name)) body.innerHTML = renderCsv(t, e === "tsv" ? "\t" : ",")
    else if (PV_MD.test(name)) body.innerHTML = '<div class="md">' + renderMd(t) + "</div>"
    else body.innerHTML = '<pre class="txt">' + esc(t) + "</pre>"
    if (cut) body.insertAdjacentHTML("beforeend", '<div class="pvcut">文件较大，这里只显示了前 ' + Math.round(PV_MAXTXT / 1000) + ' 千字符；完整内容请下载。</div>')
  } catch (err) {
    if (String((err && err.message) || err) === "unauthorized") return
    fail("打不开这个文件（" + String((err && err.message) || err) + "）")
  }
}
function emptyHtml(m) {
  const [big, sub] = MODES[m].empty
  // 空面板里必须有个能直接点的按钮：上一轮还在跑的时候，点右边模式条只会把你切过来看
  //（同一时刻只能跑一轮），此时若面板里只有一句提示，用户会以为"点了没反应"而反复点。
  // 这个按钮在忙的时候是禁用态并写明在等谁，忙完点它就能开跑。
  const btn = m === "chat" ? ""
    : '<div style="margin-top:16px"><button class="hbtn" data-run="' + m + '"' + (busy() ? " disabled" : "") + ">"
      // 带上与头部「开始」同一枚三角：这两个按钮做的是同一件事，别让人以为是两个入口。
      // 按钮文字直接用模式名。别拼成"开始"+模式名——「开始基线表」「开始数据完整性」都不是人话，
      // 而这几个名字本身就是动宾结构，单独摆着就是一个动作。忙的时候写明在等谁。
      + (busy() ? "" : ICON.play)
      + (busy() ? "等「" + esc(MODES[RUN ? RUN.mode : CFG.first].label) + "」跑完" : esc(MODES[m].label)) + "</button></div>"
  return '<div class="empty-hint"><span class="big">' + esc(big) + "</span>" + esc(sub) + btn + "</div>"
}

/** 一串问答 → 气泡。智能助手那一格与各模式的追问区共用（同一种消息，就该长同一个样）。 */
function bubblesHtml(list) {
  return (list || []).map((m) => {
    if (m.role === "user") return '<div class="msg user"><div class="bubble">' + esc(m.text) + "</div></div>"
    if (m.role === "tag") return '<div class="msg tag"><div class="bubble">' + esc(m.text) + "</div></div>"
    return '<div class="msg ai"><div class="bubble"><div class="who">' + ICON.bot + "助手</div>"
      + '<div class="md">' + renderMd(m.text) + "</div>" + filesHtml(m.files) + "</div></div>"
  }).join("")
}

/** 结果下面那串追问。没问过就整块不画 —— 空的标题栏只会让人以为这里少了点什么。 */
function askHtml(m) {
  const qa = (S[m] && S[m].qa) || []
  if (!qa.length) return ""
  const n = askCount(m)
  return '<div class="askwrap"><div class="askt">' + ICON.chat + "追问（" + n + " 条）·"
    + " 转交给智能助手时会一起带过去</div>" + bubblesHtml(qa) + "</div>"
}

/* ---- 两阶段模式（「演示 PPT」）：现在到哪一步、下一步点哪里 ----
   判据全落在【产物】上，不靠任何前端状态：
     没有大纲                → 还没开跑（空态自己会说话，不画卡）
     有大纲、没有 .pptx      → 第 1 步已完成，等用户点「按这份大纲出片」
     有 .pptx                → 第 2 步已完成，卡里给"预览幻灯片 / 下载"
   这样刷新页面、换台机器打开都还原得出来 —— 阶段不是记在内存里的一个变量。 */
function stageFinals(m) {
  const st = MODES[m] && MODES[m].stage2
  if (!st || !st.done) return []
  return outputs.map((f) => f.name).filter((n) => st.done.test(n))
}
function stageCardHtml(m) {
  const st = MODES[m] && MODES[m].stage2
  if (!st) return ""
  const s = S[m]
  // 第二阶段正在跑。★ 判据不能只看 RUN.stage2：页面刷新后是 attach() 直接把 RUN 设起来的
  //   （没走 run()，那面旗子丢了）。"这一格的主结果轮正在跑、而大纲已经在手" ⇒ 只能是在出片
  //   （重跑第一步走的是 force，force 会先把 doc 清掉）。
  if (RUN && RUN.mode === m && !RUN.ask && (RUN.stage2 || s.doc != null))
    return '<div class="stagecard"><div class="sc-step">第 2 步 / 2 · 出片中</div>'
      + '<div class="sc-md md">' + renderMd(st.running) + "</div></div>"
  // 断线且后台已跑完：产物目录还没重新读过（afterRun 没跑），所以 stageFinals 此刻看到的是
  // 【旧的】—— 片子可能早就出好了，卡片却会显示成"第 1 步、请出片"。那颗按钮一点就是
  // 白跑十分钟出第二份一模一样的片子。所以这一态既不给出片按钮，也不下"到第几步"的结论。
  if (s.dropped && !s.dropped.ask)
    return '<div class="stagecard"><div class="sc-step">上一轮的结果还没取回来</div>'
      + '<div class="sc-md md">连接中断了，而后台那一轮已经跑完 —— 现在看到的进度可能是旧的（片子也许已经出好了）。'
      + '先把结果取回来再决定下一步，<b>别直接点出片</b>，那会白跑一遍十分钟。</div>'
      + '<div class="sc-act"><button type="button" class="sc-go" data-resume="' + esc(m) + '">' + ICON.play + "继续</button></div></div>"
  const finals = stageFinals(m)
  if (finals.length) {
    const f = finals[0]
    return '<div class="stagecard ok"><div class="sc-step">第 2 步 / 2 · 已完成</div>'
      + '<div class="sc-md md">' + renderMd(st.doneNote) + "</div>"
      + '<div class="sc-act">'
      + (canPv(f) ? '<button type="button" class="sc-go" data-pv="' + esc(f) + '">' + ICON.eye + "预览幻灯片</button>" : "")
      + '<a class="hbtn" href="api/download?name=' + encodeURIComponent(f) + sidQ()
        + '" download="' + esc(String(f).split("/").pop()) + '">' + ICON.download + "下载 .pptx</a>"
      + '<span class="sc-hint">' + esc(String(f).split("/").pop()) + "</span></div></div>"
  }
  // 还没跑过第一步 → 不画卡（空态里那颗「演示 PPT」就是入口，两处按钮反而让人不知道点哪个）
  if (s.doc == null && !(s.raw || "").trim()) return ""
  return '<div class="stagecard"><div class="sc-step">第 1 步 / 2 · 大纲已出</div>'
    + '<div class="sc-md md">' + renderMd(st.note) + "</div>"
    + '<div class="sc-act"><button type="button" class="sc-go" data-stage2="' + esc(m) + '"'
      + (busy() ? " disabled" : "") + ">" + (busy() ? "" : ICON.play) + esc(st.btn) + "</button>"
    + '<span class="sc-hint">' + (busy() ? "等上一轮跑完" : "约十分钟") + "</span></div></div>"
}

function render(m) {
  const el = $("pane-" + m)
  if (m === "chat") return renderChat()
  const s = S[m]
  // 追问那一轮的直播条要挂在【问答串末尾】（那是它正在说话的地方），不能顶在结果上面 ——
  // 顶在上面看着像"整份结果在重跑"，而它恰恰是"不重跑"的那条路。
  const asking = !!RUN && RUN.mode === m && RUN.ask
  let h = asking ? "" : runHtml(m)
  // ★ 缺前置条件的提示必须【真的画出来】。此前 showBlocked 只把它写进 S[k].block 就完了，
  //   没有任何渲染代码读它 —— 于是用户点了按钮，界面纹丝不动、只剩一句通用空态文案，
  //   完全不知道是缺了分组列还是缺了数值表。（我自己也差点漏过：当时是从 S[k].block
  //   这个状态确认"闸生效"的，而屏幕上根本没有这句话。看状态不等于看见。）
  if (s.block) h += '<div class="notebox warn">' + esc(s.block) + "</div>"
  h += gateBannerHtml()
  // 配套数值表的清单卡：需要它的模式一直摆在最上面（不是"缺了才出现"），
  // 传了哪几份、还能不能再加、想删哪一份，全在这张卡里，用户不必读完警告再去找地方传。
  h += dataCardHtml(m)
  const drop = dropNoteHtml(m)
  if (drop) h += drop                        // 断线提示【顶替】报错条：它俩说的是同一件事
  else if (s.err) h += '<div class="notebox err">⚠ ' + esc(s.err) + "</div>"
  // 阶段卡（两阶段模式才有）摆在正文最上面：用户第一眼要知道的是"这只是大纲、下一步点这里"，
  // 而不是先读完一整篇大纲再自己琢磨"片子在哪"。
  h += stageCardHtml(m)
  const stg = MODES[m].stage2
  const staged = !!stg && !!stageFinals(m).length     // 两阶段模式且已出片 → 大纲让位给成品
  // 产物是 Word / PPT 时，正文嵌服务端预览（二进制读成文本就是满屏乱码，见 loadDocFor）
  if (s.docPv) {
    h += '<div class="notebox info">正文来自产物文件 <b>' + esc(s.docName)
      + "</b>（Word 文件，这里是转换出来的预览，样式与真实排版会有出入）。"
      + "<b>如果这份稿子带修订，预览显示的是「接受全部修订后」的样子</b>——"
      + "删掉的原文不会出现在这里；要逐条看改动、逐条接受或拒绝，请下载后在 Word 的「审阅」里看。</div>"
      + '<div class="card docpv"><iframe title="' + esc(s.docName) + '" src="api/preview?name='
      + encodeURIComponent(s.docPv) + sidQ() + '"></iframe></div>'
  } else if (s.docPvErr) {
    h += '<div class="notebox warn">产物 <b>' + esc(s.docName) + "</b> 是 Word / PPT 文件，"
      + "预览转换没成功（" + esc(s.docPvErr) + "）。可以在下方下载，用本机的 Word 打开。</div>"
  }
  // 正文优先用产物文件（翻译/大纲是写进文件的，对话里只有一句"已完成"），没有就用对话正文
  const body = s.doc != null ? s.doc : s.raw
  if (body && body.trim()) {
    if (s.doc != null && s.docName && !stg) h += '<div class="notebox info">正文来自产物文件 <b>' + esc(s.docName) + "</b>，可在下方下载。</div>"
    // 产物本身就是一张表（基线表就是 table1.csv）时按【表】渲染。markdown 渲染器眼里 csv 只是
    // 一段普通文字：逗号、引号原样铺开，表头和数据糊成一坨 —— 用户点开「基线表」看到的
    // 不是一张三线表，而是一段乱码似的文本，第一反应是"它算错了"。
    const bodyHtml = (s.doc != null && PV_CSV.test(s.docName))
      ? '<div class="card">' + renderCsv(s.doc, /\.tsv$/i.test(s.docName) ? "\t" : ",") + "</div>"
      : '<div class="card md">' + renderMd(body) + "</div>"
    h += staged
      ? '<details class="foldbody"><summary>这套片子的大纲（' + esc(s.docName || "ppt_outline.md") + "）</summary>" + bodyHtml + "</details>"
      : bodyHtml
    // ★ 两阶段模式必须把模型那一轮【说的话】也留一份出口。正文一律优先画产物文件，于是
    //   模型说的（"第 7 页缺原文数据，我写了「原文未报告」"、"共 16 页、封面用了…"）整段被顶掉 ——
    //   这正是"点了 PPT 只看见大纲"里最难自查的一环：屏幕上没有任何线索表明它还说过话。
    //   折起来放，不与正文抢位置，但谁都找得到。
    if (stg && s.doc != null && (s.raw || "").trim() && s.raw.trim() !== s.doc.trim())
      h += '<details class="foldbody"><summary>助手这一轮说的话</summary><div class="card md">' + renderMd(s.raw) + "</div></details>"
  } else if (s.status === "running") {
    if (!RUN || RUN.mode !== m) h += '<div class="notebox info">正在生成…</div>'
  } else if (s.status !== "idle" && !s.err && !s.dropped && !s.pulling) {
    // ★ dropped / pulling 时不许再说这句：那时上面已经画了"点「继续」取回来"，
    //   两条并排（一条说重跑、一条说取回）用户只会照着更显眼的那条去重跑。
    h += '<div class="notebox warn">这一轮没有产出可显示的正文。可以点右上角「重新生成」再来一次。</div>'
  } else if (s.status === "idle") {
    h += emptyHtml(m)   // 空态摆在数值表清单【之后】：先看到"要传什么/传了什么"，再看到"点这里开始"
  }
  h += filesHtml(s.files)
  h += askHtml(m)
  if (asking) h += runHtml(m)
  el.innerHTML = h
  updateFoot()
}

/* 断线之后那条提示：文案 + 【就地】一颗「继续」。头部那颗图标虽然也在，但报错就在眼前时
   手会往报错上点 —— 同一个动作给两个入口。追问那一路不画这条（它的通知已经在追问串里了，
   同一句话说两遍反而让人以为断了两次）。 */
function dropNoteHtml(m) {
  const s = S[m]
  if (!s) return ""
  if (s.pulling) return '<div class="notebox info">正在把那一轮的结果取回来…</div>'
  if (!s.dropped || s.dropped.ask) return ""
  return '<div class="notebox warn">⚠ 连接中断了，而后台这一轮已经跑完了。结果还在服务端 —— 点「继续」取回来，不用重跑。'
    + '<button type="button" class="gbypass" data-resume="' + esc(m) + '">继续</button></div>'
}

function renderChat() {
  const el = $("pane-chat")
  const s = S.chat
  // 还没聊过 → 空态。但产物栏要留着：用户可能是跑完几个模式后切过来找那份 Word 的。
  // ★ 判据要看"在跑的是不是【本格】"。原来写的是 !RUN —— 别的模式在跑时 RUN 非空但 msgs 为空，
  //   于是既不走空态、下面又什么都拼不出来（bubblesHtml([])=""、RUN.mode!=="chat" 不加 runbox），
  //   最终 innerHTML = ""：用户点进「智能助手」看到的是一整列纯白 + 一个禁用的发送钮，零解释。
  if (!s.msgs.length && !(RUN && RUN.mode === "chat")) { el.innerHTML = emptyHtml("chat") + filesHtml(s.files, "本会话产物"); updateFoot(); return }
  let h = bubblesHtml(s.msgs)
  if (RUN && RUN.mode === "chat") h += runHtml("chat")
  const drop = dropNoteHtml("chat")
  if (drop) h += drop                        // 断线提示【顶替】报错条：它俩说的是同一件事
  else if (s.err) h += '<div class="notebox err">⚠ ' + esc(s.err) + "</div>"
  // 没被任何模式认领的产物挂在这一格底部。两种来源：① 在这里让它"导成 Word"生成的 docx；
  // ② 模式跑出来但文件名不合该模式 out 契约的。阅读器【没有】工作台那样的全局产出侧栏，
  // 不在这兜住的话，文件确实生成了、会话目录里也在，而界面上没有任何一处能点开或下载。
  h += filesHtml(s.files, "本会话产物")
  el.innerHTML = h
  updateFoot()
}

/**
 * 头部按钮 + 底栏 + 输入框的显隐【只在这里判一次】。规则：
 *   智能助手：头部三个按钮全收起（它的开跑入口是输入框旁边的发送）。
 *   其它模式：还没跑过 → 只有「开始」；正在跑这一个 → 只有「终止」；跑完 / 出错 → 只有「重新生成」。
 *            别的模式在跑时，「开始」留着但置灰，并在提示里写清在等谁 —— 直接藏掉的话，
 *            用户会以为这个模式坏了。
 *   输入框：智能助手一直有；其它模式【跑出结果之后】也有（那是追问入口，见 askReady）。
 *          ★ 输入框只有这一个、且在面板【外面】—— 画进面板里的话，每次 SSE 重绘（120ms 一次）
 *            都会把用户正在打的字和光标冲掉。
 */
function updateFoot() {
  const running = !!RUN
  // 聊天：发送与终止共用同一个位置，互斥显示（与工作台的 setStreamingUI 同一套规矩）
  $("btnSend").hidden = running
  $("btnStop").hidden = !running
  $("btnSend").disabled = busy()

  const mine = !!RUN && RUN.mode === mode                 // 正在跑的就是当前这个模式
  const s = mode === "chat" ? null : S[mode]
  $("btnHalt").hidden = mode === "chat" || !mine
  $("btnGo").hidden = mode === "chat" || mine || (s && s.status !== "idle")
  // 别的模式在跑 → 置灰。此时 .pill 的悬停展开是不生效的（:hover:not([disabled])），
  // 所以"在等谁"这句话必须由下面的底栏说出来，不能只指望这个按钮。
  $("btnGo").disabled = busy()
  $("btnRerun").hidden = mode === "chat" || !s || s.status === "idle" || busy()
  // 「继续」：只在这一格【断线且后台已跑完】时露出来（聊天格同样会遇到，所以不排除它）。
  // 与「重新生成」并排放、不互相顶掉：取回失败时用户还得有重跑那条退路。
  const dropped = !!(S[mode] && S[mode].dropped)
  $("btnResume").hidden = !dropped || busy() || !!(S[mode] && S[mode].pulling)
  // 转交：这一格真的跑出东西了才给。跑到一半 / 出错的面板上摆一颗"转交"，转过去的是半截结果。
  $("btnHoff").hidden = !hoffReady(mode)

  // 追问入口：这一格有结果了就把输入框放出来（智能助手那一格一直有）
  const canAsk = mode !== "chat" && askReady(mode)
  const showComposer = mode === "chat" || canAsk
  $("composer").hidden = !showComposer
  // 交接卡只属于智能助手那一格。不加这一句的话，转交完切回某个有结果的模式，卡片还挂在
  // 输入框上写着"随你下一条消息一起发出"，而这里打的字是【追问】，根本带不上它。
  $("hoffChip").hidden = !handoff || mode !== "chat"
  if (canAsk) {
    qEl.placeholder = "对着这份「" + MODES[mode].label + "」的结果追问，例如：第 2 条能不能再说细一点？"
  } else if (mode === "chat") {
    qEl.placeholder = CHAT_PH
  }

  let foot = ""
  if (mode !== "chat") {
    // 两阶段模式停在"大纲已出、还没出片"时，底栏那句话必须跟着改。原来这里会说
    // "已完成。想接着这份结果聊…"或"追问只针对这份结果" —— 两句都在暗示"事儿办完了"，
    // 而真正的成品（.pptx）还没生成，用户正是在这一步以为它做完了。
    const stg = MODES[mode].stage2
    const pend = !!stg && s && s.status === "done" && s.doc != null && !stageFinals(mode).length
    foot = mine ? RUN.label
      : RUN ? "「" + MODES[RUN.mode].label + "」正在跑，跑完才能开下一轮"
      // 断线态排在 pend / canAsk 之前：此刻面板上显示的东西可能整个是旧的，
      // 先别跟用户聊"下一步做什么"，先让他把结果取回来。
      : S[mode] && S[mode].pulling ? "正在把那一轮的结果取回来…"
      : dropped ? "连接断了，而后台那一轮已经跑完。点上方的「继续」把结果取回来，不用重跑。"
      : pend ? "这还只是大纲。点面板里的「" + stg.btn + "」才会生成 .pptx；想先改风格 / 页数 / 配图，在下方输入框说一句。"
      : canAsk ? "追问只针对这份结果，不会重跑「" + MODES[mode].label + "」；转交给智能助手时会连追问一起带过去。"
      : s.status === "done" ? "已完成。想接着这份结果聊，点上方的「转交给智能助手」。"
      : s.status === "error" ? "上一轮没有正常结束。"
      : ""
  }
  // 有输入框时这句话挂在输入框下面那一行，别再单独摆一条状态栏 —— 同一屏两条底栏，
  // 用户会以为下面那条是另一个东西的状态。
  $("chatFoot").textContent = mode === "chat" ? CHAT_FOOT : foot
  $("modeFootTxt").textContent = showComposer ? "" : foot
  // 没话可说时整条收起来：还没开跑的空面板底下挂一条空白栏，只会让人以为这里少了点什么
  $("modeFoot").hidden = mode === "chat" || showComposer || !foot
}

/** 滚到底（用户往上翻看内容时不要把他拽回来） */
function follow() {
  const b = $("aiBody")
  if (b.scrollHeight - b.scrollTop - b.clientHeight < 90) b.scrollTop = b.scrollHeight
}

/* ============================================================
   6. 发起一轮 + SSE 直播
   ============================================================ */
/**
 * @param m       模式
 * @param force   true = 用户点了「重新生成」（已有内容时先清掉，免得新旧混在一起）
 * @param userTxt 用户打的那句话（智能助手的提问，或某一格结果下面的追问）
 * @param ask     true = 这是【追问】：不重跑这个模式，问答落在该格的追问区（S[m].qa）
 * @param stage2  true = 两阶段模式的第二步（「按这份大纲出片」）：仍是这一格的【主结果】，
 *                但不是重跑第一步 —— 大纲要留着（成品出来后折进正文里给用户核对讲稿），
 *                大纲下面那串追问也要留着（它们问的还是这一版大纲，没有作废）。
 */
async function run(m, force, userTxt, ask, stage2) {
  if (busy()) return
  if (!sid || !docName) return
  const s = S[m]
  s.block = ""; s.blockMiss = null      // 真开跑了就把"缺前置条件"的提示撤掉
  // 上一轮断线没取回来、这一轮又开跑了 → 那面旗子作废（否则「继续」会一直挂着，
  // 点下去取回的是【上一轮】的回复，把这一轮的结果盖掉）。
  s.dropped = null; s.pulling = false
  if (m !== "chat" && !ask) {
    if (force) { s.raw = ""; s.doc = null; s.docName = ""; s.docPv = ""; s.docPvErr = ""; s.files = [] }
    // 主结果重跑一次，旧追问就作废——它们问的是【上一版】结果，留着只会让人对着新结果
    // 读到一串答非所问的问答，而看不出这是上一版留下的。（第二阶段不算重跑，见上面 @param）
    if (!stage2) s.qa = []
  }

  let q = ""
  let myHoff = null                     // 本轮带出去的交接卡（发送失败时要还回去）
  if (ask) {
    q = String(userTxt || "").trim()
    if (!q) return
    // 追问标记来自配置（MODES[m].askMark），与主结果的 mark 是两个不同的标记：模型据此
    // 知道"别重跑"，刷新页面后前端也据此把这一轮认回追问区而不是当成又一次主结果。
    // ★ 不拼 settingsBlock()：那段话里有「顺便出投稿级图」这类【动作型】设定，
    //   跟在一句"这条为什么判黄"后面发出去，很可能真的又画一张图。语言口径在同一个会话的
    //   上文里已经生效，不必每条追问都重申。
    q = MODES[m].askMark + q
    s.qa.push({ role: "user", text: userTxt })
  } else if (m === "chat") {
    q = String(userTxt || "").trim()
    if (!q) return
    // 会话里还没跑过任何一轮 → agent 手上没有原文，先补一句上下文（正常路径是导读先跑，
    // 只有导读失败 / 用户一进来就直接提问才会走到这里）
    // 文案同样来自配置：数据模块里"我上传了一篇文献 `队列.xlsx`"会把模型往"读文献"上带一步，
    // 而它手里是一张表。{doc} 展开成本会话的【全部】文件（数据常常分散在主表 + 随访表里）。
    if (!turns) {
      const tpl = (CFG.chat && CFG.chat.firstTurn) || "我上传了 {doc}，请先读它再回答。我的问题是："
      // 数据模块的"那份东西"是一组表（docListStr 就是它）；文献 / 稿件模块只有左栏这一份。
      // 别在这里用 docListStr 兜底：对那几个模块它返回的是【配套数值表】，不是正文那份。
      const src = CFG.source.kind === "table" ? docListStr() : ""
      q = tpl.replace("{doc}", src || "`" + docName + "`") + q
    }
    // 待发的交接卡拼在最前面（取走即清，与工作台的 wfCardPrefix 同一套规矩）。面板里对应地
    // 留一条转交记录 —— 卡片本身不进气泡，气泡里只有用户自己打的那句话。
    if (handoff) { myHoff = handoff; handoff = null; renderHoff(); q = myHoff.card + "\n\n" + q; s.msgs.push({ role: "tag", text: myHoff.tag }) }
    s.msgs.push({ role: "user", text: userTxt })
  } else {
    q = promptFor(m, stage2)
    if (!q) return
  }

  s.status = "running"; s.err = ""
  RUN = { mode: m, ask: !!ask, stage2: !!stage2, label: "正在提交…", skills: [], tools: new Map(), es: null }
  starting = true
  // 开跑了就把「变量对应」收起来：它的用处是【跑之前】核对列名，这一刻起用户要看的是直播条与结果。
  // 摊开着的话它占去面板上半屏，结果被挤在下面那条缝里——正是"跑完了什么都看不见"的观感。
  // 想改回来点一下标题就展开，值一个都没丢（缺列时 showBlocked 会重新把它顶开）。
  { const vb = $("varsBox"); if (vb && !vb.hidden) vb.open = false }
  renderRail(); render(m)

  let j = null, why = "网络异常"
  try {
    const resp = await jget("api/chat/start", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        q, sid,
        // module 只在会话【还没发过消息】时起作用（服务端对已绑定的会话忽略它）。
        // 必须带：上传接口已经把会话建出来了，不带的话它会被判成自由对话——没有模块前言、
        // 没有技能闸，而界面上一点异样都看不出来。
        // ★ 必须是 MOD，不能写死。写死成 "litread" 时，核查 / 润色 / 统计的会话全都被绑成
        //   文献研读：前言是别人的、技能闸是别人的，而界面照常显示本模块的样子。
        module: turns ? undefined : MOD,
        // ★ 每一轮都带上，不是只带第一轮。服务端这一侧是 merge 而不是覆盖，重复发无害；
        //   而只发第一轮会漏掉一整类情况：会话由 /api/upload 先建出来、此时还【没有模块绑定】，
        //   用户在第一轮跑之前（或第一轮失败之后）改设置，saveSettings 走的 /api/workflow/form
        //   有个 `sessionModule(sid) === modId` 的条件，不满足就【静默不写】还回 ok:true。
        //   于是 protectRefs / hasPHI 这些 pin 字段悄悄退回默认值——正是它们存在的意义所在。
        wfForm: wfFormValues(),
      }),
    })
    if (resp.status === 429) why = "请求过于频繁，请稍后再试"
    try { j = await resp.json() } catch (_) { if (resp.status !== 429) why = "服务端错误（HTTP " + resp.status + "）" }
  } catch (e) {
    if (String((e && e.message) || e) === "unauthorized") return
  }
  starting = false

  if (!j) { failRun(m, why, ask); return }
  if (j.sid) { sid = j.sid; try { history.replaceState(null, "", location.pathname + "?sid=" + encodeURIComponent(sid)) } catch (_) {} }
  if (!j.sent) {
    // 服务端没收下这条：上一轮还在跑、额度用尽、模块未开通…… 一律如实说，别让转圈一直转
    failRun(m, (j.running ? "上一轮还在进行中，本条没有发出去。" : "") + (j.err || j.notice || "发送失败"), ask)
    if (ask) {
      // 这条追问没发出去 → 气泡撤掉，并把用户打的那句话【放回输入框】。
      // 只撤气泡不还字的话，他得对着一句"发送失败"重新把问题打一遍。
      s.qa.pop()                       // 刚 push 进去的就是它（这期间 busy() 拦着，不会有别的）
      qEl.value = userTxt
      qEl.dispatchEvent(new Event("input"))
      render(m)
    } else if (m === "chat") {
      S.chat.msgs.pop()                                                   // 用户气泡
      // 交接卡也得还回去（连同那条转交记录一起撤掉）：不还的话用户按提示重发一次，
      // 这一次就【不带】交接卡了 —— 模型不知道在谈哪一轮，而用户完全看不出少了什么。
      if (myHoff) { S.chat.msgs.pop(); handoff = myHoff; renderHoff() }
      renderChat()
    }
    return
  }
  turns++
  attach(m, ask)
}

/**
 * 一轮没起来 / 中途挂了。
 * ★ 追问失败【不能】把这一格判成 error：主结果好好地摆在那儿，把面板标红、把「重新生成」
 *   亮出来，等于诱导用户为了一句问不出来的追问，把整份结果重跑一遍（十几分钟 + 一轮额度）。
 *   所以失败只作为一条记录落在追问串里，这一格仍然是「已完成」。
 */
function failRun(m, msg, ask) {
  RUN = null
  if (ask) { S[m].status = "done"; S[m].qa.push({ role: "tag", text: "⚠ 这条追问没成功：" + msg }) }
  else { S[m].status = "error"; S[m].err = msg }
  renderRail(); render(m); updateFoot()
}

/**
 * @param m    模式
 * @param ask  这一轮是不是追问（决定正文往哪儿落：追问区 / 主结果）
 */
function attach(m, ask) {
  const es = new EventSource("api/chat/attach?sid=" + encodeURIComponent(sid))
  if (!RUN) RUN = { mode: m, ask: !!ask, label: "正在生成…", skills: [], tools: new Map(), es: null }
  RUN.es = es
  RUN.label = "等待模型输出…"
  // 起轮成功了，先把"正在提交…"换掉——第一个 SSE 事件可能要等十几秒才来。
  // ★ 必须连 renderRail（它会顺手重画文件条）一起。attach 是【RUN 被设上却没走 run()】的唯一入口：
  //   restore() 里刷新页面接回一轮还在跑的会话时，enterReader() 已经按"不忙"把文件条画完了，
  //   紧接着 attach 把 RUN 设上——文件条却停在旧快照上：「＋ 再传一张」和「×」看着完全可点，
  //   点下去被 busy() 挡掉，一点反应都没有。用户报的"点了没反应"就是这条路。
  renderRail(); render(m); updateFoot()
  let raw = ""
  let aiMsg = null                       // 这一轮的助手气泡（聊天 / 追问才有）
  let finished = false
  let paintT = 0
  // 正文往哪儿落：智能助手 → 那一格的对话；追问 → 该模式结果下面的追问串；
  // 主结果 → S[m].raw（那不是对话，是这一格的正文）。三条路只在这里分一次。
  const thread = m === "chat" ? S.chat.msgs : ask ? S[m].qa : null
  const bubble = () => { if (!aiMsg) { aiMsg = { role: "ai", text: "" }; thread.push(aiMsg) } return aiMsg }
  const repaint = () => { paintT = 0; render(m); follow() }
  const schedule = () => { if (!paintT) paintT = setTimeout(repaint, 120) }

  const close = (note, isErr) => {
    if (finished) return
    finished = true
    if (paintT) { clearTimeout(paintT); paintT = 0 }
    es.close()
    RUN = null
    const s = S[m]
    // 追问出错不动这一格的状态（主结果还好好地在那儿），错误作为一条记录落进追问串。见 failRun。
    s.status = isErr && !ask ? "error" : "done"
    if (note) {
      if (isErr && !ask) s.err = note
      else if (thread) thread.push({ role: "tag", text: (isErr ? "⚠ " : "") + note })
    }
    if (!thread) s.raw = raw
    // 一个字都没收到、也没有任何收尾说明 → 十有八九是【我们接上来之前那一轮就已经跑完了】：
    // api/job 报 running 与 attach 真正接上之间有时间差，服务端此时只回一个 idle 事件。
    // 这与断线是同一种局面（结果在服务端、只是这条订阅没赶上），所以同样给「继续」——
    // 原来这里会落到"这一轮没有产出可显示的正文，点「重新生成」"，而重跑要再花一遍时间和额度。
    if (!thread && !note && !String(raw || "").trim()) s.dropped = { ask: false }
    // ★ 除了重画跑完的那一格，【当前可见的那一格也得重画】。空态里那颗中央大按钮是按 busy()
    //   渲染的：用户在 A 跑的时候切到没跑过的 B，B 的按钮是灰的、写着"等「A」跑完"；A 跑完只重画
    //   A，B 就永远停在那句话上——而头部的「开始」倒是恢复了，同屏出现"上面能点、中间灰着且在等
    //   一个早就跑完的模式"。同一个 busy() 快照也卡住了配套数值表卡的添加/删除按钮。
    afterRun(m).then(() => { renderRail(); render(m); if (mode !== m) render(mode); updateFoot(); follow() })
  }

  es.addEventListener("tool", (ev) => {
    let d; try { d = JSON.parse(ev.data) } catch (_) { return }
    if (d.tool === "skill") { if (d.skill && !RUN.skills.includes(d.skill)) RUN.skills.push(d.skill); schedule(); return }
    RUN.tools.set(d.callID, { status: d.status, label: d.title ? d.tool + " · " + d.title : d.tool })
    const live = [...RUN.tools.values()].filter((t) => t.status === "running" || t.status === "pending").length
    RUN.label = live ? "工具运行中（" + live + "）…" : "等待模型输出…"
    schedule()
  })
  es.addEventListener("reasoning", () => { if (RUN) { RUN.label = "思考中…"; schedule() } })
  es.addEventListener("text", (ev) => {
    try { raw = JSON.parse(ev.data) } catch (_) { return }
    if (RUN) RUN.label = "正在输出…"
    if (thread) bubble().text = raw
    else S[m].raw = raw
    schedule()
  })
  es.addEventListener("final", (ev) => {
    try { const t = JSON.parse(ev.data).text; if (t) raw = t } catch (_) {}
    if (thread) bubble().text = raw
    else S[m].raw = raw
    schedule()
  })
  // 服务端推的是【本轮新建/改动的产物】文件名数组（字符串）。
  // 聊天模式【也要列】，但挂在当轮那条回复下面（不是单独一栏），这样既不打断对话，
  // 又不会出现"文件生成了却无处可取"——数据模块里「导成 Word」正是发生在这一格。
  // 追问同理挂在当条回答下面：虽然前言里让它"别为一句追问再产出文件"，真产出了也得能点到。
  es.addEventListener("files", (ev) => {
    let l; try { l = JSON.parse(ev.data) } catch (_) { return }
    const names = Array.isArray(l) ? l.filter((x) => typeof x === "string") : []
    if (!names.length) return
    if (thread) bubble().files = names
    else S[m].files = names
    schedule()
  })
  es.addEventListener("queue", (ev) => {
    let d; try { d = JSON.parse(ev.data) } catch (_) { return }
    if (!RUN) return
    RUN.label = !d || !d.queued ? "等待模型输出…"
      : d.rateLimited ? "上游限速中，正在等待重试…"
      : "正在云端排队（第 " + (d.position || 1) + " 位）…"
    schedule()
  })
  // 闸状态：轮末服务端会广播一次。不订阅的话，闸刚判红时本页毫无表示，
  // 用户要等下一次刷新才知道自己的 Word 为什么出不来。
  es.addEventListener("workflow", (ev) => {
    try {
      const w = JSON.parse(ev.data)
      GATES = w.failed || []
      if (w.gateBypass !== undefined) BYPASS = !!w.gateBypass
      render(mode)
    } catch (_) {}
  })
  es.addEventListener("done", () => close(""))
  es.addEventListener("aborted", () => close("已终止本轮。", false))
  es.addEventListener("failed", (ev) => { let msg = "本轮出错"; try { msg = JSON.parse(ev.data).message } catch (_) {} close(msg, true) })
  es.addEventListener("idle", () => close(""))      // 接上去时后台已经没有进行中的一轮
  es.onerror = () => {
    if (finished) return
    // 后台还在跑，只是这条订阅断了（网络抖动 / 网关重启）。等一下再接一次，别把用户吓成"失败了"。
    finished = true
    es.close(); RUN = null
    render(m)
    setTimeout(async () => {
      if (RUN || !sid) return
      let running = false
      try { running = (await jget("api/job?sid=" + encodeURIComponent(sid)).then((r) => r.json())).running } catch (_) {}
      if (running) { finished = false; attach(m, ask) }
      // 后台那一轮【已经跑完了】：结果就在服务端（产物落了盘、回复进了历史），断的只是这条订阅。
      // 所以这里不是"失败"，而是"没收到"—— 出路是把它取回来（见 resumeDropped），不是重跑。
      // ★ 原来这两句写的是"点「重新生成」可以再来一次"/"可以再问一次"：用户照着做，等于把已经
      //   做好的东西再花一遍时间和额度做一次（PPT 那一格是十分钟起）。dropped 这面旗子让
      //   「继续」按钮、阶段卡、底栏三处都知道现在缺的只是一次取回。
      else if (ask) {
        S[m].status = "done"; S[m].dropped = { ask: true }
        // drop:true 标记这条记录是"断线通知"而不是真实问答 —— 取回成功后要把它删掉
        S[m].qa.push({ role: "tag", text: "⚠ 连接中断了，而后台这一轮已经答完了。点上方的「继续」把回答取回来，不用再问一遍。", drop: true })
        renderRail(); render(m); updateFoot()
      }
      else {
        S[m].status = "error"; S[m].dropped = { ask: false }
        S[m].err = "连接中断了，而后台这一轮已经跑完了。点「继续」把结果取回来——不用重跑。"
        renderRail(); render(m); updateFoot()
      }
    }, 2500)
  }
}

/**
 * 「继续」：订阅断了、而后台那一轮已经跑完 —— 把结果从服务端取回来，【不重跑】。
 *
 * 取的东西与刷新页面时 restore() 用的是同一批（api/history + api/outputs），只是范围收到这一格：
 * 历史里属于本格最后一轮的那条回复 + 产物目录 + 该模式的正文文件。
 * 所以能取回来的前提也一样：那一轮真的跑完了（这条路径进来之前刚问过 api/job，running=false）。
 *
 * ★ 取不到就【如实说】并把「重新生成」交回给用户。假装成功（status=done 而面板空着）
 *   比报错难查得多：用户看到"已完成"却什么都没有，只会以为模型这一轮什么都没做。
 */
async function resumeDropped(m) {
  const s = S[m], d = s && s.dropped
  if (!d || !sid || busy() || s.pulling) return
  s.pulling = true; s.err = ""; render(m); updateFoot()
  let hist = []
  try { hist = await jget("api/history?sid=" + encodeURIComponent(sid)).then((r) => (r.ok ? r.json() : [])) } catch (_) {}
  // 走一遍历史认轮次归属（与 restore 同一套判据：靠 user 消息开头的模式标记），
  // 留【最后一条】命中的回复 —— 同一格可能跑过好几轮，用户要的是最近那一版。
  let cur = null, curAsk = false, hit = null
  for (const msg of Array.isArray(hist) ? hist : []) {
    if (msg.role === "user") { const r = routeOf(msg.text || ""); cur = r.m; curAsk = r.ask; continue }
    if (cur === m && curAsk === !!d.ask) hit = msg
  }
  s.pulling = false
  if (!hit || !String(hit.text || "").trim()) {
    s.err = "没能把那一轮的结果取回来（历史里找不到这一格的回复）。点「重新生成」再跑一次。"
    if (!d.ask && m !== "chat") s.status = "error"
    s.dropped = null; renderRail(); render(m); updateFoot(); return
  }
  if (m === "chat") s.msgs.push({ role: hit.isError ? "tag" : "ai", text: hit.text })
  else if (d.ask) {
    s.qa = (s.qa || []).filter((x) => !x.drop)     // 那条"连接中断"的记录不留：结果已经在下面了
    s.qa.push({ role: hit.isError ? "tag" : "ai", text: hit.text })
    s.status = "done"
  } else {
    s.raw = hit.text
    s.status = hit.isError ? "error" : "done"
    s.err = hit.isError ? hit.text : ""
  }
  s.dropped = null
  await afterRun(m)      // 产物与正文文件一起刷新 —— 两阶段模式的阶段卡也靠它翻页
  renderRail(); render(m); updateFoot()
}

/** 一轮跑完：把该模式对应的产物文件读回来（翻译 / 大纲的正文在文件里，不在对话里） */
async function afterRun(m) {
  await refreshOutputs()
  collectOrphanFiles()          // 聊天格底部那一栏：谁都不认领的产物
  if (m === "chat") return
  await loadDocFor(m)
  collectFiles(m)
}
async function refreshOutputs() {
  try { outputs = await jget("api/outputs?sid=" + encodeURIComponent(sid)).then((r) => (r.ok ? r.json() : [])) } catch (_) { outputs = [] }
}
/**
 * 该模式要在自己面板下方列哪些产物。
 * 两个来源合并：① SSE 的 files 事件（本轮真正新建/改动的，最准）；② 产物目录里按约定名匹配的
 * （刷新页面后 ① 已经没了，且子目录产物 ① 有时给不全）。
 * ★ 必须按模式过滤：一股脑列全部产物的话，翻译面板下面会挂着导读的 md、PPT 的 pptx，
 *   用户点开发现不是自己要的东西。
 */
function collectFiles(m) {
  if (m === "chat" || !MODES[m].out) return
  const named = outputs.map((f) => f.name).filter((n) => MODES[m].out.test(n))
  S[m].files = [...new Set([...(S[m].files || []), ...named])].slice(0, 12)
}

/**
 * 谁都不认领的产物 → 挂到智能助手那一格底部。
 * 【为什么需要】各模式只列自己 out 契约认得的文件名，而真实产物经常落在契约之外：在聊天里让它
 * 「导成 Word」生成的 docx、模型给报告起了个契约没覆盖的名字（fig1.tiff、km_results.csv…）。
 * 阅读器没有工作台那样的全局产出侧栏，这些文件就成了"生成了但界面上摸不着"。刷新页面后
 * SSE 的 files 事件也没了，所以这一栏必须从 outputs 现算，不能只靠当轮推送。
 */
function collectOrphanFiles() {
  // 已经挂在某条回复下面的不再重复列一遍（同一格里同一个文件出现两次，看着像生成了两份）。
  // 追问那几条回复下面挂的也算 —— 它们同样是"用户已经在界面上看得见的文件"。
  const shown = new Set([
    ...S.chat.msgs.flatMap((m) => m.files || []),
    ...ORDER.flatMap((k) => ((S[k] && S[k].qa) || []).flatMap((x) => x.files || [])),
  ])
  const claimed = (n) => shown.has(n) || ORDER.some((k) => k !== "chat" && MODES[k].out && MODES[k].out.test(n))
  S.chat.files = outputs.map((f) => f.name).filter((n) => !claimed(n)).slice(0, 12)
}

async function loadDocFor(m) {
  const re = MODES[m].file
  if (!re) return
  // ★ 别 sort()。/api/outputs 已经【按 mtime 倒序】返回，再字典序排一遍就把"最新"丢了：
  //   返工出的 reading_guide_v2.md 会被 reading_guide.md 盖过；润色分段产出多份 *_humanized.md 时
  //   取到的是 abstract_humanized.md 而不是最新那份。用户看到的正文是旧的，而他刚跑完新的。
  const hit = outputs.map((f) => f.name).filter((n) => re.test(n))[0]
  if (!hit) return
  // ★ Word / PPT 这类二进制产物【不能】当文本读。原来这里一律 r.text()，于是就地改写
  //   出来的 manuscript_humanized.docx 被整篇塞进正文 —— 屏幕上是一大片 PK…ÿØÿà 的乱码，
  //   用户第一反应是"它把我的稿子写坏了"。走服务端 /api/preview（docx 由 mammoth 转 HTML），
  //   面板里嵌 iframe 显示。先探一次再嵌：iframe 的 error 事件对 HTTP 错误不触发，
  //   转换失败的话用户看到的会是一框英文报错，还以为那就是正文（openPv 同款做法）。
  if (PV_OFFICE.test(hit)) {
    S[m].docName = hit; S[m].doc = null; S[m].docPv = ""; S[m].docPvErr = ""
    try {
      const r = await jget("api/preview?name=" + encodeURIComponent(hit) + sidQ())
      if (r.ok) S[m].docPv = hit
      else S[m].docPvErr = (await r.text().catch(() => "")) || "预览转换失败（HTTP " + r.status + "）"
    } catch (_) { S[m].docPvErr = "预览转换失败" }
    return
  }
  try {
    const r = await jget("api/raw?name=" + encodeURIComponent(hit) + sidQ())
    if (!r.ok) return
    const t = await r.text()
    if (t && t.trim()) { S[m].doc = t; S[m].docName = hit }
  } catch (_) {}
}

/* ============================================================
   6.5 转交给智能助手
   ------------------------------------------------------------
   【它解决的是什么】四个模式共用同一个会话，所以切到智能助手时【模型手上】的上下文本来就全在。
   但用户看到的是一格空白面板 —— 刚看完的那份译文 / 核查报告在这一格里连个影子都没有，
   于是他要么以为"切过来就断片了"，要么把整段结果复制粘贴一遍再问。这颗按钮把那份结果
   明确地"交"过去：面板里留一条转交记录，模型那边收到一张交接卡（说清转交的是哪一轮、
   产物在哪个文件、不要重跑）。

   【不自动发送】交接卡只是挂到输入框上，随用户下一句话一起发出去。点一下就自动发一轮的话，
   得到的只会是一句"好的我看到了"—— 白烧一轮额度。这与聊天页「下一步」气泡的规矩是同一条。

   【覆盖 / 续写】智能助手那一格已经聊过东西时才问：
     覆盖 = 那些问答用户不要了 → 面板清空，交接卡里明写"别再接前面的话头"；
     续写 = 接着聊 → 面板保留，交接卡挂在末尾。
   ★ 一句实话：会话是共用的，opencode 那边【删不掉】已经发生过的对话，所以"覆盖"能做到的是
     「界面上不再显示 + 明确告诉模型翻篇」，不是把它从模型记忆里抹掉。别在文案里把它说成
     "清空会话"，那是承诺一件做不到的事。
   ============================================================ */
let handoff = null            // 待随下一条聊天消息发出的交接卡：{mode,label,replace,asks,card,tag,snapshot}
const HOFF_END = "【以上为界面转交的上下文，不是用户输入】"
// 交接卡在【历史里是留着的】（不像工作台的任务卡由服务端剥掉）：刷新页面后靠它才认得出
// "这一轮是转交过来的、当时选的是覆盖还是续写、连带了几条追问"，否则覆盖掉的那几轮会在
// 刷新后原样长回来。显示时由前端剥掉（stripHoff），用户气泡里只留他自己打的那句话。
// ★ 追问条数写进标题里，是因为刷新后【只有这一行】还能告诉界面"当时带过去的不止主结果"——
//   追问本身留在那一格里，转交记录这边看不见它们。
const HOFF_ASK = "(?: · 含 \\d+ 条追问)?"
const HOFF_HEAD_RE = /^【转交 · 「([^」]*)」 · (覆盖|续写)(?: · 含 (\d+) 条追问)?】/
const HOFF_RE = new RegExp("^【转交 · 「[^」]*」 · (?:覆盖|续写)" + HOFF_ASK + "】[\\s\\S]*?" + HOFF_END + "\\n*")
const hoffOf = (t) => { const m = HOFF_HEAD_RE.exec(String(t || "")); return m ? { label: m[1], replace: m[2] === "覆盖", asks: +(m[3] || 0) } : null }
const stripHoff = (t) => String(t || "").replace(HOFF_RE, "").trim()
const hoffTag = (label, replace, asks) => "已把「" + label + "」的结果"
  + (asks ? "连同 " + asks + " 条追问" : "") + "转交过来" + (replace ? "（此前的问答已按你的选择清掉）" : "")

/** 交接卡正文。只给【指路】不搬正文：同一个会话里模型已经有那一轮的内容，再贴一遍是白花 token。 */
function hoffCard(m, replace) {
  const M = MODES[m], s = S[m]
  const files = (s.files || []).slice(0, 8)
  const asks = (s.qa || []).filter((x) => x.role === "user").map((x) => x.text)
  const L = ["【转交 · 「" + M.label + "」 · " + (replace ? "覆盖" : "续写")
    + (asks.length ? " · 含 " + asks.length + " 条追问" : "") + "】"]
  L.push("用户在界面上把「" + M.label + "」那一轮的结果转交到了智能助手这一格，下面这句话就是基于它问的。")
  if (s.docName) L.push("- 那一轮的正文落在 `" + s.docName + "`，要引用具体内容直接读这个文件，别凭印象复述。")
  if (files.length) L.push("- 那一轮的产物：" + files.map((n) => "`" + n + "`").join("、") + "。")
  // 追问也一并转交：那几轮问答同样是"这份结果"的一部分，用户接着谈的往往正是它们。
  // 只列问题不搬回答 —— 同一个会话里两边都在上文，列出来是为了【指明范围】，不是复述内容。
  if (asks.length) {
    L.push("- 那一轮的结果下面用户还追问过 " + asks.length + " 条，**这些问答也一并算在本次转交里**"
      + "（原文都在本会话上文，直接接着谈，别重问也别重答）：")
    asks.slice(0, 8).forEach((t) => L.push("  · " + String(t).replace(/\s+/g, " ").slice(0, 60)))
    if (asks.length > 8) L.push("  · …（还有 " + (asks.length - 8) + " 条，同样在上文里）")
  }
  L.push("- **不要重跑「" + M.label + "」**：结果已经有了，用户要的是基于它接着谈。")
  if (replace) L.push("- 此前在这一格里的自由问答用户已经不要了，别再接那边的话头，从这份结果重新开始。")
  L.push(HOFF_END)
  return L.join("\n")
}

/** 这一格现在有没有东西可转交（跑完了、且面板上真有正文） */
function hoffReady(m) {
  const s = S[m]
  return m !== "chat" && !!s && s.status === "done"
    && (!!s.docPv || !!((s.doc || "") + (s.raw || "")).trim())
}

const hoffMenu = $("hoffMenu")
function askHoff(btn) {
  const m = mode
  if (!hoffReady(m)) return
  if (hoffMenu.classList.contains("on")) return closeMenu()
  // 那一格还是空的 → 没有"覆盖谁"可言，直接转交，别为难用户做一道没有内容的选择题
  if (!S.chat.msgs.length) return doHoff(m, false)
  hoffMenu.innerHTML = ""
  const item = (title, sub, fn) => {
    const b = document.createElement("button")
    b.type = "button"; b.className = "mi"
    b.innerHTML = esc(title) + "<small>" + esc(sub) + "</small>"
    b.addEventListener("click", fn)
    hoffMenu.appendChild(b)
  }
  const what = "这份「" + MODES[m].label + "」" + (askCount(m) ? "（连同 " + askCount(m) + " 条追问）" : "")
  item("覆盖已有的对话", "智能助手里现有的问答不再显示，从" + what + "重新开始", () => doHoff(m, true))
  item("续写已有的对话", "保留现有问答，把" + what + "接在后面", () => doHoff(m, false))
  item("取消", "什么都不做", () => closeMenu())
  placeMenu(hoffMenu, btn)
}

function doHoff(m, replace) {
  closeMenu()
  const M = MODES[m]
  // 覆盖是"还没发出去"的动作：把清掉的这几条留一份，用户撤掉交接卡时要原样放回去
  const snapshot = replace ? S.chat.msgs.slice() : null
  if (replace) S.chat.msgs = []
  const asks = askCount(m)
  handoff = { mode: m, label: M.label, replace, asks, snapshot,
    card: hoffCard(m, replace), tag: hoffTag(M.label, replace, asks) }
  setMode("chat")
  renderHoff()
  qEl.focus()
}

function renderHoff() {
  const el = $("hoffChip")
  if (!handoff) { el.hidden = true; el.innerHTML = ""; return }
  el.hidden = mode !== "chat"    // 追问时输入框是共用的，这张卡只属于智能助手那一格（见 updateFoot）
  el.innerHTML = ICON.chat
    + '<div class="t">已带上<b>「' + esc(handoff.label) + '」</b>的结果'
    + (handoff.asks ? "与 <b>" + handoff.asks + " 条追问</b>" : "")
    + (handoff.replace ? "（覆盖此前的对话）" : "") + "，随你下一条消息一起发出。</div>"
    + '<button class="x" type="button" id="hoffX" aria-label="撤掉这张交接卡" title="撤掉">' + ICON.x + "</button>"
  $("hoffX").addEventListener("click", cancelHoff)
}

function cancelHoff() {
  if (!handoff) return
  if (handoff.snapshot) S.chat.msgs = handoff.snapshot    // 覆盖还没生效，撤掉就得把对话放回来
  handoff = null
  renderHoff(); renderChat()
}

/* ---- 终止 ---- */
async function abortRun() {
  if (!sid || !RUN) return
  try { await jget("api/chat/abort?sid=" + encodeURIComponent(sid), { method: "POST" }) } catch (_) {}
}
$("btnStop").addEventListener("click", abortRun)   // 聊天输入框旁那一个（头部那个在 btnHalt 上绑）

/* ---- 发消息 ----
   同一个输入框两种用途，由当前在哪一格决定：
     智能助手 → 一轮自由问答（可能带着交接卡）
     其它模式 → 对这一格【已有结果】的追问（run 的 ask 分支），答在原地
   ★ 只有一个输入框，是因为它必须活在面板【外面】：面板每 120ms 重绘一次，
     画在里面的 textarea 会被连字带光标一起冲掉。 */
const qEl = $("q")
qEl.addEventListener("input", () => { qEl.style.height = "auto"; qEl.style.height = Math.min(130, qEl.scrollHeight) + "px" })
qEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg() } })
$("btnSend").addEventListener("click", sendMsg)
function sendMsg() {
  const t = qEl.value.trim()
  if (!t) return
  if (busy()) return
  const ask = mode !== "chat"
  if (ask && !askReady(mode)) return          // 这一格还没有结果，追问无从谈起
  qEl.value = ""; qEl.style.height = "auto"
  run(ask ? mode : "chat", false, t, ask)
  render(mode); follow()
}

/* ============================================================
   7. 恢复：带 ?sid= 打开 / 刷新页面
   ------------------------------------------------------------
   四个面板的内容不落在任何自定义存储里，全部从服务端已有的三样东西重建：
     api/uploads  → 左栏那篇原文是哪个文件
     api/history  → 每一轮属于哪个模式（靠消息开头的 MODES.mark 标记认）
     api/outputs  → 翻译 / 大纲 / pptx 等产物
   好处是换台机器、换个浏览器打开同一个会话，看到的东西完全一样。
   ============================================================ */
/**
 * 一条 user 消息属于哪一格、是不是追问。返回 { m, ask }。
 * ★ 先认追问标记：`【文献导读 · 追问】` 与 `【文献导读】` 谁都不是谁的前缀（收尾的 `】` 位置不同），
 *   本来就不会误认；先判一遍是为了将来有人改标记时不至于悄悄退化成"追问全落进主结果"。
 */
function routeOf(t) {
  const s = String(t || "")
  for (const k of ORDER) { const a = MODES[k].askMark; if (a && s.startsWith(a)) return { m: k, ask: true } }
  for (const k of ORDER) { const mk = MODES[k].mark; if (mk && s.startsWith(mk)) return { m: k, ask: false } }
  return { m: "chat", ask: false }
}

async function restore() {
  if (!sid) return false
  let ups = [], hist = [], job = { running: false }
  try {
    [ups, hist, job] = await Promise.all([
      jget("api/uploads?sid=" + encodeURIComponent(sid)).then((r) => (r.ok ? r.json() : [])).catch(() => []),
      jget("api/history?sid=" + encodeURIComponent(sid)).then((r) => (r.ok ? r.json() : [])).catch(() => []),
      jget("api/job?sid=" + encodeURIComponent(sid)).then((r) => (r.ok ? r.json() : { running: false })).catch(() => ({ running: false })),
    ])
  } catch (e) { return false }

  const list = Array.isArray(ups) ? ups : []
  const mine = list.filter((f) => okExt().includes(extOf(f.name)))
  if (!mine.length) return false               // 这个会话里没有本模块能处理的文件 → 回首屏让他传一份
  // 多文件模块：本模块能处理的【全部】文件都要回来。只认第一个的话，刷新一次页面其余几张
  // 既不显示、也不会随提示词发给模型，而用户完全看不出少了东西。
  docFiles = (isMulti() ? mine : mine.slice(0, 1)).map((f) => ({ name: f.name, size: f.size }))
  docName = docFiles[0].name; docSize = docFiles[0].size
  // 配套数值表（refcheck）：上传目录里除原文之外、扩展名对得上的【全部】文件。
  // 只找第一个的话，刷新一次页面就只剩一份，另外几份既不显示也不会发给模型。
  if (CFG.extraUpload) {
    dataFiles = list.filter((f) => f.name !== docName && CFG.extraUpload.exts.includes(extOf(f.name)))
      .map((f) => ({ name: f.name, size: f.size }))
  }

  // 已落盘的表单值（设置 / 必答题 / 变量对应）。刷新页面、换台机器打开同一个会话，
  // 勾选都得原样回来 —— 否则 pin 的那几项会在下一轮悄悄变回默认值。
  try {
    const st = await jget("api/workflow/state?sid=" + encodeURIComponent(sid)).then((r) => (r.ok ? r.json() : null))
    // 【叠在默认值之上】而不是整个替换：落盘的 form 只含用户真正动过的字段（服务端两条写入路径
    // 都不做 withDefaults），整份替换会把 installConfig 播下去的默认值又冲掉，
    // 于是刷新一次，弹层里那五个字段重新变回「（不指定）」。
    if (st && st.state && st.state.form) SETTINGS = { ...SETTINGS, ...st.state.form }
    // ★ 闸状态也要取。本壳服务的四个模块（文稿核查 / 语言润色 / 数据统计 / 文献导读）加起来有
    //   5 道质量闸，而服务端的【出件拦截是模块无关的】：用户在这儿说"导成 PDF"，闸红就中止本轮。
    //   此前本页对闸一无所知——既不显示哪道红了，也没有聊天页那个「仍要出件」的逃生口，
    //   用户面前就是一堵没有尽头的墙（改完重跑闸也不一定能过，判据是关键词匹配、必有误判）。
    //   不画完整流程条：本模块是"四种模式随时切"、没有先后，硬塞进度条只会一直显示"共 N 步已完成 1 步"。
    if (st && st.state) { GATES = st.state.failed || []; GATE_STEPS = st.steps || []; BYPASS = !!st.gateBypass }
  } catch (_) {}

  // 历史 → 各个面板。同一模式跑过多轮时【后面的覆盖前面的】：用户看到的应该是最近那一版。
  const auto = ORDER.filter((k) => k !== "chat")
  if (Array.isArray(hist)) {
    let cur = null, curAsk = false
    hist.forEach((msg) => {
      if (msg.role === "user") {
        const r = routeOf(msg.text || "")
        cur = r.m; curAsk = r.ask
        turns++
        if (cur === "chat") {
          // 转交过来的那一轮：卡片不进气泡（只留用户自己那句话），但"当时选的是覆盖、带了几条追问"
          // 这件事要认出来 —— 不认的话，被覆盖掉的那几轮会在刷新页面后原样长回来，
          // 用户会以为覆盖根本没生效。
          const h = hoffOf(msg.text)
          if (h) {
            if (h.replace) S.chat.msgs.length = 0
            S.chat.msgs.push({ role: "tag", text: hoffTag(h.label, h.replace, h.asks) })
          }
          const t = h ? stripHoff(msg.text) : msg.text
          if (t) S.chat.msgs.push({ role: "user", text: t })
        }
        else if (curAsk) {
          // 追问：落回那一格的追问区，标记剥掉（气泡里只留用户自己打的那句话）。
          // 主结果那一轮可能已经被历史截断了，但这一格确实跑过 —— 别显示成"还没跑过"。
          if (S[cur].status === "idle") S[cur].status = "done"
          S[cur].qa.push({ role: "user", text: String(msg.text || "").slice(MODES[cur].askMark.length) })
        }
        // 主结果重跑：正文清空、旧追问一并作废（与 run() 里那条同一个道理）
        else { S[cur].raw = ""; S[cur].status = "done"; S[cur].qa = [] }
      } else {
        if (cur === "chat" || cur == null) S.chat.msgs.push({ role: "ai", text: msg.text })
        else if (curAsk) S[cur].qa.push({ role: msg.isError ? "tag" : "ai", text: msg.text })
        else { S[cur].raw = msg.text; S[cur].status = msg.isError ? "error" : "done" }
        if (cur && cur !== "chat" && !curAsk && msg.isError) S[cur].err = msg.text
      }
    })
  }

  await refreshOutputs()
  await Promise.all(auto.map((m) => loadDocFor(m)))
  auto.forEach((m) => { if (S[m].status !== "idle") collectFiles(m) })
  collectOrphanFiles()          // 刷新后 SSE 那份 files 已经没了，聊天格的产物只能从这里现算

  enterReader()
  if (CFG.source.kind === "table") loadHeaders()
  // 进来先看哪个面板：最近跑过的那个（按模式条倒序找），都没跑过就看配置指定的首个模式
  const done = auto.slice().reverse().find((m) => S[m].status !== "idle")
  setMode(done || (S.chat.msgs.length ? "chat" : CFG.first))

  // 后台还在跑：接上去。属于哪个模式、是不是追问，都看最后一条 user 消息的标记。
  if (job && job.running) {
    const lastUser = [...(hist || [])].reverse().find((x) => x.role === "user")
    const r = lastUser ? routeOf(lastUser.text || "") : { m: CFG.first, ask: false }
    S[r.m].status = "running"
    setMode(r.m)
    attach(r.m, r.ask)
  }
  return true
}

/* ============================================================
   8. 导航（换一篇 / 最近 / 工作台）
   ------------------------------------------------------------
   顶栏撤掉后这三个动作出现在两个地方（首屏卡片下方、阅读器的文件工具条），同一个动作有两个
   按钮。所以【不能再按 id 绑】—— 一个页面里两个同 id 是无效 HTML，而且 $() 只会拿到第一个，
   另一个点了没反应。改成 data-act + 事件委托：将来再往哪儿放一个，写个属性就通了。
   ============================================================ */
const menu = $("recentMenu")
// 两个弹层（最近 / 设置）共用一套定位与关闭：它们都可能被不同位置的按钮触发，
// 所以都是 body 级 position:fixed，打开时按触发按钮算坐标。
const closeMenu = () => { menu.classList.remove("on"); for (const id of ["setMenu", "hoffMenu"]) { const el = $(id); if (el) el.classList.remove("on") } }

/** 把弹层摆到触发按钮下面（position:fixed，坐标自己算），并且不许越出视口右/下边 */
function placeMenu(el, btn) {
  el.classList.add("on")                         // 先显示再量，否则 offsetWidth/Height 都是 0
  const r = btn.getBoundingClientRect()
  const w = el.offsetWidth, h = el.offsetHeight
  let left = Math.min(r.right - w, innerWidth - w - 10)
  let top = r.bottom + 6
  if (top + h > innerHeight - 10) top = Math.max(10, r.top - h - 6)   // 下面放不下就翻到按钮上方
  // ★ 坐标要写回【传进来的那个 el】。这里原本写死 menu.style —— 于是设置弹层永远拿不到
  //   left/top，position:fixed 退回静态位置，飘到页面左上角；顺带还把「最近」挪了一次。
  el.style.left = Math.max(10, left) + "px"
  el.style.top = top + "px"
}

async function showRecent(btn) {
  if (menu.classList.contains("on")) return closeMenu()
  menu.innerHTML = '<div class="empty">正在读取…</div>'
  placeMenu(menu, btn)
  let j = null
  try { j = await jget("api/sessions").then((r) => r.json()) } catch (_) {}
  // 只列本模块的会话。别的模块的会话在这个页面里打不开（没有原文、没有模式），列出来只会误导。
  // ★ 只列【当前模块】的会话，不能写死 litread：别的模块的会话在这个页面里打不开
  //（没有它认得的文件、没有对应的模式），列出来只会让人点进去撞一鼻子灰。
  const list = ((j && j.sessions) || []).filter((s) => s.module === MOD).slice(0, 20)
  if (!list.length) { menu.innerHTML = '<div class="empty">还没有做过的记录</div>'; return placeMenu(menu, btn) }
  menu.innerHTML = ""
  list.forEach((s) => {
    const b = document.createElement("button")
    b.type = "button"; b.className = "mi"
    b.innerHTML = esc(s.title || "(未命名)") + "<small>" + (s.running ? "生成中 · " : "") + new Date(s.updated || Date.now()).toLocaleString("zh-CN", { hour12: false }) + "</small>"
    b.addEventListener("click", () => { location.href = location.pathname + "?sid=" + encodeURIComponent(s.id) })
    menu.appendChild(b)
  })
  // 内容换完宽高都变了，重新摆一次。【这里原本写的是 openMenuAt()——没有这个函数】，
  // 于是每次列表非空都抛 ReferenceError，重新定位从来没跑过：弹层沿用「正在读取…」那一刻
  // 按窄内容算的坐标，撑开之后就贴死在屏幕右边缘（按钮在右上角时尤其明显）。
  placeMenu(menu, btn)
}

document.addEventListener("click", (e) => {
  // 弹层【内部】的点击不算「点空白处」。设置弹层里全是 select / checkbox / 输入框，
  // 它们身上没有 data-act —— 不先放行的话，点开下拉的那一下就把整个弹层收了，
  // 用户永远选不中任何一项。
  if (e.target.closest && e.target.closest(".menu")) return
  const btn = e.target.closest("[data-act]")
  // 点空白处收起菜单。设置弹层是被这样收掉的，也算"他看过这套设置了"——
  // 自动弹出来的那次多半就是这么关掉的，不记的话每切一个模式都会再弹一遍同样的东西。
  if (!btn) { if (setMenu.classList.contains("on")) markSettingsSeen(); closeMenu(); return }
  e.stopPropagation()
  // 「工作台」那一整页已经撤了：模块选择现在就是主页新会话的空态，带 #new 回去即可
  if (btn.dataset.act === "ws") { location.href = "./#new"; return }
  if (btn.dataset.act === "new") {
    if (RUN && !confirm("这一轮还在跑，换一篇会让你看不到它的结果（后台仍会跑完，可以从「最近」再进来）。确定？")) return
    location.href = location.pathname
    return
  }
  if (btn.dataset.act === "recent") showRecent(btn)
  if (btn.dataset.act === "hoff") askHoff(btn)
})
addEventListener("resize", closeMenu)             // fixed 定位的菜单不会跟着按钮走，改窗口就收起来

/* ============================================================
   9. 设置弹层 / 变量对应 / 附加上传
   ============================================================ */
/** 本会话要落盘的表单值 = 设置弹层 + 首屏必答题 + 变量对应，再加上左栏那份文件 */
function wfFormValues() {
  const v = { ...SETTINGS }
  // 多文件模块把全部文件写进去（服务端的列名体检、任务卡都读这个字段）；
  // 并用 __src_<字段id> 告诉服务端"变量对应里的列名读的是哪一张表"——它认这个键（见 server.mjs）。
  if (CFG.source.field && docFiles.length) {
    v[CFG.source.field] = docFiles.map((f) => f.name)
    if (isMulti() && docName) for (const f of (CFG.vars && CFG.vars.fields) || []) v["__src_" + f] = docName
  } else if (CFG.source.field && docName) v[CFG.source.field] = [docName]
  if (CFG.extraUpload && dataFiles.length) v[CFG.extraUpload.field] = dataFiles.map((f) => f.name)
  return v
}

/** 设置改了就立刻回写 _workflow.json —— pin:true 的字段靠它进入【下一轮】的模块前言 */
let saveT = 0
function saveSettings() {
  if (!sid) return
  clearTimeout(saveT)
  saveT = setTimeout(async () => {
    let j = null
    try {
      const r = await fetch("api/workflow/form", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ module: MOD, sid, values: wfFormValues() }),
      })
      j = r.ok ? await r.json() : null
    } catch (_) { return }
    // ★ 响应体【必须】读回来：服务端就在这个接口里做「你填的列名在真实表头里存不存在」的体检，
    //   结论只出现在 j.warnings 里。此前这里是 fetch(...).catch(()=>{})，响应从来没被读过 ——
    //   分组列打错字（表里叫「组别」，用户填了「手术方式」）在界面上没有任何反馈，模型自行推断
    //   一列跑完全程，产出一份【看起来完全正常、实际分错了组】的 Table 1。服务端那段注释写着
    //   这道体检"成本几乎为零"，而它的产出在阅读器里被 100% 丢弃了。
    showVarsWarn(j && Array.isArray(j.warnings) ? j.warnings : [])
  }, 400)
}

/** 列名体检的结论摊在「变量对应」面板里（只 warning 不挡：表头读不出来的情况太多，硬拦会误伤） */
function showVarsWarn(list) {
  if (!CFG || !CFG.vars) return
  const el = $("varsWarn"); if (!el) return
  el.hidden = !list.length
  el.textContent = list.length ? "⚠ " + list.join("；") : ""
  if (list.length) $("varsBox").open = true      // 折叠着的话等于没说
}

let HEADERS = []          // 表头的【显示名】（含"（重名 2）""（第 N 列·无列名）"这些消歧后缀）
let HEADER_VALS = []      // 与 HEADERS 一一对应的【真列名】：存进 SETTINGS、交给脚本的是它
let HEADER_DUPES = []     // 表里真的重名的列（仅大小写不同的不算）——同名列脚本只取第一列，要说一声
let HEADERS_WHY = ""      // 读不出来时的原因（xlsx 要 AI 在分析时读，服务端如实回这一句）
// 显示名 ↔ 真列名 的互查。表头没解析出来时退化成恒等，调用方不必到处判空。
const valOfHead = (h) => { const i = HEADERS.indexOf(h); return i >= 0 ? HEADER_VALS[i] : h }
const headOfVal = (v) => { const i = HEADER_VALS.indexOf(v); return i >= 0 ? HEADERS[i] : v }

/** 通用控件：select / bool / text / multi / columns（columns 的候选来自真实表头） */
function fieldControl(f, onChange) {
  const wrap = document.createElement("div")
  const v = SETTINGS[f.id]
  if (f.type === "multi") {
    for (const o of f.options || []) {
      const l = document.createElement("label"); l.className = "schk"
      const cb = document.createElement("input"); cb.type = "checkbox"
      cb.checked = Array.isArray(v) && v.includes(o.v)
      cb.addEventListener("change", () => {
        const cur = Array.isArray(SETTINGS[f.id]) ? SETTINGS[f.id].slice() : []
        SETTINGS[f.id] = cb.checked ? [...new Set([...cur, o.v])] : cur.filter((x) => x !== o.v)
        onChange()
      })
      l.appendChild(cb); l.appendChild(document.createTextNode(o.t)); wrap.appendChild(l)
    }
    return wrap
  }
  if (f.type === "text") {
    const i = document.createElement("input"); i.type = "text"; i.value = v == null ? "" : v
    if (f.placeholder) i.placeholder = f.placeholder
    i.addEventListener("input", () => { SETTINGS[f.id] = i.value; onChange() })
    wrap.appendChild(i); return wrap
  }
  // ★ 多选的 columns（协变量）必须有自己的控件。此前它和单选共用一个 <select>：
  //   界面上最多只能指一列，而值里真放了一个数组时（自动认列会一次给出年龄/性别/BMI），
  //   <select> 匹配不上任何 option → 显示「（不指定）」，可发给模型的却是三列 ——
  //   界面与提示词各说各话，且从产物上完全看不出来。
  if (f.type === "columns" && f.multiple && HEADERS.length) {
    const cur = new Set(Array.isArray(v) ? v : (v ? [v] : []))
    const row = document.createElement("div"); row.className = "vchips"
    // chip 上显示消歧名、选中态与存进 SETTINGS 的都用真列名（见 HEADER_VALS 的说明）
    HEADERS.forEach((h, i) => {
      const val = HEADER_VALS[i] ?? h
      const b = document.createElement("button")
      b.type = "button"; b.className = "vchip" + (cur.has(val) ? " on" : ""); b.textContent = h
      b.addEventListener("click", () => {
        cur.has(val) ? cur.delete(val) : cur.add(val)
        SETTINGS[f.id] = HEADER_VALS.filter((x) => cur.has(x))     // 按表里的列序存，顺序稳定
        onChange()
      })
      row.appendChild(b)
    })
    wrap.appendChild(row); return wrap
  }
  // columns 读不出表头（xlsx）时降级成手填输入框，而不是给一个空下拉让人以为这张表没有列
  if (f.type === "columns" && !HEADERS.length) {
    const i = document.createElement("input"); i.type = "text"
    i.value = Array.isArray(v) ? v.join("，") : (v == null ? "" : v)
    i.placeholder = HEADERS_WHY || (f.multiple ? "手动填列名，多个用逗号分隔" : "手动填列名")
    i.addEventListener("input", () => {
      // 多选字段哪怕降级成输入框也得存成数组，否则下游（varsBlock / 任务卡）拿到的是一整串文字
      SETTINGS[f.id] = f.multiple
        ? i.value.split(/[,，、]/).map((s) => s.trim()).filter(Boolean)
        : i.value
      onChange()
    })
    wrap.appendChild(i); return wrap
  }
  const sel = document.createElement("select")
  const opts = f.type === "bool" ? [{ v: true, t: "是" }, { v: false, t: "否" }]
    // 同理：option 的 value 是真列名，显示文字才是消歧后的名字
    : f.type === "columns" ? [{ v: "", t: "（不指定）" }].concat(HEADERS.map((h, i) => ({ v: HEADER_VALS[i] ?? h, t: h })))
    : (f.options || []).slice()
  if (f.type !== "columns" && f.type !== "bool" && !f.required) opts.unshift({ v: "", t: "（不指定）" })
  for (const o of opts) {
    const op = document.createElement("option")
    op.value = String(o.v); op.textContent = o.t
    if (String(v) === String(o.v)) op.selected = true
    sel.appendChild(op)
  }
  sel.addEventListener("change", () => {
    SETTINGS[f.id] = f.type === "bool" ? sel.value === "true" : sel.value
    onChange()
  })
  wrap.appendChild(sel); return wrap
}

let PEEK = null           // 前 N 行 + 列画像（{headers,rows,cols,note,scanned,truncated,sheets}）
let SHEET = ""            // 当前读的是第几张工作簿（多表 xlsx；空 = 第一张）。切表时带给 automap
let SHEET_FOR = ""        // 上面那个选择属于哪个文件 —— 换文件要清掉，别拿旧序号去读新表
let AUTOMAP = null        // 自动认列的结果（{file,map,why,conf,by,notes,source}）
let AUTOMAP_LOADING = false
let AUTOMAP_SEQ = 0       // 竞态号：读表期间用户切了表，旧结果一律作废

/* ============================================================
   自动认列：抽前几行 → 机器先把列认出来 → 用户只做核对
   ============================================================
   【为什么这么做】「分组列 / 结局列 / 随访时间列 / 终点事件列 / 待评价指标列 / 金标准列」
   这一排下拉，是整套界面里用户最不知所云的地方 —— 医生看到「终点事件列」四个字，
   第一反应是"这是啥"。而它填错【不会报错】，只会安静地产出一条看着很正常的错 KM 曲线。
   让人从二十几个列名里挑出六个很难；请他核对一句
   「分组列＝组别（全表只有 试验组 58 例 / 对照组 62 例）」很容易。所以把顺序反过来。

   【自动填 ≠ 已确认】自动填只省掉"找列"的力气，责任不转移：没点确认之前，
   发给模型的那段话会明说"这是机器认的、用户还没核对"，让它自己再核一遍并把用到的列写出来。
   点了确认才升级成「以我指定的为准」。这条边界不能省——省掉它等于给一个错列名披上用户的权威。 */
async function loadHeaders() {
  if (!CFG.vars || !docName || !sid) return
  const seq = ++AUTOMAP_SEQ
  const forFile = docName
  // 换了文件就把工作簿选择清掉：留着上一个文件的表序号，会去读新文件里根本不对应的那张表
  if (SHEET_FOR !== forFile) { SHEET = ""; SHEET_FOR = forFile }
  const headsBefore = HEADERS.slice(), valsBefore = HEADER_VALS.slice()   // automap 挂了要回落到它（见下）
  HEADERS = []; HEADER_VALS = []; HEADER_DUPES = []; HEADERS_WHY = ""; PEEK = null; AUTOMAP = null
  AUTOMAP_LOADING = true
  renderVars()
  let j = null
  try {
    j = await jget("api/data/automap", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sid, name: forFile, analyses: SETTINGS.analyses, sheet: SHEET }),
    }).then((r) => r.json())
  } catch (_) { j = null }
  if (seq !== AUTOMAP_SEQ) return          // 等待期间用户切了表：这份结果是上一张表的，丢掉
  AUTOMAP_LOADING = false
  if (!j || !j.ok) {
    // ★ 回落到之前已经解析出来的表头，别清空。浏览器那侧（xlsx 预览，见 1586 行）可能早就把
    //   这张表的列名解出来并渲染成表格了 —— automap 一失败就 HEADERS=[]，于是【左栏摆着整张表、
    //   右边的变量对应却降级成手填输入框】，用户对着看得见的列名手敲一遍。
    HEADERS = headsBefore; HEADER_VALS = valsBefore.length === headsBefore.length ? valsBefore : headsBefore.slice()
    HEADERS_WHY = (j && j.reason) || "这张表读不出结构（网关可能正忙），列名请手动填。"
    renderVars(); return
  }
  // ★ 显示名与真列名分开。HEADERS 用来【显示】（带"（重名 2）""（第 N 列·无列名）"这些消歧后缀），
  //   HEADER_VALS 才是存进 SETTINGS、最终交给脚本的【真列名】—— 后缀在真实表里根本不存在，
  //   拿它去取列必然取不到，而这个面板存在的唯一理由就是"列名一定对"。
  //   （index.html 那侧已经这么做了；这里是同一个坑的另一份实现，别只修一半。）
  HEADERS = Array.isArray(j.headers) ? j.headers : []
  HEADER_VALS = HEADERS.map((h, i) => String(j.raw?.[i] ?? h ?? "").trim() || `第 ${i + 1} 列`)
  HEADER_DUPES = Array.isArray(j.dupes) ? j.dupes : []
  HEADERS_WHY = j.note || ""
  PEEK = { headers: j.headers || [], rows: j.rows || [], cols: j.cols || [],
    note: j.note || "", scanned: j.scanned || 0, truncated: !!j.truncated,
    sheets: j.sheets || [] }   // 多工作簿：切表 chip 靠它（见 renderVarsPeek）
  AUTOMAP = { file: forFile, map: j.map || {}, why: j.why || {}, conf: j.conf || {},
    notes: j.notes || [], source: j.source || "rule" }
  // 【谁填的】记在 SETTINGS.__varsBy 里而不是 AUTOMAP 里：它要跟着 _workflow.json 落盘，
  //   刷新页面 / 换台机器打开同一个会话时，"这一格是机器认的、还没人核对"这件事必须还在 ——
  //   丢了它，界面上那几个下拉看起来就跟用户亲手指定的一模一样，而它们并不是。
  const by = SETTINGS.__varsBy = { ...(SETTINGS.__varsBy || {}) }
  // 只填【用户还没填过】的格子。他上一轮已经指过的列不许被机器改掉 —— 那是明确的用户输入，
  // 而且一旦被静默覆盖，他根本不会发现（这两个值长得一模一样，都只是一个列名）。
  let touched = false
  for (const id of CFG.vars.fields) {
    const cur = SETTINGS[id]
    const has = cur !== undefined && cur !== null && cur !== "" && !(Array.isArray(cur) && !cur.length)
    if (has) { by[id] = by[id] || "user"; continue }      // 已有值：保住它原来的出处，别一律改判成 user
    const v = AUTOMAP.map[id]
    if (v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length)) continue
    SETTINGS[id] = v; by[id] = j.by?.[id] === "ai" ? "ai" : "rule"; touched = true
  }
  if (touched) {
    SETTINGS.__varsOK = false          // 换了表就得重新核对一次：上一张表确认过不代表这张也对
    saveSettings()
    $("varsBox").open = true           // 折叠着等于没填：用户必须看见这几项才谈得上核对
  }
  renderVars()
}

/** 这一格是自动填进去的（出处记在 __varsBy，落盘随会话走） */
function autoFilled(id) {
  const b = (SETTINGS.__varsBy || {})[id]
  if (b !== "ai" && b !== "rule") return false
  const v = SETTINGS[id]
  return v !== undefined && v !== null && v !== "" && !(Array.isArray(v) && !v.length)
}
/** 面板里这个值还是不是「这次认出来的那一个」（协变量是数组，要按内容比） */
const sameVal = (a, b) => (Array.isArray(a) || Array.isArray(b))
  ? JSON.stringify(Array.isArray(a) ? a : [a]) === JSON.stringify(Array.isArray(b) ? b : [b])
  : a === b
/** 面板里有没有"待用户核对"的自动填项 */
const varsNeedConfirm = () => !SETTINGS.__varsOK && (CFG?.vars?.fields || []).some(autoFilled)

function renderVars(missing) {
  if (!CFG || !CFG.vars) return
  const grid = $("varsGrid"); grid.innerHTML = ""
  const miss = new Set(missing || [])
  let filled = 0
  for (const id of CFG.vars.fields) {
    const f = fieldDef(id); if (!f) continue
    const v = SETTINGS[id]
    if (v !== undefined && v !== null && v !== "" && !(Array.isArray(v) && !v.length)) filled++
    const box = document.createElement("div")
    const auto = autoFilled(id)
    // .auto 的淡蓝底 = "这是机器填的、等你过目"；确认之后就该收掉，否则一直像没办完
    box.className = "vf" + (miss.has(id) ? " miss" : "") + (auto && !SETTINGS.__varsOK ? " auto" : "")
    const l = document.createElement("label"); l.textContent = f.label
    if (f.help) l.title = f.help
    // 依据 / 把握度只在【面板里这个值就是这次认出来的那个】时才显示：用户手动改成了别的列，
    // 却还挂着机器给那一列写的理由，是彻头彻尾的误导。
    const same = auto && AUTOMAP && sameVal(AUTOMAP.map[id], v)
    // 确认之后不再挂「自动认的·待核」：那时它已经是用户的选择了，还标着"待核"只会让人以为
    // 自己没点过确认，又回去点一遍。依据（下面那行 why）保留——它随时能再核对。
    if (auto && !SETTINGS.__varsOK) {
      const conf = same ? AUTOMAP.conf[id] : ""
      const t = document.createElement("span")
      t.className = "vtag" + (conf === "high" ? "" : " low")
      // 谁填的、有多确信，都摆在明面上：用户有权知道这一格是机器认的，以及它有多大把握
      t.textContent = ((SETTINGS.__varsBy || {})[id] === "ai" ? "AI 认的" : "自动认的") + (conf === "high" ? "" : "·待核")
      l.appendChild(t)
    }
    box.appendChild(l)
    box.appendChild(fieldControl(f, () => {
      // 用户一旦动手改，这一格就归他了，确认态也要清掉（改完得重新过一眼）
      SETTINGS.__varsBy = { ...(SETTINGS.__varsBy || {}), [id]: "user" }
      SETTINGS.__varsOK = false
      saveSettings(); renderVars()
    }))
    // 依据必须常驻，不能收进 title：悬停才看得见 = 没人看得见，而用户核对的正是这句话
    const w = same ? AUTOMAP.why[id] : ""
    if (w) {
      const d = document.createElement("div"); d.className = "vwhy"
      d.innerHTML = mdLite(w)
      box.appendChild(d)
    }
    grid.appendChild(box)
  }
  // 表里真有重名列时说一句：同名列脚本只会取第一列，用户得知道自己选的是哪一个
  const dupNote = HEADER_DUPES.length ? "　⚠ 表里有重复的列名（" + HEADER_DUPES.join("、") + "），同名列只会取第一列" : ""
  $("varsSum").textContent = (AUTOMAP_LOADING ? "（正在读表、自动认列…）"
    : HEADERS.length
      ? (varsNeedConfirm() ? "（已自动填 " + filled + " 项，等你核对）"
        : "（已指定 " + filled + " / " + CFG.vars.fields.length + " 项，列名读自你的表）")
      : (HEADERS_WHY ? "（" + HEADERS_WHY + "）" : "（已指定 " + filled + " 项）")) + dupNote
  renderVarsConfirm()
  renderVarsPeek()
}

/** 只把 **加粗** 与「」保留下来的极简 markdown（依据里偶尔要强调一句，不值得引整个渲染器） */
const mdLite = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")

function renderVarsConfirm() {
  const el = $("varsConfirm"); if (!el) return
  if (AUTOMAP_LOADING) {
    el.hidden = false; el.className = "varsconfirm"
    el.textContent = "正在读你这张表的前几行，自动认一下哪列是分组、哪列是终点事件…"
    return
  }
  if (!AUTOMAP) { el.hidden = true; return }
  const anyAuto = (CFG.vars.fields || []).some(autoFilled)
  if (!anyAuto && !AUTOMAP.notes.length) { el.hidden = true; return }
  el.hidden = false
  el.innerHTML = ""
  const div = (html, style) => {
    const d = document.createElement("div")
    if (style) d.setAttribute("style", style)
    d.innerHTML = html
    el.appendChild(d); return d
  }
  if (SETTINGS.__varsOK) {
    el.className = "varsconfirm done"
    div("✓ 变量对应已由你确认，后面每一轮都按这个来。改了任何一项要再确认一次。")
    return
  }
  el.className = "varsconfirm"
  const n = (CFG.vars.fields || []).filter(autoFilled).length
  div("<b>已看过 " + esc(AUTOMAP.file) + " 的前几行，替你填好了 " + n + " 项。</b>"
    + "请核对一遍——每一项下面写了是凭什么认出来的，不对就直接改。"
    + "<br>没确认之前也能开跑，但发给它的话里会写明「这几列是机器认的、用户还没核对」，它会自己再核一次。")
  for (const t of AUTOMAP.notes || []) div("· " + mdLite(t), "margin-top:6px")
  // 多工作簿的提示不能只藏在折叠的「看看前几行」里：认列只认了其中一张表，
  // 而用户要的数据在第二张表里是很常见的事，这句话必须摊在他眼前。
  if (PEEK && PEEK.note) div("· " + esc(PEEK.note), "margin-top:6px")
  const row = document.createElement("div"); row.className = "row"
  const ok = document.createElement("button")
  ok.type = "button"; ok.className = "pri"; ok.textContent = "对，就按这个来"
  ok.addEventListener("click", () => { SETTINGS.__varsOK = true; saveSettings(); renderVars() })
  row.appendChild(ok)
  const clr = document.createElement("button")
  clr.type = "button"; clr.className = "lnk"; clr.textContent = "全部清空，我自己填"
  clr.addEventListener("click", () => {
    const by = { ...(SETTINGS.__varsBy || {}) }
    for (const id of CFG.vars.fields) { delete SETTINGS[id]; by[id] = "user" }
    SETTINGS.__varsBy = by
    SETTINGS.__varsOK = false
    saveSettings(); renderVars()
  })
  row.appendChild(clr)
  el.appendChild(row)
}

function renderVarsPeek() {
  const box = $("varsPeek"), body = $("varsPeekBody")
  if (!box || !body) return
  if (!PEEK || !PEEK.rows.length) { box.hidden = true; return }
  box.hidden = false
  $("varsPeekSum").textContent = "看看表的前 " + PEEK.rows.length + " 行"
    + (PEEK.scanned ? "（这张表读到 " + PEEK.scanned + " 行" + (PEEK.truncated ? "+，只扫了前一段" : "") + "）" : "")
    + (PEEK.note ? "　" + PEEK.note : "")
  // ★ 多工作簿要能切。python 侧一直支持 --sheet，只是上面三层没接 —— 界面告诉用户
  //   "这个工作簿有 3 张表"，却只认第一张、也给不了切换，而用户的数据在第二张里很常见。
  body.innerHTML = ""
  if ((PEEK.sheets || []).length > 1) {
    const bar = document.createElement("div"); bar.className = "vchips"; bar.style.marginBottom = "8px"
    bar.appendChild(Object.assign(document.createElement("span"),
      { className: "vwhy", textContent: "这个工作簿有 " + PEEK.sheets.length + " 张表，当前读的是：" }))
    PEEK.sheets.forEach((nm, i) => {
      const b = document.createElement("button")
