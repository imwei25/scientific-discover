      b.type = "button"; b.className = "vchip" + (String(SHEET) === String(i) || SHEET === nm || (!SHEET && i === 0) ? " on" : "")
      b.textContent = nm
      b.addEventListener("click", () => { if (String(SHEET) === String(i)) return; SHEET = i; loadHeaders() })
      bar.appendChild(b)
    })
    body.appendChild(bar)
  }
  // 被认走的列在表头里标一下颜色：用户一眼就能对上"机器说的那列"到底是表里的哪一列
  const used = new Set()
  if (AUTOMAP) for (const id of CFG.vars.fields) {
    const v = SETTINGS[id]
    if (Array.isArray(v)) v.forEach((x) => used.add(x)); else if (v) used.add(v)
  }
  const th = PEEK.headers.map((h) => '<th class="' + (used.has(h) ? "hit" : "") + '">' + esc(h) + "</th>").join("")
  const tr = PEEK.rows.map((r) => "<tr>" + r.map((c) => "<td>" + (c === "" ? "<span style=\"opacity:.4\">(空)</span>" : esc(c)) + "</td>").join("") + "</tr>").join("")
  // 追加而不是赋值：上面的切表 chip 已经写进 body 了，innerHTML= 会把它冲掉
  body.insertAdjacentHTML("beforeend", "<table><thead><tr>" + th + "</tr></thead><tbody>" + tr + "</tbody></table>")
}

const setMenu = $("setMenu")

/* ---- 「这套设置我已经确认过了」的记忆 ----
   设置是【模块级】的：refcheck 的严格度 / 语言，四个模式共用同一份。所以第一次摊开、用户看过
   之后，再切到别的模式不该把一模一样的东西再问一遍 —— 那不是"确认"，是骚扰，而且会训练用户
   闭着眼把弹层点掉，真正需要他看一眼的那次也就跟着被点掉了。
   记的是【字段 + 取值】的指纹，不是模块 id：于是换个模块只要这套设置完全一样（比如同样只有一个
   「输出语言＝中文」），也照样不再打扰；而只要有一项取值不同，指纹就变了，会重新问一次。
   落在 localStorage：换会话、明天再来都算数（"已经在别处填过"本来就是跨会话的记忆）。 */
const SEEN_KEY = "reader.settingsSeen"
function settingsSig() {
  const ids = CFG.settings || []
  if (!ids.length) return ""
  return ids.map((id) => id + "=" + JSON.stringify(SETTINGS[id] === undefined ? null : SETTINGS[id])).join("|")
}
function seenSet() { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]")) } catch (_) { return new Set() } }
function settingsSeen() { const s = settingsSig(); return !!s && seenSet().has(s) }
/** 用户看过这套设置了（点了里面的「开始」，或者看完把它收起来）——下次别再自动弹同一套 */
function markSettingsSeen() {
  const s = settingsSig(); if (!s) return
  try {
    const set = seenSet(); set.add(s)
    localStorage.setItem(SEEN_KEY, JSON.stringify([...set].slice(-40)))   // 只留最近 40 条，别无限长
  } catch (_) { /* 隐私模式下写不了 localStorage：那就每次都问一遍，不影响功能 */ }
}

/**
 * 打开设置弹层。
 * @param withStart true = 底部多一枚「开始」。这是"切到还没跑过的模式 → 自动摊开设置"那条路：
 *   这些设置（严格程度 / 输出语言 / 保护引用…）决定这一轮按什么口径跑，跑完再改就得重跑一遍。
 *   所以先问、填完就地开跑，不用再回头去头部找按钮。
 */
function openSettings(withStart) {
  setMenu.innerHTML = ""
  for (const id of CFG.settings || []) {
    const f = fieldDef(id); if (!f) continue
    const box = document.createElement("div"); box.className = "sf"
    const l = document.createElement("label"); l.textContent = f.label; box.appendChild(l)
    if (f.help) { const h = document.createElement("div"); h.className = "sh"; h.textContent = f.help; box.appendChild(h) }
    box.appendChild(fieldControl(f, saveSettings))
    setMenu.appendChild(box)
  }
  if (withStart) {
    const foot = document.createElement("div"); foot.className = "sfoot"
    const tip = document.createElement("div"); tip.className = "st"
    tip.textContent = "这些是这一轮的口径，确认后就可以开始。"
    const b = document.createElement("button")
    b.type = "button"; b.className = "gostart"
    b.innerHTML = ICON.play + "<span>" + esc(MODES[mode].label) + "</span>"
    // 弹层内部的点击被 document 那个监听放行了（见 .menu 分支），这里自己收起来再开跑
    b.addEventListener("click", (e) => { e.stopPropagation(); markSettingsSeen(); closeMenu(); tryRun(mode) })
    foot.appendChild(tip); foot.appendChild(b); setMenu.appendChild(foot)
  }
  closeMenu()
  setMenu.classList.add("on")
  placeMenu(setMenu, $("btnSettings"))
}
$("btnSettings").addEventListener("click", (e) => {
  e.stopPropagation()
  // 自己点开、自己收起 = 他已经看过这套设置了，之后切模式不用再替他弹一次
  if (setMenu.classList.contains("on")) { markSettingsSeen(); setMenu.classList.remove("on"); return }
  openSettings(false)
})

/* ---- 附加上传：配套数值表（目前只有 refcheck 的「数据完整性」用）----
   摆在首屏会挡住所有人的路（另外三个模式根本不需要它），所以只在需要它的那个模式面板里常驻。
   ★ 常驻，不是"缺了才出现"：用户得随时看得见【已经传了哪几份】，也得能删掉传错的那一份。 */

/** 需要配套数值表的模式，面板顶上那张清单卡 */
function dataCardHtml(m) {
  const X = CFG.extraUpload
  if (!X || !(MODES[m].need || []).includes("data")) return ""
  const busyNow = busy()
  const rows = dataFiles.map((f) =>
    '<div class="drow"><span class="fic">' + esc(extOf(f.name).toUpperCase().slice(0, 4)) + "</span>"
    + "<b>" + esc(f.name) + "</b>"
    + (f.size == null ? "" : '<span class="sz">' + esc(fmtSize(f.size)) + "</span>")
    + '<button type="button" class="del" data-datadel="' + esc(f.name) + '" aria-label="移除 ' + esc(f.name) + '"'
    + (busyNow ? " disabled" : "") + ">" + ICON.trash + "</button></div>").join("")
  return '<div class="datacard"><div class="dh"><span class="t">' + esc(X.label) + "</span>"
    + '<span class="n">' + (dataFiles.length ? "已上传 " + dataFiles.length + " 份" : "还没有上传") + "</span></div>"
    + (rows || '<div class="dempty">这一步要读你的原始数值表（' + X.exts.map((x) => "." + x).join(" / ") + "），可以一次传多份。</div>")
    + '<button type="button" class="addbtn" data-dataadd="1" aria-label="添加' + esc(X.label) + '"' + (busyNow ? " disabled" : "") + ">"
    + ICON.plus + "<span>" + (dataFiles.length ? "再添加一份" : "添加" + esc(X.label)) + "</span></button></div>"
}

/** 选文件 → 逐个传上去（可多选）。过程写在面板上，别让用户对着一个没反应的按钮等。 */
function pickDataFiles() {
  const X = CFG.extraUpload
  if (!X || busy()) { if (X) render(mode); return }   // 同 pickMoreDocs：快照过期时重画自纠，别静默吞掉
  openPicker(X.accept, true, async (files) => {
    if (!files.length) return
    const cur = mode
    const bad = files.filter((f) => !X.exts.includes(extOf(f.name)))
    const good = files.filter((f) => X.exts.includes(extOf(f.name)))
    S[cur].err = bad.length
      ? "只收 " + X.exts.map((x) => "." + x).join(" / ") + "；已跳过：" + bad.map((f) => f.name).join("、")
      : ""
    for (let i = 0; i < good.length; i++) {
      const f = good[i]
      S[cur].block = "正在上传 " + f.name + (good.length > 1 ? "（" + (i + 1) + "/" + good.length + "）" : "") + "…"
      S[cur].blockMiss = null
      render(cur)
      try {
        await upload(f)
        // 同名重传 = 覆盖（服务端就是按名字落盘的），列表里也只留一条，别出现两行同名
        dataFiles = [...dataFiles.filter((x) => x.name !== f.name), { name: f.name, size: f.size }]
      } catch (e) {
        S[cur].err = String((e && e.message) || e)
        break
      }
    }
    S[cur].block = ""; S[cur].blockMiss = null
    saveSettings(); render(cur)
  })
}

/** 删掉一份已传的数值表（服务端也真删，不然下次刷新它又回来了） */
async function removeDataFile(name) {
  if (busy()) return
  const cur = mode
  const keep = dataFiles.slice()
  dataFiles = dataFiles.filter((f) => f.name !== name)   // 先让界面响应，失败再放回去
  render(cur)
  try {
    const r = await jget("api/upload/delete?name=" + encodeURIComponent(name) + sidQ(), { method: "POST" })
    if (!r.ok) throw new Error("HTTP " + r.status)
    saveSettings()
  } catch (e) {
    dataFiles = keep
    S[cur].err = "没能删掉 " + name + "（" + String((e && e.message) || e) + "）"
  }
  render(cur)
}

/**
 * 启动：确定是哪个模块 → 取它的 reader 配置 → 按配置把界面搭出来。
 * 模块来自三处，优先级从高到低：
 *   ?m=<id>        在主页新会话的模块选择区点卡片进来时带的（见 index.html 的 enterModule）
 *   ?sid= 的会话   会话在创建那一刻就绑定了模块，服务端说了算
 *   litread        兜底（老书签直接开 /reader.html）
 */
;(async () => {
  const fail = (title, msg) => {
    document.body.innerHTML = '<div class="intro" style="display:flex"><div class="introcard"><h1>' + esc(title) + "</h1>"
      + '<div class="lead">' + esc(msg) + "</div>"
      + '<div style="margin-top:22px"><button class="gobtn" data-act="ws">新建会话</button></div></div></div>'
    document.body.addEventListener("click", (e) => { if (e.target.closest('[data-act="ws"]')) location.href = "./#new" })
  }

  MOD = QS.get("m") || ""
  let mods = []
  try { mods = ((await jget("api/modules").then((r) => r.json())) || {}).modules || [] } catch (_) { return }

  // 带了 sid 却没带 m：会话绑的模块以服务端为准（用户可能是从「最近」或聊天页跳过来的）
  if (!MOD && sid) {
    try {
      const j = await jget("api/sessions").then((r) => r.json())
      const hit = ((j && j.sessions) || []).find((x) => x.id === sid)
      if (hit && hit.module) MOD = hit.module
    } catch (_) {}
  }
  if (!MOD) MOD = "litread"

  const meta = mods.find((x) => x.id === MOD)
  if (!meta) return fail("打不开这个模块", "服务端没有「" + MOD + "」这个模块。可能是链接过期了，新建一个会话重新进一次。")
  if (meta.ui !== "reader") { location.href = "./#module=" + encodeURIComponent(MOD); return }
  if (!meta.allowed) return fail(meta.name, "你的账号还没有开通这个模块，请联系管理员。")

  let wf = null
  try { wf = ((await jget("api/modules/" + encodeURIComponent(MOD) + "/workflow").then((r) => r.json())) || {}).workflow } catch (_) {}
  if (!wf || !wf.reader) return fail(meta.name, "取不到这个模块的界面配置（服务端版本可能比界面包旧）。刷新一次；还不行就新建一个会话，从对话里也能用这些能力。")

  document.title = meta.name + " · Niuma Science"
  installConfig(wf.reader)
  initState()
  mode = CFG.first
  // 面板容器按模式清单生成（每个模式一个），HTML 里不再写死任何一个模块的面板
  $("aiBody").innerHTML = ORDER.map((id) => '<div class="pane" id="pane-' + id + '"></div>').join("")
  // 首屏那个大图标用「首个模式」的图标：它就是这个模块最主要在干的事
  $("introIcon").innerHTML = MODES[CFG.first] ? MODES[CFG.first].icon : ic("dot")
  renderIntro()

  if (sid) {
    const ok = await restore()
    if (ok) return
    // 这个会话里没有本模块能处理的文件 → 回首屏当新的一份。
    // ★ 必须说一句为什么。最常见的来源是【这个模块改版前留下的会话】——那时它是表单+流程条那一套，
    //   未必有上传件，而「最近」列表里新旧长得一模一样。静默弹回上传页的话，用户会以为自己点错了，
    //   而且会反复再点一次。
    sid = null
    try { history.replaceState(null, "", location.pathname + "?m=" + encodeURIComponent(MOD)) } catch (_) {}
    $("introErr").className = "err on info"
    $("introErr").textContent = "刚才那个会话里没有这个模块能处理的文件——多半是改版前留下的老会话，"
      + "那时候不需要先上传。它的对话记录还在，从「自由对话」那边照常能翻到；要开始新的一份，在上面传上来即可。"
  }
  $("intro").hidden = false
})()

/* ============================================================
   专用壳的三件公共事：公告 / 更新提示 / 闲置锁
   ------------------------------------------------------------
   ★ 为什么这里要单独写一遍：这两个壳（reader / figure）是自包含页面，不引外部 js，
     而聊天页那套公告面板 + 更新横幅 + 登录弹窗有几百行，整体搬过来既臃肿又要维护两份。
     所以这里【只做察觉，不做处置】：发现有事就挂一条一行的提示、把用户交回主页去办。
     用户在文献研读里泡一整天，至少不会对维护通知、界面更新、锁屏一无所知。
   ★ 闲置锁与聊天页共用同一套 localStorage 键（nm_locked / nm_last_active）：
     - 活跃时间写全局，别让"用户在别的标签干活"被本页算成闲置；
     - 别的标签锁了 → 本页也立刻交回主页（那边有登录闸）。不跟的话这道闸换个标签就绕过去了。
   ============================================================ */
;(function () {
  var LOCK_KEY = "nm_locked", ACT_KEY = "nm_last_active"
  var LOGOUT_MS = 24 * 60 * 60 * 1000
  var last = Date.now(), wrote = 0
  function bump() {
    last = Date.now()
    if (last - wrote > 5000) { wrote = last; try { localStorage.setItem(ACT_KEY, String(last)) } catch (_) {} }
  }
  ;["mousemove", "mousedown", "keydown", "wheel", "touchstart", "visibilitychange"].forEach(function (e) {
    window.addEventListener(e, bump, { passive: true })
  })
  function toHome(why) { try { sessionStorage.setItem("nm_shell_back", why || "") } catch (_) {} location.href = "./" }
  window.addEventListener("storage", function (e) {
    if (e.key === ACT_KEY) { var t = Number(e.newValue) || 0; if (t > last) last = t }
    if (e.key === LOCK_KEY && e.newValue === "1") toHome("locked")
  })
  setInterval(function () {
    var act = 0; try { act = Number(localStorage.getItem(ACT_KEY)) || 0 } catch (_) {}
    if (act > last) last = act
    try { if (localStorage.getItem(LOCK_KEY) === "1") return toHome("locked") } catch (_) {}
    // 到点了就把全局锁一置、交回主页：锁屏弹窗归主页管，这里不重实现一套
    if (Date.now() - last >= LOGOUT_MS) { try { localStorage.setItem(LOCK_KEY, "1") } catch (_) {} toHome("idle") }
  }, 30000)

  /* ---- 一行提示条：公告 / 界面包 / 技能包 / 登录态失效 ---- */
  var bar = null
  function showBar(text, act) {
    if (!bar) {
      bar = document.createElement("div")
      bar.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;display:flex;gap:10px;"
        + "align-items:center;justify-content:center;padding:7px 14px;font-size:13px;"
        + "background:#fff8e6;border-bottom:1px solid #f0d7ae;color:#8a5a12"
      document.body.appendChild(bar)
    }
    bar.textContent = ""
    bar.appendChild(document.createTextNode(text))
    var a = document.createElement("a")
    a.href = "./"; a.textContent = act || "回主页处理 →"
    a.style.cssText = "color:#3b6fd4;text-decoration:none;white-space:nowrap"
    bar.appendChild(a)
    var x = document.createElement("button")
    x.type = "button"; x.textContent = "×"; x.title = "本次不再提示"
    x.style.cssText = "border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1"
    x.addEventListener("click", function () { bar.remove(); bar = null })
    bar.appendChild(x)
  }
  var seenNotice = 0
  async function poll() {
    var j = null
    try { j = await (await fetch("api/cloud/notice", { signal: AbortSignal.timeout(8000) })).json() } catch (_) { return }
    if (!j) return
    // 登录态在后台被作废：主页有登录闸，交回去
    if (j.loggedOut) return toHome("loggedOut")
    if (j.webUpdate) return showBar("界面有新版本可用。", "回主页更新 →")
    if (j.skillUpdate) return showBar("技能包有新版本可用。", "回主页更新 →")
    var unread = Array.isArray(j.digest) ? j.digest.length : 0
    if (unread && unread !== seenNotice) { seenNotice = unread; showBar("平台有新公告。", "回主页查看 →") }
  }
  poll(); setInterval(poll, 5 * 60 * 1000)
  window.addEventListener("focus", poll)
})()
</script>
</body>
