<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文献研读 · Niuma Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   阅读器壳 —— 四个「专项技能」模块共用（文献研读 / 文稿核查与审校 / 文章润色 / 数据统计与分析）
   ------------------------------------------------------------
   【本文件不认识任何一个具体模块】模式清单、每个模式发什么话、首屏文案、设置字段、变量对应
   面板，全部来自 GET /api/modules/<id>/workflow 的 reader 段（定义在 workflows.mjs）。
   这里只负责照着画、照着发、照着把结果摆回对应的面板。所以加一个模式、改一句提示词，
   只动 workflows.mjs，本文件一行都不用改。
   ⚠️ 但那【不等于能走「界面包」热更新】：workflows.mjs 是网关的服务端代码（server.mjs
   import 它、经 /api/modules/<id>/workflow 下发），而界面包按设计一律拒收 .mjs
   （server/lib/webpacks.mjs 的 rejectReason）。改了它就要重发安装包 / 重启网关。
   ★ 推论：本文件里【不该出现任何模块 id 的字面量】（兜底默认值与注释除外）。写死过两次，
     两次都是同一种后果——别的模块被当成文献研读：会话绑错模块（前言与技能闸全是别人的）、
     「最近」列表列出别的模块的会话，而界面照常显示本模块的样子，从外面完全看不出来。

   【为什么这四个模块该用它】它们的输入都是【一份东西】（一篇文献 / 一份稿件 / 一张数据表），
   想对它做的事有好几种、彼此没有先后、随时来回切。套进通用壳（首屏表单 → 步骤条 → 一条
   对话流）时，步骤条永远停在"共 N 步、已完成 1 步"，而那份东西本身没地方摆。

   【与后端的关系：一个字都没多加】会话、模块闸、前言注入、额度、产物目录全走原有接口：
     POST api/chat/start  → 起一轮（body 带 module=<当前模块>，服务端据此绑定会话并注入前言）
     GET  api/chat/attach → SSE 直播
     POST api/upload      → 上传（没有 sid 时它会现建一个会话，此时会话【还没有模块绑定】）
     GET  api/raw/preview → 左栏渲染那份东西；api/outputs 列产物
   模式之间的区别只在【发过去的那句话】：消息开头的方括号标记（modes[].mark）就是模式信号，
   workflows.mjs 的 flow 里把这些标记教给了 agent，刷新页面后也靠它把每一轮认回对应面板。

   【一份东西 = 一个会话】各模式共享同一个 opencode 会话，所以原文只抽一次；切到"智能助手"
   时前面几轮的上下文原样都在，接着问就行。换一份 = 新开会话。
   ============================================================ */
:root{
  --bg:#eef1f5;
  --panel:#ffffff;
  --panel-soft:#f5f7fa;
  --text:#1f2329;
  --muted:#5b6573;
  --faint:#8a93a0;
  --accent:#3b6fd4;
  --accent-deep:#2f5bb8;
  --accent-soft:rgba(59,111,212,.10);
  --green:#2bb673;
  --amber:#d98324;
  --red:#c0392b;
  --red-deep:#9e2f22;
  --line:rgba(20,24,30,.10);
  --line-hi:rgba(20,24,30,.16);
  --r-lg:16px; --r-md:12px; --r-sm:10px;
  --shadow-sm:0 2px 8px rgba(20,24,30,.06);
  --shadow-md:0 6px 22px rgba(20,24,30,.10);
  /* Space Grotesk 与工作台 / 登录页同源。它没有汉字，中文自然落到后面的 雅黑 / 苹方 ——
     设计稿要的就是这个"拉丁字母是它、汉字是系统字"的混排。字体拉不下来（离线 / 被墙）时
     整条回落到系统字，页面照常可用，所以不必为它做任何兜底。 */
  --sans:'Space Grotesk',system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit}

/* ---------- 通用小按钮 ----------
   顶栏整条撤掉了：首屏那一行（品牌 + 模块徽标 + 已就绪 + 最近 + 工作台）说的每一件事，
   卡片里都已经说过一遍（书本图标、大标题「文献研读」、副标题），三处重复只是在占地方；
   进了阅读器之后左栏顶上就是文件名，也不需要再有一条横幅告诉你在哪。
   原来挂在顶栏上的三个动作各自找到了更该待的地方：
     · 首屏 → 右上角（最近做过的 / 回工作台）
     · 阅读器 → 左栏文件工具条的右端（换一篇 / 最近 / 工作台），与「原文」按钮并排 */
.hbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line-hi);background:#fff;color:var(--muted);cursor:pointer;font-size:12px;transition:.15s;flex:none}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn svg{width:14px;height:14px}
.hbtn[disabled]{opacity:.45;cursor:not-allowed}
/* 首屏右上角那两个链接（最近做过的 / 回工作台）。
   原来摆在卡片正下方、「开始」按钮底下——那是全屏视线落点，两个"离开这一屏"的动作放那里
   等于跟主操作抢注意力。挪到右上角这个惯常的次要导航位。
   用 fixed 不用 absolute：.intro 自己是可滚动的整屏容器（内容长了会滚），absolute 会让它
   跟着内容滚走。.intro[hidden] 时整屏 display:none，子元素连它一起不渲染，不会漏到阅读器上。 */
.intronav{position:fixed;top:14px;right:18px;z-index:3;display:flex;align-items:center;gap:6px;margin:0}
/* 里面那两个按钮用全局的 .ibtn（见「图标按钮 + 悬停浮出的文字」那一节）。
   原来的 .linkbtn 文字链已经没有使用者，删掉，别留一条没人用的样式让人以为还有第三种按钮。 */

/* 「最近」下拉。position:fixed + 打开时按触发按钮算坐标 —— 因为这个菜单要被两个位置的按钮
   共用（首屏卡片下方、阅读器的文件工具条），绝对定位就得跟着各自的定位父级走，坐标会打架。 */
.menu{position:fixed;min-width:270px;max-width:min(380px,92vw);max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line-hi);border-radius:var(--r-md);box-shadow:var(--shadow-md);padding:6px;display:none;z-index:200}
.menu.on{display:block}
.menu .mi{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text);font-size:13px}
.menu .mi:hover{background:var(--panel-soft)}
.menu .mi small{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.menu .empty{padding:12px 10px;color:var(--faint);font-size:12px}

/* ---------- 上传首屏（居中大卡片，与基金申报 / 综述撰写的首屏同源）---------- */
.stage{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(59,111,212,.06) 0%,transparent 60%)}
/* ★ [hidden] 必须显式写死。作者样式里的 display:flex 优先级高过浏览器给 [hidden] 的
   display:none —— 少了这一行，点「开始研读」之后首屏【根本不会消失】，它和阅读器上下叠成
   两屏，用户得用滚轮往下拉才看得到阅读器，看上去就像"点了没跳转"。下面 .reader[hidden] 是同一回事。 */
.intro[hidden]{display:none}
.intro{position:relative;z-index:1;height:100vh;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 56px}
.introcard{width:min(760px,100%);background:var(--panel);border:1px solid var(--line-hi);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:44px 38px 34px;text-align:center}
.introcard .hero-ic{width:56px;height:56px;margin:0 auto 22px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(59,111,212,.4)}
.introcard .hero-ic svg{width:28px;height:28px}
.introcard h1{margin:0 0 12px;font-size:26px;font-weight:600;letter-spacing:.01em}
.introcard .lead{font-size:15px;color:var(--muted);line-height:1.78;margin:0 auto;max-width:560px}
.divider{height:1px;background:var(--line);margin:30px auto;max-width:none}

.drop{border:1.5px dashed var(--line-hi);border-radius:var(--r-md);background:var(--panel-soft);padding:26px 20px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop svg{width:26px;height:26px;color:var(--accent);margin-bottom:8px}
.drop .d1{font-size:14px;font-weight:600;color:var(--text)}
.drop .d2{font-size:12px;color:var(--muted);margin-top:6px}

/* 选中的文件：扩展名徽标 + 名字 + 大小 + 移除。左对齐（卡片整体居中，唯独这一行是数据，
   居中会让长文件名的省略号跑到两头，读起来别扭）。 */
.picked{display:flex;align-items:center;gap:10px;margin-top:12px;padding:9px 11px;border:1px solid var(--line-hi);border-radius:var(--r-sm);background:var(--panel);text-align:left}
.picked .fic{width:30px;height:30px;flex:none;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700}
.picked .fn{flex:1;min-width:0}
.picked .fn b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picked .fn span{font-size:11px;color:var(--faint)}
.picked .rm{border:none;background:none;color:var(--faint);cursor:pointer;width:26px;height:26px;border-radius:6px;font-size:15px;line-height:1;flex:none}
.picked .rm:hover{color:#e0564f;background:rgba(224,86,79,.10)}

.gobtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;font:inherit;font-size:13px;font-weight:600;padding:11px 22px;border-radius:var(--r-sm);margin-top:20px;transition:.15s;background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(59,111,212,.26)}
.gobtn:hover{background:var(--accent-deep)}
.gobtn[disabled]{background:#c3ccd8;box-shadow:none;cursor:not-allowed}
.gobtn svg{width:16px;height:16px}

/* 底部这排 chip 写的是本模块真能做的四件事，不是装饰性形容词 —— 用户第一眼要看到的是
   "传进来之后能干嘛"，而不是五个漂亮的四字词。 */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-soft);border:1px solid var(--line-hi);border-radius:999px;padding:7px 14px;font-size:12px;color:#46586e;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip svg{width:14px;height:14px}

/* 首屏必答题（stats 的「含不含患者身份信息」）。它不是设置、是安全闸，所以摆在按钮上方、
   没答之前「开始」是灰的 —— 默认「否」等于替用户声明「本表不含身份信息」，而他表里就摆着
   300 个姓名和住院号。 */
.askbox{margin-top:14px;padding:12px 14px;border:1px solid var(--line-hi);border-radius:var(--r-sm);background:var(--panel-soft);text-align:left}
.askbox .asklbl{font-size:13px;font-weight:600}
.askbox .asklbl .req{color:var(--red);font-size:11px;margin-left:4px}
.askbox .askhelp{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.7}
.askbox .askopts{display:flex;gap:8px;margin-top:9px}
.askbtn{flex:1;height:34px;border:1px solid var(--line-hi);background:#fff;border-radius:8px;color:var(--muted);cursor:pointer;font-size:13px;transition:.15s}
.askbtn:hover{border-color:var(--accent);color:var(--accent)}
.askbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* 设置弹层：复用 .menu 的 fixed 定位，只是内容是一组控件 */
.setmenu{min-width:320px;max-width:min(420px,92vw);padding:12px 14px}
.setmenu .sf{margin-bottom:12px}
.setmenu .sf:last-child{margin-bottom:0}
.setmenu .sf > label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.setmenu .sf .sh{font-size:11px;color:var(--faint);line-height:1.7;margin-bottom:5px}
.setmenu select,.setmenu input[type=text]{width:100%;height:32px;border:1px solid var(--line-hi);border-radius:8px;padding:0 9px;font:inherit;font-size:12px;background:#fff;color:var(--text)}
.setmenu .schk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-bottom:4px;cursor:pointer}
/* 「切到没跑过的模式 → 自动摊开设置」那条路，底部这枚按钮就是"填完了，开跑" */
.setmenu .sfoot{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.setmenu .sfoot .st{font-size:11px;color:var(--faint);line-height:1.7;margin-bottom:8px}
.setmenu .gostart{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:34px;border:none;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.setmenu .gostart:hover{background:var(--accent-deep)}
.setmenu .gostart svg{width:13px;height:13px}

/* 变量对应面板（只有 stats）：默认折叠的一条，展开是两列下拉。
   ★ flex:0 1 auto + max-height + 自己滚：展开后它有七个下拉、一排协变量 chips、一张前几行预览，
     自然高度轻松超过整个面板。原来写的是 flex:none —— 于是它把 .ai-body（结果、产物列表、
     追问入口全在里面）挤成一条一行高的缝，用户看到的就是"对话框只剩一行、产物根本看不到"。
     现在它最多占面板的 42%，超出部分在自己内部滚；面板再矮时它还能被压缩（.ai-body 有
     min-height 兜底，见下）。summary 吸顶，滚起来仍知道自己在哪一块里。 */
.varsbox{flex:0 1 auto;min-height:0;max-height:42%;overflow:auto;overscroll-behavior:contain;border-bottom:1px solid var(--line);background:#fff}
.varsbox > summary{position:sticky;top:0;z-index:2;background:#fff;cursor:pointer;padding:9px 16px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
.varsbox > summary::-webkit-details-marker{display:none}
.varsbox > summary::before{content:"▸";color:var(--faint);font-size:11px}
.varsbox[open] > summary::before{content:"▾"}
.varsbox .varssum{font-weight:400;color:var(--faint);font-size:11px}
.varsbox .varssub{padding:0 16px 8px;font-size:11px;color:var(--faint);line-height:1.7}
.varsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;padding:0 16px 14px}
.varsgrid .vf label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.varsgrid .vf select,.varsgrid .vf input{width:100%;height:30px;border:1px solid var(--line-hi);border-radius:7px;padding:0 8px;font:inherit;font-size:12px;background:#fff;color:var(--text)}
.varsgrid .vf.miss label{color:var(--red);font-weight:600}
.varsgrid .vf.miss select,.varsgrid .vf.miss input{border-color:var(--red)}
/* 多选的 columns（协变量）：一排可点的列名，选中高亮。单选那几个仍是下拉。 */
.varsgrid .vf .vchips{display:flex;flex-wrap:wrap;gap:4px}
.varsgrid .vf .vchip{padding:3px 8px;border:1px solid var(--line-hi);border-radius:6px;background:#fff;
  color:var(--muted);font:inherit;font-size:11px;line-height:1.5;cursor:pointer}
.varsgrid .vf .vchip:hover{border-color:var(--accent)}
.varsgrid .vf .vchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* 自动认列：每格底下一行「凭什么这么认」。用户核对的是这句话，不是那个下拉本身 —— 所以它
   必须始终在场，不能收进 title 提示里（悬停才看得见 = 没人看得见）。 */
.varsgrid .vf .vwhy{margin-top:4px;font-size:11px;line-height:1.6;color:var(--faint)}
.varsgrid .vf .vwhy b{font-weight:600;color:var(--muted)}
.varsgrid .vf.auto select{border-color:#bcd4f5;background:#f7fbff}
.varsgrid .vf .vtag{display:inline-block;margin-left:5px;padding:0 5px;border-radius:5px;font-size:10px;
  font-weight:600;vertical-align:1px;background:#eaf2fe;color:#2d61b5}
.varsgrid .vf .vtag.low{background:#fdf3e6;color:#8a5a12}
/* 确认条：整个改动的落点。自动填完【不算数】，用户点了这里才算「以我指定的为准」 */
.varsconfirm{margin:0 16px 12px;padding:10px 12px;border:1px solid #cfe0f8;background:#f5f9ff;
  border-radius:var(--r-sm);font-size:12px;line-height:1.75;color:#28456f}
.varsconfirm.done{border-color:#cfe8d4;background:#f4faf5;color:#2c6136}
.varsconfirm .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.varsconfirm button{height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--line-hi);
  background:#fff;color:var(--text);font:inherit;font-size:12px;cursor:pointer}
.varsconfirm button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.varsconfirm button.pri:hover{background:var(--accent-deep)}
.varsconfirm .lnk{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;height:auto}
/* 前 5 行原样：认列认得对不对，看一眼真数据最快 */
.varspeek{margin:0 16px 12px}
.varspeek > summary{cursor:pointer;font-size:11px;color:var(--faint);list-style:none}
.varspeek > summary::-webkit-details-marker{display:none}
.varspeek .tw{overflow-x:auto;margin-top:7px;border:1px solid var(--line);border-radius:var(--r-sm)}
.varspeek table{border-collapse:collapse;font-size:11px;white-space:nowrap}
.varspeek th,.varspeek td{padding:4px 9px;border-bottom:1px solid var(--line);text-align:left}
.varspeek th{background:var(--bg-soft, #f6f7f9);font-weight:600;position:sticky;top:0}
.varspeek td{color:var(--muted)}
.varspeek tr:last-child td{border-bottom:none}
.varspeek th.hit{color:#2d61b5}

/* 多文件条（source.multi 的模块）：已传的每一份一枚 chip，点着切换，× 删除，末尾一个「+ 再传一张」 */
.filestrip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;overflow-x:auto;
  border-bottom:1px solid var(--line);background:rgba(231,234,239,.96)}
.filestrip[hidden]{display:none}
.filestrip .fchip{display:inline-flex;align-items:center;gap:6px;flex:none;max-width:230px;height:27px;padding:0 4px 0 9px;
  border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:12px;cursor:pointer}
.filestrip .fchip:hover{border-color:var(--line-hi)}
.filestrip .fchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.filestrip .fchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filestrip .fchip .x{width:18px;height:18px;flex:none;border:none;background:none;border-radius:5px;color:var(--faint);
  cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1}
.filestrip .fchip .x:hover{background:#fdecea;color:var(--red)}
.filestrip .fchip .x:disabled{opacity:.4;cursor:default}
.filestrip .addf{flex:none;height:27px;padding:0 10px;border:1px dashed var(--line-hi);border-radius:8px;background:none;
  color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
.filestrip .addf:hover{border-color:var(--accent);color:var(--accent)}
.filestrip .addf:disabled{opacity:.5;cursor:default}
.filestrip .fnote{flex:none;font-size:11px;color:var(--faint);margin-left:2px}

/* 数据表预览（stats 左栏）：csv/tsv 直接渲染；xlsx 在前端解压解析后同样渲染成表 */
.tablewrap{position:absolute;inset:0;overflow:auto;padding:14px 16px;background:#fff}
.tablewrap .sheetbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px;color:var(--muted)}
.tablewrap .sheetbar select{height:26px;border:1px solid var(--line-hi);border-radius:7px;background:#fff;font:inherit;font-size:12px;padding:0 6px}
.tablewrap table{border-collapse:collapse;font-size:12px;white-space:nowrap}
.tablewrap th,.tablewrap td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.tablewrap th{background:var(--panel-soft);font-weight:600;position:sticky;top:0;z-index:1}
.tablewrap tbody tr:nth-child(even){background:#fafbfc}
.tablewrap .more{margin-top:10px;font-size:11px;color:var(--faint)}

.introcard .tip{margin-top:22px;font-size:11px;color:var(--faint);line-height:1.8}
.introcard .err{margin-top:14px;padding:10px 12px;border-radius:var(--r-sm);background:#fdecea;border:1px solid #f5c2bd;color:var(--red);font-size:12px;display:none;text-align:left;line-height:1.75}
.introcard .err.on{display:block}
/* 不是错、只是要交代一句（例如点开的是旧版留下的、没有原文的会话）——别用红色吓人 */
.introcard .err.info{background:var(--panel-soft);border-color:var(--line-hi);color:var(--muted)}
.bar{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:14px;display:none}
.bar.on{display:block}
.bar i{display:block;height:100%;width:30%;background:var(--accent);border-radius:999px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
@media (max-width:520px){
  .introcard{padding:32px 22px 26px}
  .introcard h1{font-size:22px}
}

/* ---------- 阅读器三栏 ---------- */
.reader{display:flex;height:100vh;overflow:hidden}
.reader[hidden]{display:none}

/* 左：原文 */
.doc-pane{flex:1 1 0;min-width:0;background:#e7eaef;display:flex;flex-direction:column}
.docbar{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(231,234,239,.96)}
.docbar .ficon{width:28px;height:28px;border-radius:8px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.docbar .ficon svg{width:15px;height:15px}
.docbar .fmeta{flex:1;min-width:0}
.docbar .fname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docbar .fsub{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barsep{width:1px;height:18px;background:var(--line-hi);flex:none;margin:0 2px}
.zoom{display:flex;align-items:center;gap:2px;flex:none;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
.zoom button{width:26px;height:24px;border:none;background:none;border-radius:6px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.zoom button:hover{background:var(--accent-soft);color:var(--accent)}
.zoom button svg{width:14px;height:14px}
.zoom .zval{min-width:40px;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.docview{flex:1;position:relative;overflow:hidden;background:#e7eaef}
.docview iframe{position:absolute;left:0;top:0;border:0;background:#fff;transform-origin:top left}
.docmsg{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted);font-size:13px;line-height:1.9}

/* 中：助手 */
.ai-pane{width:clamp(440px,42%,660px);min-width:400px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.ai-head{height:48px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;background:#fff}
.ai-head .title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.ai-head .title svg{width:17px;height:17px;color:var(--accent)}
.ai-head .badge{font-size:11px;color:var(--faint);background:var(--panel-soft);border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.ai-head .acts{display:flex;align-items:center;gap:6px}
/* ★ min-height 不能省：结果正文、产物列表、追问入口全在这一格里。它上面的「变量对应」展开时
   自然高度很大，没有下限的话这一格会被压到零点几行（flex 项 overflow:auto 时 min-height:auto
   解析成 0），屏幕上就只剩一条带滚动条的缝 —— 而那正是"跑完了却什么都看不见"的样子。 */
.ai-body{flex:1 1 0;min-height:220px;overflow:auto;padding:18px 18px 22px;background:var(--panel-soft)}
.pane{display:none}
.pane.on{display:block}

/* 运行状态条 */
.runbox{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.runbox .rh{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line-hi);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
/* ★ 选择器必须带 .pills：下面「发送 / 终止」那组按钮也叫 .pill，两条同名规则里后写的赢，
   技能小标签会被套上按钮样式（32px 高、白字白底 = 看不见字）。加一层限定就各归各。 */
.pills .pill{display:inline-flex;align-items:center;gap:5px;height:auto;min-width:0;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid rgba(59,111,212,.25)}
.runbox details{margin-top:9px}
.runbox summary{cursor:pointer;font-size:11px;color:var(--faint)}
.runbox .trow{font-size:11px;color:var(--muted);padding:3px 0;display:flex;gap:7px}
.runbox .trow .st{width:12px;flex:none;color:var(--faint)}

.notebox{padding:11px 13px;border-radius:var(--r-sm);font-size:12px;line-height:1.8;margin-bottom:14px}
.notebox.warn{background:#fdf3e6;border:1px solid #f0d7ae;color:#8a5a12}
.notebox.err{background:#fdecea;border:1px solid #f5c2bd;color:var(--red)}
.notebox.info{background:#fff;border:1px solid var(--line);color:var(--muted)}
/* 闸红横幅里的「仍要出件 / 恢复拦截」。做成次要按钮：它是逃生口，不该比"去改稿"更显眼。 */
.notebox .gbypass{margin-left:8px;padding:3px 10px;border-radius:6px;border:1px solid currentColor;
  background:transparent;color:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.notebox .gbypass:hover{background:rgba(0,0,0,.05)}
.notebox .gbypass:disabled{opacity:.5;cursor:default}

/* ---- 两阶段模式的阶段卡（目前只有「演示 PPT」：先出大纲，用户确认后才出片）----
   【为什么必须有这张卡】第一步跑完时，面板里躺着的是一篇大纲，而用户点的按钮叫「演示 PPT」，
   头部按钮还变成了「重新生成」——看上去就是"我要片子，它给了我一篇文字，然后说做完了"。
   真正的下一步（让它照这份大纲出片）此前在界面上【没有任何入口】：唯一能想到的办法是在
   输入框回一句"确认，出片"，而那会被打上追问标记，追问的规矩恰恰是"不要重跑、不要产出文件"。
   这张卡把"现在到哪一步 / 下一步点哪里 / 想改先说话"三件事写在正文最上面，按钮直接发第二阶段。 */
.stagecard{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-sm);
  background:var(--panel-soft);padding:12px 14px;margin-bottom:14px}
.stagecard.ok{border-left-color:var(--green)}
.stagecard .sc-step{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:5px}
.stagecard.ok .sc-step{color:var(--green)}
.stagecard .sc-md{font-size:12px;line-height:1.85;color:var(--muted)}
.stagecard .sc-md p{margin:0}
.stagecard .sc-md p+p{margin-top:6px}
.stagecard .sc-act{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:11px}
.stagecard .sc-go{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border:none;border-radius:8px;
  background:var(--accent);color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.stagecard .sc-go:hover{background:var(--accent-deep)}
.stagecard .sc-go[disabled]{background:#c3ccd8;cursor:not-allowed}
.stagecard .sc-go svg{width:14px;height:14px}
.stagecard .sc-hint{font-size:11px;color:var(--faint)}
/* 已出片之后，大纲折进来（它已经不是这一格的主角了，但也不能消失：用户会回来核对讲稿） */
.foldbody{margin-bottom:14px}
.foldbody>summary{cursor:pointer;font-size:12px;color:var(--muted);padding:5px 0}
.foldbody>summary:hover{color:var(--accent)}

/* ---- 图标按钮 + 悬停浮出的文字 ----
   工具条上的动作全是图标（换一份 / 最近 / 工作台 / 设置 / 重新生成）。原生 title 要悬停约
   一秒才出，图标按钮上等于没有提示 —— 用户只能靠猜，猜错的代价是「换一份」把当前会话换掉。
   所以自己画一个即时浮层：写在 data-tip 上，谁都能用。 */
.ibtn{position:relative;width:32px;height:32px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);cursor:pointer;transition:color .15s,background .15s,border-color .15s}
.ibtn:hover:not([disabled]){color:var(--accent);border-color:var(--line-hi);background:var(--panel-soft)}
.ibtn[disabled]{opacity:.45;cursor:not-allowed}
.ibtn svg{width:15px;height:15px}
.ibtn.danger:hover:not([disabled]){color:var(--red);border-color:#f0c4bf;background:#fdecea}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);right:0;z-index:400;padding:5px 9px;border-radius:7px;background:rgba(20,24,30,.92);color:#fff;font-size:11px;line-height:1.45;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow-sm)}
/* 屏幕左半边的按钮把浮层挂到左边，否则贴着窗口右缘会被裁掉 */
[data-tip].tipL:hover::after{right:auto;left:0}

/* ---- 配套数值表（refcheck 的「数据完整性」）----
   此前这里只有一个按钮、传完什么都不显示：用户不知道传上去没有、传了几份、传的是不是刚才
   那一份，更没有办法删掉传错的。改成一张常驻的清单卡：传了什么一目了然，可加可删。 */
.datacard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 13px 13px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.datacard .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.datacard .dh .t{font-size:12px;font-weight:600;color:var(--text)}
.datacard .dh .n{font-size:11px;color:var(--faint)}
.datacard .dempty{font-size:12px;color:var(--faint);line-height:1.8;padding:2px 0 4px}
.datacard .drow{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-soft);margin-bottom:6px}
.datacard .drow .fic{width:26px;height:26px;flex:none;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:600;letter-spacing:.02em}
.datacard .drow b{flex:1;min-width:0;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datacard .drow .sz{font-size:11px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.datacard .drow .del{flex:none;width:26px;height:26px;display:grid;place-items:center;border:none;background:none;border-radius:7px;color:var(--faint);cursor:pointer;transition:.15s}
.datacard .drow .del:hover{color:var(--red);background:#fdecea}
.datacard .drow .del[disabled]{opacity:.4;cursor:not-allowed}
.datacard .drow .del svg{width:14px;height:14px}
/* 「添加」做成整行的虚线投放位，一眼看得出这里还能再加 —— 比一个灰扑扑的小按钮好认得多 */
.addbtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px;border:1px dashed var(--line-hi);border-radius:var(--r-sm);background:none;color:var(--muted);font-size:12px;cursor:pointer;transition:.15s}
.addbtn:hover:not([disabled]){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.addbtn[disabled]{opacity:.5;cursor:not-allowed}
.addbtn svg{width:14px;height:14px}

.empty-hint{padding:38px 18px;text-align:center;color:var(--faint);font-size:13px;line-height:2}
.empty-hint .big{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px}

/* markdown 正文 */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow-sm)}
.md{font-size:13px;line-height:1.85;color:var(--text);word-wrap:break-word;overflow-wrap:anywhere}
.md h1{font-size:18px;margin:18px 0 10px}
.md h2{font-size:16px;margin:16px 0 9px}
.md h3{font-size:14px;margin:14px 0 8px}
.md h4,.md h5,.md h6{font-size:13px;margin:12px 0 7px}
.md h1:first-child,.md h2:first-child,.md h3:first-child{margin-top:0}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:20px}
.md li{margin-bottom:5px}
.md strong{font-weight:600}
.md code{background:var(--panel-soft);border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
.md pre{background:#f7f8fa;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;overflow:auto}
.md pre code{background:none;border:none;padding:0}
.md blockquote{margin:0 0 10px;padding:6px 12px;border-left:3px solid var(--line-hi);color:var(--muted);background:var(--panel-soft);border-radius:0 6px 6px 0}
.md hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.md img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.md a{color:var(--accent)}
.tblw{overflow-x:auto;margin:0 0 10px}
.md table{border-collapse:collapse;font-size:12px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.md th{background:var(--panel-soft);font-weight:600}
.md td.num{text-align:right;font-variant-numeric:tabular-nums}

/* 图片产物的缩略图（见 thumbsHtml）。一行两张，窄面板时自动落成一列。
   白底 + 细边：统计图多半是白底，落在灰底面板上不给边框会糊成一片。 */
.figs{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fig{margin:0;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;overflow:hidden;cursor:zoom-in;transition:border-color .15s,box-shadow .15s}
.fig:hover{border-color:var(--accent);box-shadow:var(--shadow-sm)}
.fig img{display:block;width:100%;max-height:260px;object-fit:contain;background:#fff}
.fig figcaption{padding:6px 9px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 产物 */
.files{margin-top:14px}
.files .ft{font-size:11px;color:var(--faint);margin-bottom:7px}
.frow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;margin-bottom:6px}
.frow svg{width:15px;height:15px;color:var(--accent);flex:none}
.frow b{flex:1;min-width:0;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 「预览」与「下载」都是图标（眼睛 / 下箭头），与聊天页（index.html）产出侧栏那两颗一模一样
   —— 同一个动作在两个界面长同一个样，用户不用重新认。悬停才变色，静止时不跟文件名抢注意力。
   一个是 <button>、一个是 <a>，所以要显式压掉链接的下划线与继承色。 */
.frow .fbtn{flex:none;display:flex;align-items:center;padding:2px;border:none;background:none;cursor:pointer;color:var(--muted);text-decoration:none;border-radius:6px;transition:color .15s,background .15s}
.frow .fbtn:hover{color:var(--accent);background:var(--panel-soft)}
.frow .fbtn svg{color:inherit}   /* 否则被上面 .frow svg 的 accent 焊死，悬停不会变色 */
.frow .fnote{font-size:11px;color:var(--faint);flex:none}

/* 产物预览浮层。
   【为什么必须有】原先产物那一行只给了一个 target=_blank 的链接。而 .md / .csv / .json / .py
   这些类型浏览器【不会显示、只会下载】——点下去新标签一闪就没，用户看到的就是"点了没反应"。
   所以就地渲染：文本/表格/图片/PDF 自己画，Word 与 PPT 走服务端 /api/preview 转换。 */
.pvmask{position:fixed;inset:0;z-index:300;background:rgba(17,24,39,.42);display:none;padding:30px 22px}
.pvmask.on{display:grid;place-items:center}
.pvbox{width:min(1080px,94vw);height:min(86vh,920px);background:#fff;border:1px solid var(--line-hi);border-radius:var(--r-md);box-shadow:var(--shadow-md);display:flex;flex-direction:column;overflow:hidden}
.pvhead{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-soft)}
.pvhead svg{width:15px;height:15px;color:var(--accent);flex:none}
.pvhead .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvhead .x{border:none;background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:2px;border-radius:6px}
.pvhead .x:hover{background:#fff;color:var(--text)}
.pvbody{flex:1;position:relative;overflow:auto;background:#fff}
.pvbody.pad{padding:16px 18px}
.pvbody iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:#fff}
.pvbody pre.txt{margin:0;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--text)}
/* 面板正文里内嵌的 Word/PPT 预览。给死高度（而不是随内容撑开）：面板本身是滚动容器，
   iframe 高度撑到内容全长会把外层滚动条搞成两层，用户滚半天不知道自己在滚哪一层。 */
.card.docpv{padding:0;overflow:hidden}
.card.docpv iframe{display:block;width:100%;height:62vh;min-height:360px;border:0;background:#fff}
.pvbody img.shot{display:block;max-width:100%;margin:0 auto;border:1px solid var(--line);border-radius:8px}
/* renderCsv 是给左栏写的：.tablewrap 用 position:absolute 铺满那一栏。放进浮层要还原成正常流，
   否则它会盖住后面追加的"内容被截断"提示（提示看不见 = 用户以为看到的就是全部）。 */
.pvbody .tablewrap{position:static;padding:14px 16px 0}
.pvmsg{padding:34px 26px;text-align:center;color:var(--muted);font-size:13px;line-height:1.95}
.pvcut{margin-top:12px;font-size:11px;color:var(--faint)}

/* 聊天 */
.msg{margin-bottom:16px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;padding:9px 13px;font-size:13px;line-height:1.65;max-width:88%;white-space:pre-wrap;word-break:break-word}
.msg.ai .bubble{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.msg.ai .who{display:flex;align-items:center;gap:7px;color:var(--accent);font-weight:600;font-size:12px;margin-bottom:9px}
.msg.ai .who svg{width:14px;height:14px}
.msg.tag .bubble{background:#fff;border:1px dashed var(--line-hi);border-radius:12px;padding:9px 13px;font-size:12px;color:var(--muted)}

/* 追问区：挂在某一格结果【下面】的那串问答（见 askHtml）。
   用一条虚线把它和结果正文分开 —— 不分的话，追问的回答看着像是结果的一部分，
   而它俩的来源完全不同（一个是跑出来的产物，一个是随口问的）。 */
.askwrap{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line-hi)}
.askwrap .askt{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--faint);margin-bottom:12px}
.askwrap .askt svg{width:13px;height:13px}

.composer{flex:none;border-top:1px solid var(--line);padding:12px 16px 14px;background:#fff}
.composer .wrap{display:flex;align-items:flex-end;gap:9px;background:var(--panel-soft);border:1px solid var(--line-hi);border-radius:var(--r-md);padding:9px 11px;transition:.15s}
.composer .wrap:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{flex:1;border:none;background:none;outline:none;resize:none;font:inherit;font-size:13px;line-height:1.55;color:var(--text);max-height:130px;min-height:22px}
.composer textarea::placeholder{color:var(--faint)}
.composer .foot{margin-top:7px;font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:10px}
.composer .foot .kbd{flex:none;white-space:nowrap}
/* 交接卡：从别的模式「转交」过来的那份结果，挂在输入框上方等着随下一句话一起发出。
   摆在这里而不是对话流里，是因为它【还没发出去】—— 画成一条消息的话，用户会以为已经发了。 */
.composer .hoff{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px;padding:8px 10px;border:1px dashed rgba(59,111,212,.45);border-radius:10px;background:var(--accent-soft)}
.composer .hoff svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--accent)}
.composer .hoff .t{flex:1;min-width:0;font-size:12px;line-height:1.6;color:#3a4a63}
.composer .hoff .t b{color:var(--accent)}
.composer .hoff .x{flex:none;width:22px;height:22px;display:grid;place-items:center;border:none;background:none;border-radius:6px;color:var(--faint);cursor:pointer}
.composer .hoff .x:hover{background:#fff;color:var(--red)}
.composer .hoff .x svg{width:12px;height:12px;margin:0;color:inherit}

/* 发送 / 终止 —— 与工作台聊天（index.html 的 #send / #stop）同一套设计：
   默认是 32px 的圆钮、只露一个图标；悬停时展开成胶囊并把文字滑出来。
   两个钮占【同一个位置】、互斥显示：一开跑，「发送」让位给「终止」。
   此前这里是"方块蓝发送钮 + 底栏一个红字小方框「终止本轮」"，两个动作分居两行、长相也各是各的，
   跟工作台完全对不上；正在跑的时候用户还得往底栏找那个小字才能停下来。
   modefoot（非聊天模式的状态底栏）里的终止钮共用这套样式，免得同一个动作在同一个界面有两种长相。 */
.pill{display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;padding:0;border:none;border-radius:999px;color:#fff;cursor:pointer;flex:none;overflow:hidden;transition:background .18s ease,padding .2s ease,filter .15s}
.pill[hidden]{display:none}                     /* 别让上面的 display 盖过 hidden 属性 */
.pill svg{width:15px;height:15px;flex:none}
.pill .lbl{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:500;letter-spacing:.04em;margin-left:0;transition:max-width .22s ease,opacity .18s ease,margin-left .22s ease}
.pill:hover:not([disabled]){padding:0 15px}
.pill:hover:not([disabled]) .lbl{max-width:52px;opacity:1;margin-left:6px}
.pill:active{transform:translateY(1px)}
.pill.go{background:var(--accent)}
.pill.go:hover:not([disabled]){background:var(--accent-deep)}
.pill.go[disabled]{background:#c3ccd8;cursor:not-allowed}
.pill.halt{background:var(--red)}
.pill.halt:hover{background:var(--red-deep)}

/* 非聊天模式的底栏 */
.modefoot{flex:none;border-top:1px solid var(--line);padding:10px 16px;background:#fff;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--faint)}
.modefoot .grow{flex:1;min-width:0}

/* 右：模式条 */
.tools{width:64px;flex:none;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;z-index:30}
.tool-btn{width:52px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 3px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;color:var(--faint);transition:.15s;position:relative}
.tool-btn:hover{background:var(--panel-soft);color:var(--accent);border-color:var(--line)}
.tool-btn.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(59,111,212,.35)}
.tool-btn svg{width:18px;height:18px}
.tool-btn span{font-size:10px;line-height:1.25;text-align:center}
.tool-btn .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%}
.tool-btn .dot.run{background:var(--accent);animation:blink 1s ease-in-out infinite}
.tool-btn .dot.done{background:var(--green)}
.tool-btn .dot.err{background:var(--red)}
@keyframes blink{50%{opacity:.25}}

/* 窄窗口：三栏改上下堆叠。
   ★ 两处必须显式覆写，否则这个布局是坏的：
     ① .doc-pane 的 flex:1 1 0 —— 列方向下 flex-basis:0 管的就是【高度】，它压过 height，
        原文栏会塌成一条 48px 的工具条（只剩文件名，文献本身完全看不见）；
     ② .reader 若用 height:auto，两栏加起来必然超过一屏 → 整页出现纵向滚动，
        又回到"要用滚轮往下拉才看得到下半截"那种观感。这里改成整体钉死一屏、内部分配。 */
@media (max-width:1080px){
  .reader{flex-direction:column;height:100vh;overflow:hidden}
  .doc-pane{flex:0 0 45%;height:auto;min-height:0}
  .ai-pane{width:100%;min-width:auto;flex:1 1 auto;height:auto;min-height:0;border-left:none;border-top:1px solid var(--line)}
  .tools{flex-direction:row;width:100%;flex:none;border-left:none;border-top:1px solid var(--line);padding:8px;justify-content:center;flex-wrap:wrap;gap:8px}
  .tool-btn{flex-direction:row;width:auto;padding:7px 12px;gap:7px}
}
</style>
</head>
<body>

<div class="stage"></div>

<!-- 「最近」下拉。两个位置的按钮共用同一个菜单（见 .menu 的说明），所以它挂在 body 上，
     打开时按触发按钮算坐标。 -->
<div class="menu" id="recentMenu"></div>
<div class="menu setmenu" id="setMenu"></div>
<!-- 「转交给智能助手」时选覆盖 / 续写 / 取消。同样挂在 body 上、按触发按钮算坐标（见 placeMenu）。 -->
<div class="menu" id="hoffMenu"></div>

<!-- ============ 首屏：上传 ============
     文案、拖拽区提示、chips、必答题、按钮文字全部由 renderIntro() 按模块配置填进去，
     这里只留骨架。硬编码任何一句都会让另外三个模块说错话。 -->
<div class="intro" id="intro" hidden>
  <div class="introcard">
    <div class="hero-ic" id="introIcon"></div>

    <h1 id="introTitle"></h1>
    <p class="lead" id="introLead"></p>

    <div class="divider"></div>

    <div class="drop" id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      <div class="d1" id="dropTitle"></div>
      <div class="d2" id="dropHint"></div>
    </div>
    <input type="file" id="file" hidden>

    <div id="pickedSlot"></div>
    <div id="introAsk"></div>
    <div class="bar" id="upbar"><i></i></div>
    <div class="err" id="introErr"></div>

    <!-- 这枚按钮只负责【上传并进入】：传完不再自动开跑，所以图标用上传箭头而不是那枚三角。
         全站的实心三角只留给"真的会开跑"的按钮（头部「开始」、面板里的大按钮、设置弹层里那枚），
         免得用户按下三角却什么都没发生。 -->
    <button class="gobtn" id="btnStart" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      <span id="btnStartTxt">开始</span>
    </button>

    <div class="chips" id="introChips"></div>
    <div class="tip" id="introTip"></div>
  </div>

  <!-- 与阅读器工具条同一套图标 + 悬停浮出文字（.ibtn / [data-tip]）：同一个动作在两屏长同一个样。
       首屏这两个贴在窗口右上角，浮层照默认往右对齐即可（不会出界）。 -->
  <div class="intronav">
    <button class="ibtn" type="button" data-act="recent" data-tip="最近做过的" aria-label="最近做过的">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/></svg>
    </button>
    <button class="ibtn" type="button" data-act="ws" data-tip="新建会话（换个模块）" aria-label="新建会话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>
    </button>
  </div>
</div>

<!-- ============ 阅读器 ============ -->
<div class="reader" id="reader" hidden>

  <!-- 左：原文 -->
  <div class="doc-pane">
    <div class="docbar">
      <div class="ficon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
      </div>
      <div class="fmeta">
        <div class="fname" id="docName">—</div>
        <div class="fsub" id="docSub"></div>
      </div>
      <div class="zoom" id="zoomBox" hidden>
        <button id="zoomOut" title="缩小" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg></button>
        <div class="zval" id="zval">100%</div>
        <button id="zoomIn" title="放大" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3"/></svg></button>
      </div>
      <span class="barsep"></span>
      <!-- 三个导航动作都是图标 + 悬停浮出文字（见 .ibtn / [data-tip]）。
           aria-label 不能省：图标按钮没有可读文本，读屏软件只会念出 "button"。 -->
      <button class="ibtn" type="button" data-act="new" data-tip="换一份（新开一个会话）" aria-label="换一份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
      </button>
      <button class="ibtn" type="button" data-act="recent" data-tip="最近做过的" aria-label="最近做过的">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/></svg>
      </button>
      <button class="ibtn" type="button" data-act="ws" data-tip="新建会话（换个模块）" aria-label="新建会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>
      </button>
    </div>
    <!-- 多文件模块（source.multi）才出现：已传的每一份都在这条上，点一下换着看，× 删掉传错的。
         单文件模块（导读/润色/核查）保持原样，这条整条不画。 -->
    <div class="filestrip" id="fileStrip" hidden></div>
    <div class="docview" id="docView"><div class="docmsg">正在载入…</div></div>
  </div>

  <!-- 中：助手 -->
  <div class="ai-pane">
    <div class="ai-head">
      <div class="title" id="paneTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M12 6v6l4 2"/></svg><span>文献导读</span></div>
      <div class="acts">
        <span class="badge">基于本文</span>
        <!-- 开始 / 终止占同一个位置、互斥显示（与聊天输入框旁那一对同一套图标）。
             点模式条【不再自动开跑】，这里就是那个"开跑"的入口，data-tip 会写清在跑哪一个。 -->
        <button class="pill go" id="btnGo" type="button" aria-label="开始" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5.5v13a1 1 0 001.53.85l10-6.5a1 1 0 000-1.7l-10-6.5A1 1 0 008 5.5z"/></svg><span class="lbl">开始</span>
        </button>
        <button class="pill halt" id="btnHalt" type="button" aria-label="终止" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span class="lbl">终止</span>
        </button>
        <!-- 「继续」：只在【订阅断了、而后台那一轮已经跑完】时出现。它不是重跑 ——
             那一轮的结果早就在服务端了（产物落了盘、回复进了历史），断的只是浏览器这条 SSE。
             此前这里只给「重新生成」，用户照着提示点下去，等于把已经做好的东西再花十分钟做一遍
             （PPT 那一格最狠）。图标用"向右取回"，与「重新生成」的回环箭头刻意不同形。 -->
        <button class="ibtn" id="btnResume" type="button" data-tip="继续" aria-label="继续" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l4.5 3.5-4.5 3.5z"/></svg>
        </button>
        <button class="ibtn" id="btnRerun" type="button" data-tip="重新生成" aria-label="重新生成" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 10-2.3 6.3"/><path d="M20 4v7h-7"/></svg>
        </button>
        <!-- 转交给智能助手：把【本面板这一轮的结果】做成一张交接卡，挂到智能助手的输入框上，
             随用户下一句话一起发出（见 doHoff / renderHoff）。data-act 而不是只绑 id ——
             不然 document 上那个"点空白处收起弹层"的监听会在本次点击冒泡时把刚开的弹层当场收掉。 -->
        <button class="ibtn" id="btnHoff" type="button" data-act="hoff" data-tip="转交给智能助手" aria-label="转交给智能助手" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h6a2 2 0 012 2v9a2 2 0 01-2 2h-3l-4 3v-3"/><path d="M2 10h7M6.5 7l3 3-3 3"/></svg>
        </button>
        <button class="ibtn" id="btnSettings" type="button" data-tip="本模块的设置" aria-label="设置" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 008.9 19a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1A1.7 1.7 0 004.6 8.9a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        </button>
      </div>
    </div>

    <!-- 变量对应（只有 stats 有）。默认折叠：不做生存分析的人根本不用展开它；
         点某个模式时若缺了它必需的列，会自动展开并把缺的那几个标红。 -->
    <details class="varsbox" id="varsBox" hidden>
      <summary><span id="varsTitle">变量对应</span><span class="varssum" id="varsSum"></span></summary>
      <div class="varssub" id="varsSub"></div>
      <!-- 自动认列的确认条。【为什么必须有】自动填的值再准也只是机器的判断；不经用户点头就
           当成"用户指定的"发给模型，等于把一个错列名披上用户的权威 —— 而列名认错不会报错，
           只会产出一条看着很正常的错 KM 曲线（这正是这整块面板存在的理由）。
           所以：自动填 = 省掉用户找列的力气；确认 = 仍然由用户负责。两件事都不能省。 -->
      <div class="varsconfirm" id="varsConfirm" hidden></div>
      <div class="varsgrid" id="varsGrid"></div>
      <!-- 前 N 行原样：核对"这一列到底是什么"，看一眼真数据比读六个下拉快得多 -->
      <details class="varspeek" id="varsPeek" hidden>
        <summary id="varsPeekSum">看看表的前几行</summary>
        <div class="tw" id="varsPeekBody"></div>
      </details>
      <!-- 服务端对「填的列名在真实表头里存不存在」的体检结论落在这里。CSV 能读表头时才有；
           xlsx 读不出表头，那一路由模块前言要求模型自己核对列名后停下报错。 -->
      <div class="notebox warn" id="varsWarn" hidden></div>
    </details>

    <!-- 面板由 installConfig 按模式清单生成（每个模式一个 .pane），这里留空 -->
    <div class="ai-body" id="aiBody"></div>

    <!-- 智能助手模式：输入框 -->
    <div class="composer" id="composer" hidden>
      <!-- 待发出的交接卡（从别的模式转交过来的那份结果）。空的时候整条收起来。 -->
      <div class="hoff" id="hoffChip" hidden></div>
      <div class="wrap">
        <textarea id="q" rows="1" placeholder="对着左边这篇文献随便问，例如：第 3 组的样本量是多少？"></textarea>
        <!-- 发送 / 终止占同一个位置，互斥显示（与工作台一致）。文字包在 .lbl 里，悬停展开才露出来。 -->
        <button class="pill go" id="btnSend" type="button" aria-label="发送" title="发送">

const ic = (n) => ICON[n] || ICON.dot

/* ---- 极简 markdown 渲染 ----
   【为什么不复用 index.html 那份】那一份缠着灯箱、产物侧栏、ask 选项卡与会话态（sidQ / mdImgSrc），
   拆出来要动 5000 行的主页面，风险远大于收益。这里只留本页面真正会遇到的语法：
   标题 / 列表 / 表格 / 代码 / 引用 / 粗斜体 / 链接 / 同源图片。行为对不齐的地方只会是"少渲染一种花样"，
   不会渲染错。 */
function mdImg(u) {
  if (!/\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(u)) return null
  if (/^https?:/i.test(u)) return null                            // 外链图片一概不加载（同 index.html 的口径）
  const m = u.replace(/^\.\//, "").match(/^([^\/?#:]+(?:\/[^\/?#:]+)?)$/)
  return m ? "api/raw?name=" + encodeURIComponent(m[1]) + sidQ() : null
}
function mdInline(s) {
  const codes = []
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "@@C" + (codes.length - 1) + "@@" })
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (m, a, u) => {
    const src = mdImg(u)
    return src ? '<img src="' + src + '" alt="' + a.replace(/"/g, "&quot;") + '">' : esc(a || u)
  })
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m, t, u) =>
    /^(https?:\/\/|api\/)/i.test(u) ? '<a href="' + u.replace(/"/g, "%22") + '" target="_blank" rel="noopener">' + t + "</a>" : t)
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/__([^_]+)__/g, "<strong>$1</strong>")
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>")
  return s.replace(/@@C(\d+)@@/g, (m, i) => "<code>" + codes[+i] + "</code>")
}
const splitRow = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim())
function renderMd(src) {
  src = (src || "").replace(/\r\n/g, "\n")
  const blocks = []
  src = src.replace(/```[\w-]*\n?([\s\S]*?)```/g, (m, code) => { blocks.push("<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>"); return "@@B" + (blocks.length - 1) + "@@" })
  const lines = esc(src).split("\n"), out = []
  let i = 0
  const blank = (l) => /^\s*$/.test(l)
  while (i < lines.length) {
    const l = lines[i]
    const pm = l.match(/^@@B(\d+)@@\s*$/); if (pm) { out.push(blocks[+pm[1]]); i++; continue }
    if (blank(l)) { i++; continue }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push("<hr>"); i++; continue }
    const h = l.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = h[1].length; out.push("<h" + n + ">" + mdInline(h[2].trim()) + "</h" + n + ">"); i++; continue }
    if (/^\s*&gt;\s?/.test(l)) { const b = []; while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) { b.push(lines[i].replace(/^\s*&gt;\s?/, "")); i++ } out.push("<blockquote>" + mdInline(b.join("<br>")) + "</blockquote>"); continue }
    if (/\|/.test(l) && i + 1 < lines.length && /-/.test(lines[i + 1]) && /^\s*\|?[\s:|-]*$/.test(lines[i + 1])) {
      const head = splitRow(l); i += 2; const rows = []
      while (i < lines.length && /\|/.test(lines[i]) && !blank(lines[i])) { const r = splitRow(lines[i]); while (r.length < head.length) r.push(""); rows.push(r.slice(0, head.length)); i++ }
      const isNum = (x) => /^[+-]?[\d,]*\.?\d+(\s*[%‰])?$/.test(x.replace(/[\s*]/g, ""))
      const cls = head.map((_, c) => { const v = rows.map((r) => (r[c] || "").trim()).filter(Boolean); return v.length && v.every(isNum) ? " class=\"num\"" : "" })
      out.push('<div class="tblw"><table><thead><tr>' + head.map((c) => "<th>" + mdInline(c) + "</th>").join("")
        + "</tr></thead><tbody>" + rows.map((r) => "<tr>" + r.map((c, x) => "<td" + cls[x] + ">" + mdInline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>")
      continue
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d+[.)]\s+/.test(l), items = []
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, "")); i++ }
      out.push((ordered ? "<ol>" : "<ul>") + items.map((t) => "<li>" + mdInline(t) + "</li>").join("") + (ordered ? "</ol>" : "</ul>"))
      continue
    }
    const buf = [l]; i++
    while (i < lines.length && !blank(lines[i]) && !/^\s*(#{1,6}\s|&gt;|([-*+]|\d+[.)])\s|@@B\d+@@)/.test(lines[i])) { buf.push(lines[i]); i++ }
    out.push("<p>" + mdInline(buf.join("<br>")) + "</p>")
  }
  return out.join("\n").replace(/@@B(\d+)@@/g, (m, x) => blocks[+x] || "")
}

/* ============================================================
   1. 模块配置：本页面【不认识任何一个具体模块】
   ------------------------------------------------------------
   模式清单、每个模式发什么话、首屏文案、设置字段、变量对应面板 —— 全部来自
   GET /api/modules/<id>/workflow 的 reader 段（定义在 workflows.mjs）。
   本文件只负责照着画、照着发、照着把结果摆回对应的面板。
   所以「加一个模式」「改一句提示词」只动 workflows.mjs，本文件一行都不用改
   ——但改 workflows.mjs 要重发安装包 / 重启网关，界面包收不了 .mjs（见文件头注）。

   MODES / ORDER 在 boot() 里由配置填好，之后与原来的用法完全一致。
   ============================================================ */
let MOD = "litread"        // 当前模块 id
let CFG = null             // reader 配置（workflows.mjs 的 reader 段）
let MODES = {}             // id → 模式定义（含由 file/out 字符串编译出来的正则）
let ORDER = []             // 模式在右侧条上的顺序
// 智能助手那一格的输入框提示与脚注。输入框是【共用】的（追问也用它），切模式时两句话都要换，
// 所以原文得留一份，否则从追问切回智能助手时提示词就永远停在"对着这份「文献导读」的结果追问"。
let CHAT_PH = ""
let CHAT_FOOT = ""

/** 把下发的配置装进 MODES / ORDER。正则以字符串下发（要能 JSON 序列化），这里编译。 */
function installConfig(cfg) {
  CFG = cfg
  // 智能助手那一格的文案也归模块管。写死过一次："对着左边这篇文献随便问" 在数据模块里指着
  // 一张 Excel 说"这篇文献"，在核查模块里指着一份稿件说同样的话 —— 本文件不该认识任何一个
  // 具体模块（见文件头），文案同理。缺配置时的兜底措辞要【中性】，不许再提"文献"。
  CHAT_PH = (cfg.chat && cfg.chat.placeholder) || "对着左边这份文件随便问"
  CHAT_FOOT = $("chatFoot").textContent    // HTML 里写着的那句默认脚注，切回智能助手时还原它
  $("q").placeholder = CHAT_PH
  // ★ 把 intake 的默认值【播种进 SETTINGS】。不播种的后果不只是"显示不准"，而是会丢数据：
  //   settingsBlock() 发给模型时用的是 `SETTINGS[id] ?? f.default`（拿得到默认值），
  //   而设置弹层的 fieldControl 用 `String(SETTINGS[id])===String(o.v)` 选中项 —— undefined
  //   谁都不匹配，于是有默认值的字段一律显示成「（不指定）」。实测 humanize 八个字段里五个中招。
  //   最狠的是 multi 型的「润色目标」（默认 ["deai"]、必填）：弹层里一个勾都没有，用户想"再加一项
  //   语言润色"勾了 language，multi 分支从空数组起算 → SETTINGS.goals = ["language"]，
  //   **"去 AI 味"被静默丢掉**，而那正是这个模块存在的理由。
  //   服务端两条落盘路径都不做 withDefaults，所以这个错位刷新之后依然在，不是首屏一次性的。
  for (const f of cfg.intake || [])
    if (f.default !== undefined && SETTINGS[f.id] === undefined)
      SETTINGS[f.id] = Array.isArray(f.default) ? [...f.default] : f.default
  MODES = {}; ORDER = []
  const re = (x) => { try { return x ? new RegExp(x, "i") : null } catch (_) { return null } }
  for (const m of cfg.modes || []) {
    MODES[m.id] = { ...m, icon: ic(m.icon), file: re(m.file), out: re(m.out) }
    // 两阶段模式（「演示 PPT」：先大纲、用户确认后才出片）。stage2.done 也是字符串下发的正则，
    // 一并编译 —— 漏了它 stageFinals() 会拿 undefined 去 .test()，整格面板直接报错空白。
    if (m.stage2) MODES[m.id].stage2 = { ...m.stage2, done: re(m.stage2.done) }
    ORDER.push(m.id)
  }
}

/**
 * 某个模式发出去的那段话 = mark + prompt（占位符替换后）。
 *  {doc}  左栏那份文件名        {data} 配套数值表 / 数据表        {vars} 变量对应面板填了什么
 * 取不到值的占位符【整句删掉】，不能留下一个字面的 "{data}" 发给模型。
 *
 * @param stage2 true = 发第二阶段那段话（两阶段模式的「按这份大纲出片」）。
 *   ★ 前缀仍用【同一个 mark】：服务端与刷新后的前端都靠 mark 认这一轮归哪一格，
 *     换个标记就会被当成自由对话，产物落回聊天格、这一格照旧空着。也【不能】用 askMark ——
 *     追问的规矩明写着"不要重跑、不要产出文件"，用它发出去等于让模型不许出片。
 */
function promptFor(id, stage2) {
  const M = MODES[id]
  const tpl = stage2 ? (M && M.stage2 && M.stage2.prompt) : (M && M.prompt)
  if (!tpl) return ""
  const bq = (n) => "`" + n + "`"
  // {data}：stats 那种"上传的就是表"的模块用左栏那份；refcheck 用另传的配套数值表 ——
  // 可以有好几份，全都列出来（只发第一份的话，模型会把其余几份当不存在，用户完全看不出来）。
  // 多文件模块要把【全部】文件都列出来：只发当前在看的那张，模型会把其余几张当不存在，
  // 而用户在界面上明明看见传了三张 —— 这种"各说各话"最难被发现。
  const map = {
    doc: docName ? bq(docName) : "",
    data: docListStr(),
    vars: varsBlock(),
  }
  let t = tpl
  for (const [k, v] of Object.entries(map)) {
    const ph = "{" + k + "}"
    if (!t.includes(ph)) continue
    // 有值就替换；没值就把它所在的那一句整句去掉（句号/换行为界），免得留下半截话
    t = v ? t.split(ph).join(v) : t.replace(new RegExp("[^。\n]*" + ph + "[^。\n]*。?", "g"), "")
  }
  return M.mark + t + settingsBlock()
}

/** {data} 的取值：本会话【全部】数据表 / 配套数值表，反引号包好用顿号连起来 */
function docListStr() {
  const names = CFG.source.kind === "table"
    ? (docFiles.length ? docFiles.map((f) => f.name) : (docName ? [docName] : []))
    : dataFiles.map((f) => f.name)
  return names.map((n) => "`" + n + "`").join("、")
}

/**
 * 齿轮弹层里的设定 → 每一轮都跟着发出去。
 * 【为什么必须发】阅读器壳每个模式发的是一句【写死的】提示词，设定值一个字都不在里面；
 * 后端只把 `pin:true` 的字段钉进模块前言（stats 里只有 hasPHI 是 pin）。于是把「输出语言」
 * 改成 English、把「顺便出投稿级图」勾上之后，模型那边【什么都没收到】——界面上摆着一个开关，
 * 拨了却毫无变化，而用户没有任何办法看出是没传到。
 */
function settingsBlock() {
  const parts = []
  for (const id of (CFG && CFG.settings) || []) {
    const f = fieldDef(id); if (!f) continue
    const v = SETTINGS[id] !== undefined ? SETTINGS[id] : f.default
    const s = fmtSetting(f, v)
    if (s) parts.push(f.label + "＝" + s)
  }
  return parts.length ? "\n\n【本次设定，以此为准】" + parts.join("；") + "。" : ""
}

/** 设定值 → 人话（选项取它的中文标签，别把 "zh" / "true" 这种内部值发给模型） */
function fmtSetting(f, v) {
  if (v === undefined || v === null || v === "") return ""
  const lab = (x) => { const o = (f.options || []).find((o2) => String(o2.v) === String(x)); return o ? o.t : String(x) }
  if (f.type === "bool") return v === true || v === "true" ? "是" : "否"
  if (Array.isArray(v)) return v.length ? v.map(lab).join("、") : ""
  return lab(v)
}

/**
 * stats 的「变量对应」：把列对应拼成一段话，跟在 prompt 里的 {vars} 位置。
 *
 * ★ 分两栏发，不能混成一栏。自动认列（见 loadHeaders）让用户不必再从二十几个列名里挑六个，
 *   但机器认的和用户指的【权威完全不同】：
 *     · 用户点过「对，就按这个来」→ 以他指定的为准，模型照做；
 *     · 还没核对 → 必须原样告诉模型"这是机器认的、人还没看"，让它自己再核一遍取值形状。
 *   把后者也写成"以我指定的为准"，等于给一个可能认错的列名披上用户的权威 ——
 *   而列名认错不会报错，只会产出一条看着很正常的错 KM 曲线。
 */
function varsBlock() {
  if (!CFG || !CFG.vars) return ""
  const by = SETTINGS.__varsBy || {}
  const mine = [], auto = []
  for (const f of CFG.vars.fields || []) {
    const fld = fieldDef(f); const v = SETTINGS[f]
    if (!fld || v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length)) continue
    const s = fld.label + "＝" + (Array.isArray(v) ? v.join("、") : v)
    if (!SETTINGS.__varsOK && (by[f] === "ai" || by[f] === "rule")) auto.push(s)
    else mine.push(s)
  }
  if (!mine.length && !auto.length) return ""
  let out = ""
  if (mine.length) {
    out += "\n\n【变量对应，以我指定的为准】" + mine.join("；")
      + "。我没指定的列你可以推断，但**必须在回答里写清你把哪一列当成了什么**。"
  }
  if (auto.length) {
    out += "\n\n【下面这几列是系统读了表的前几行自动认出来的，我还没核对】" + auto.join("；")
      + "。**动手之前先自己核一遍**：每一列的取值形状对不对得上它的角色"
      + "（终点事件该是两值、随访时间该是非负的时长而不是日期、金标准该是两值…）。"
      + "对不上就停下来告诉我是哪一列、表里还有哪几列可选，**别将就着算**；"
      + "核对结论和你实际用的列都要写在回答里。"
  }
  return out
}

/** 按 id 找 intake 字段定义（设置弹层 / 变量面板都用它渲染控件） */
const fieldDef = (id) => (CFG && CFG.intake || []).find((f) => f.id === id) || null

/* ============================================================
   2. 状态
   ============================================================ */
const QS = new URLSearchParams(location.search)
let sid = QS.get("sid") || null
let docName = ""          // 左栏当前在看的那份文件名（会话上传目录里的裸文件名）
let docSize = null
// 多文件模块（CFG.source.multi，目前是数据分析那类）：本会话里【本模块能处理的全部文件】。
// 单文件模块这数组恒为 [当前那一份]，界面上那条 chip 条也不画。
// 【为什么要有它】一份研究的数据常常分散在好几张表里（主表 + 随访表 + 检验表），
// 只收一张的话用户只能反复覆盖；而传错一张却删不掉，就只能整个会话重来。
let docFiles = []
const isMulti = () => !!(CFG && CFG.source && CFG.source.multi)
// 配套数值表（只有 refcheck 的「数据完整性」用得上，见 CFG.extraUpload）。
// 是【一组】而不是一份：一篇稿子的数据常常分散在好几张表里（主表 + 附表 + 随访表），
// 只收一份的话用户只能反复覆盖，最后核的还是残缺的数据。元素形如 { name, size }。
let dataFiles = []
let mode = ""
let turns = 0             // 本会话已经发出过几轮（决定要不要给自由问答补一句上下文）
let pendingFiles = []     // 首屏选中、尚未上传的 File（多文件模块可以有好几个）
let outputs = []          // /api/outputs 的最近一次结果
// 设置弹层 + 变量对应面板的值。它们【就是 intake 的字段值】，改完立刻回写 _workflow.json，
// 于是 pin:true 的字段（humanize 的 protectRefs、stats 的 hasPHI）每一轮都会被 settingsLine
// 钉进模块前言 —— 这条路是踩出来的（默认值传达不到 → 模型替别人的论文改了统计学结论），
// 别改成只在前端存着。
let SETTINGS = {}
// 质量闸状态（服务端 /api/workflow/state）。本壳不画流程条，但【闸必须看得见】：
// 出件拦截是模块无关的，闸红时用户在这儿一样出不了 Word/PDF，而此前本页对此只字不提。
let GATES = []        // 判红的闸 step-id
let GATE_STEPS = []   // 步骤定义，用来把 id 换成中文名
let BYPASS = false    // 用户是否手动放行了本会话的拦截

// 每个面板的内容。raw = 该模式最近一轮的对话正文；doc = 从产物文件读回来的正文（译文/报告/大纲）。
// qa  = 挂在这份结果下面的【追问问答】（与 chat 的 msgs 同一种元素：{role,text,files}）。
//       它是结果的附属物 —— 主结果重跑一次，旧追问就作废（问的是上一版），见 run()。
// 模式是配置来的，所以这张表要等 installConfig 之后才建得出来。
let S = {}
function initState() {
  S = {}
  for (const id of ORDER) {
    S[id] = id === "chat"
      ? { msgs: [], status: "idle", err: "", files: [] }
      // docPv：产物是 Word / PPT 这类二进制时，正文改走服务端预览（见 loadDocFor 的注释）
      : { raw: "", doc: null, docName: "", docPv: "", docPvErr: "", status: "idle", err: "", files: [], qa: [] }
  }
}
// 正在跑的那一轮
let RUN = null            // { mode, label, skills:[], tools:Map, es }
let starting = false      // POST /api/chat/start 往返期间（此时还没有 es，靠它防连点）

const sidQ = () => (sid ? "&sid=" + encodeURIComponent(sid) : "")
const busy = () => starting || !!RUN

/**
 * 这一格现在能不能【追问】。
 * 判据 = 真的有一份跑出来的结果（与「转交」同一条：跑到一半 / 出错的面板上没什么可追问的），
 * 或者已经问过了（追问那一轮正在跑时 status 是 running，输入框不能因此消失）。
 * ★ 用函数声明而不是 const 箭头：updateFoot 在它上面，靠 hoist 才调得到。
 */
function askReady(m) {
  const s = S[m]
  if (m === "chat" || !s || !MODES[m] || !MODES[m].askMark) return false
  return (s.qa || []).length > 0
    || (s.status === "done" && (!!s.docPv || !!((s.doc || "") + (s.raw || "")).trim()))
}
/** 这一格问过几条（转交时要说清带过去了几条追问） */
const askCount = (m) => ((S[m] && S[m].qa) || []).filter((x) => x.role === "user").length

async function jget(url, opt) {
  const r = await fetch(url, opt)
  if (r.status === 401) { location.href = "./login"; throw new Error("unauthorized") }
  return r
}

/* ============================================================
   3. 首屏：选文件 → 上传 → 开始
   ============================================================ */
const okExt = () => (CFG && CFG.source.exts) || []

// 真错误一律红色。必须显式去掉 info —— 启动时那条"旧会话没有原文"的灰色提示用的是同一个框，
// 不清掉的话，用户接着传错格式时会看到一条【灰色的】报错，读起来像句无关紧要的说明。
function showIntroErr(msg) { const e = $("introErr"); e.textContent = msg; e.className = "err" + (msg ? " on" : "") }

/** 首屏：整块按配置画出来（标题 / 引导语 / 拖拽区文案 / chips / 必答题 / 按钮文字都来自 workflows.mjs） */
function renderIntro() {
  const I = CFG.intro
  $("introTitle").textContent = I.title
  $("introLead").textContent = I.lead
  $("dropTitle").textContent = I.dropTitle
  $("dropHint").textContent = I.dropHint
  $("btnStartTxt").textContent = I.startText
  $("file").setAttribute("accept", CFG.source.accept)
  // 多文件模块首屏就允许一次挑好几张（数据常常分散在主表 + 随访表 + 检验表里）
  if (isMulti()) $("file").setAttribute("multiple", "multiple"); else $("file").removeAttribute("multiple")
  $("introTip").innerHTML = I.tip || ""
  // chips 支持两种写法：字符串（图标按位置取第 i 个模式，历史写法）或 {t,i}（文字 + 明确的图标名）。
  // 【为什么要有后者】按位置取图标把首屏文案和右侧模式条的【顺序】焊死了 —— 模式条一调顺序，
  // 首屏这几个小标签的图标就集体错位，而这两处本来毫不相干。新写法把图标写死在文案旁边。
  $("introChips").innerHTML = (I.chips || []).map((c, i) => {
    const txt = typeof c === "string" ? c : c.t
    const icon = typeof c === "string" ? (MODES[ORDER[i]] ? MODES[ORDER[i]].icon : "") : ic(c.i)
    return '<span class="chip">' + icon + esc(txt) + "</span>"
  }).join("")
  // 首屏必答题（目前只有 stats 的 hasPHI）。它不是"设置"，是安全闸：
  // 未脱敏的患者数据不得进入统计，所以没答之前「开始」按钮是灰的。
  const askHost = $("introAsk"); askHost.innerHTML = ""
  for (const id of I.ask || []) {
    const f = fieldDef(id); if (!f) continue
    const box = document.createElement("div"); box.className = "askbox"
    box.innerHTML = '<div class="asklbl">' + esc(f.label) + (f.required ? ' <b class="req">必答</b>' : "") + "</div>"
      + (f.help ? '<div class="askhelp">' + esc(f.help) + "</div>" : "")
    const opts = document.createElement("div"); opts.className = "askopts"
    for (const o of (f.type === "bool" ? [{ v: true, t: "是" }, { v: false, t: "否" }] : f.options || [])) {
      const b = document.createElement("button")
      b.type = "button"; b.className = "askbtn"; b.textContent = o.t
      b.addEventListener("click", () => {
        SETTINGS[id] = o.v
        opts.querySelectorAll(".askbtn").forEach((x) => x.classList.remove("on"))
        b.classList.add("on"); syncStart()
      })
      opts.appendChild(b)
    }
    box.appendChild(opts); askHost.appendChild(box)
  }
  syncStart()
}

/** 「开始」按钮什么时候能点：文件选了 + 首屏必答题都答了 */
function syncStart() {
  const asked = (CFG.intro.ask || []).every((id) => SETTINGS[id] !== undefined && SETTINGS[id] !== null && SETTINGS[id] !== "")
  $("btnStart").disabled = !pendingFiles.length || !asked || busy()
}

/** 已选待传的文件列表（单文件模块永远只有一行；多文件模块可以有好几行，每行都能移除） */
function renderPicked() {
  $("pickedSlot").innerHTML = pendingFiles.map((f, i) =>
    // 徽标里放扩展名（PDF / DOCX / XLSX），比一个通用文件图标信息量大：用户一眼能看出传的是不是自己想传的那种
    '<div class="picked"><div class="fic">' + esc(extOf(f.name).toUpperCase().slice(0, 4)) + "</div>"
    + '<div class="fn"><b>' + esc(f.name) + "</b><span>" + fmtSize(f.size) + "</span></div>"
    + '<button class="rm" type="button" data-rmpick="' + i + '" title="移除">×</button></div>').join("")
  $("pickedSlot").querySelectorAll("[data-rmpick]").forEach((b) => b.addEventListener("click", () => {
    pendingFiles.splice(Number(b.dataset.rmpick), 1)
    $("file").value = ""          // 同一个文件移除后还要能再选一次（input 的 value 不清就不会触发 change）
    renderPicked(); syncStart()
  }))
}

/** 选中一批文件（单文件模块只取第一个；多文件模块累加，同名的按后来的覆盖） */
function pickFiles(list) {
  const files = [...(list || [])]
  if (!files.length) return
  const ok = okExt()
  const bad = files.filter((f) => !ok.includes(extOf(f.name)))
  const good = files.filter((f) => ok.includes(extOf(f.name)))
  showIntroErr(bad.length
    ? "这个模块只收 " + ok.map((x) => "." + x).join(" / ") + "，已跳过：" + bad.map((f) => f.name).join("、")
    : "")
  if (!good.length) return
  pendingFiles = isMulti()
    ? [...pendingFiles.filter((x) => !good.some((g) => g.name === x.name)), ...good]
    : [good[0]]
  renderPicked()
  syncStart()
}

$("drop").addEventListener("click", () => $("file").click())
$("file").addEventListener("change", (e) => pickFiles(e.target.files))
;["dragenter", "dragover"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.add("over") }))
;["dragleave", "drop"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.remove("over") }))
$("drop").addEventListener("drop", (e) => pickFiles(e.dataTransfer && e.dataTransfer.files))

/** 上传一个文件到本会话（没有 sid 时服务端会现建一个会话并把 id 回给我们，与聊天页同一条路） */
async function upload(file) {
  const r = await jget("api/upload?name=" + encodeURIComponent(file.name) + (sid ? "&sid=" + encodeURIComponent(sid) : ""),
    { method: "POST", body: file })
  const j = await r.json().catch(() => null)
  if (!r.ok || !j || !j.ok) throw new Error((j && j.err) || "上传失败（HTTP " + r.status + "）")
  sid = j.sid || sid
  try { history.replaceState(null, "", location.pathname + "?m=" + encodeURIComponent(MOD) + "&sid=" + encodeURIComponent(sid)) } catch (_) {}
  return j
}

$("btnStart").addEventListener("click", async () => {
  if (!pendingFiles.length || busy()) return
  $("btnStart").disabled = true
  $("upbar").classList.add("on")
  showIntroErr("")
  // ★ 这一步可能要几十秒：文件本身传得很快，慢的是【建会话】——服务端要向 opencode 要一个新
  //   session，机器忙的时候实测等过 25 秒。此前这段时间界面上只有一条无字的进度条，
  //   看着就是"点了没反应"，用户会去反复点或刷新。所以把按钮文字改成实时的状态。
  const startTxt = $("btnStartTxt").textContent
  $("btnStartTxt").textContent = "正在上传…"
  const slow = setTimeout(() => { $("btnStartTxt").textContent = "正在准备会话…（首次会慢一些）" }, 1500)
  try {
    // 多份就逐个传，并把进度写在按钮上（几十 MB 的表一份份传，用户得知道卡在第几份）
    for (let i = 0; i < pendingFiles.length; i++) {
      if (pendingFiles.length > 1) $("btnStartTxt").textContent = `正在上传 ${i + 1}/${pendingFiles.length}…`
      await upload(pendingFiles[i])
    }
    clearTimeout(slow); $("btnStartTxt").textContent = startTxt
    docFiles = pendingFiles.map((f) => ({ name: f.name, size: f.size }))
    docName = docFiles[0].name
    docSize = docFiles[0].size
    enterReader()
    // 会话标题：不改名的话它会被自动取成第一条消息的前 40 字，也就是那句长提示词
    // ——「最近」列表里每一条都长一个样，认不出是哪一份。改成文件名。
    // ★ 必须 await：服务端的 ensureSessionTitle 只在标题还是占位值时才补名，且【每会话只尝试一次】。
    //   不等它落地就发第一条消息，两者会撞在一起——补名先跑赢，标题被钉成那句提示词，之后再也改不回来。
    const title = docName.slice(0, 60) + (docFiles.length > 1 ? ` 等 ${docFiles.length} 份` : "")
    await fetch("api/session/rename?id=" + encodeURIComponent(sid) + "&title=" + encodeURIComponent(title), { method: "POST" }).catch(() => {})
    if (CFG.source.kind === "table") loadHeaders()   // 读真表头，喂「变量对应」面板的下拉
    setMode(CFG.first)
    // ★ 传完【不自动开跑】。这里原来是 run(CFG.first)：文件一传上去，第一个模式立刻发出去，
    //   用户既没机会看一眼严格度 / 输出语言 / 保护引用，也来不及先去补配套数值表 —— 想拦只能
    //   现找终止，而那一轮的额度已经花掉了。现在全站只有一种开跑方式：用户自己点「开始」。
    //   （设置摊开来让他先确认口径，但摊开 ≠ 开跑，得点弹层里的那枚「开始」才走。）
    if ((CFG.settings || []).length && !settingsSeen()) openSettings(true)
  } catch (e) {
    clearTimeout(slow); $("btnStartTxt").textContent = startTxt
    showIntroErr(String((e && e.message) || e))
    syncStart()
  } finally {
    $("upbar").classList.remove("on")
  }
})

/* ============================================================
   4. 阅读器外壳
   ============================================================ */
function enterReader() {
  $("intro").hidden = true
  $("reader").hidden = false
  $("docName").textContent = docName || "—"
  $("docSub").textContent = [extOf(docName).toUpperCase(), fmtSize(docSize)].filter(Boolean).join(" · ")
  $("btnSettings").hidden = !(CFG.settings || []).length
  $("varsBox").hidden = !CFG.vars
  if (CFG.vars) { $("varsTitle").textContent = CFG.vars.title; $("varsSub").textContent = CFG.vars.sub; renderVars() }
  renderStrip()
  renderDoc()
  renderRail()
}

/* ---- 多文件条：切换 / 删除 / 再添加 ----
   只有 CFG.source.multi 的模块画它。三件事都在这一条上，因为它们是同一件事的三个面：
   用户手里有好几张表，要能看清传了哪几张、点开任意一张、把传错的那张删掉。 */
function renderStrip() {
  const strip = $("fileStrip")
  if (!isMulti()) { strip.hidden = true; return }
  strip.hidden = false
  const busyNow = busy()
  strip.innerHTML = docFiles.map((f) =>
    '<span class="fchip' + (f.name === docName ? " on" : "") + '" data-pick="' + esc(f.name) + '" title="' + esc(f.name) + '">'
    + '<span class="nm">' + esc(f.name) + "</span>"
    + '<button type="button" class="x" data-del="' + esc(f.name) + '" aria-label="删除 ' + esc(f.name) + '"'
    + (busyNow ? " disabled" : "") + ">×</button></span>").join("")
    + '<button type="button" class="addf" id="addFile"' + (busyNow ? ' disabled title="这一轮还在跑，跑完再加"' : "")
    + ">＋ 再传一张</button>"
    + (busyNow ? '<span class="fnote">这一轮跑完才能加/删文件</span>'
      : docFiles.length > 1 ? '<span class="fnote">共 ' + docFiles.length + " 张，都会交给分析；点一张在左边看它</span>" : "")
  strip.querySelectorAll("[data-pick]").forEach((el) => el.addEventListener("click", (e) => {
    if (e.target.closest("[data-del]")) return
    switchDoc(el.dataset.pick)
  }))
  strip.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => removeDocFile(b.dataset.del)))
  const add = $("addFile"); if (add) add.addEventListener("click", pickMoreDocs)
}

/** 换一张看（只影响左栏与「变量对应」读哪张表的表头；发给模型的仍是全部） */
function switchDoc(name) {
  const f = docFiles.find((x) => x.name === name)
  if (!f || f.name === docName) return
  docName = f.name; docSize = f.size
  $("docName").textContent = docName
  $("docSub").textContent = [extOf(docName).toUpperCase(), fmtSize(docSize)].filter(Boolean).join(" · ")
  renderStrip(); renderDoc()
  if (CFG.source.kind === "table") loadHeaders()
  saveSettings()
}

/**
 * 造一个选文件框并弹出来。
 *
 * ★ 必须先 appendChild 再 click，用完再摘掉。浏览器里游离的 <input> 点了也能弹框，
 *   但桌面壳跑的是 WebView2 —— 这个壳已经因为"宿主不接钩子就静默吞掉"栽过两次
 *   （<a download> 要 on_download、target=_blank 要 on_new_window，见 launcher/src/main.rs），
 *   现场表现都是同一句"点了没反应"。首屏那个 <input id="file"> 是【挂在 DOM 里】的、
 *   在壳里一直好使，游离的这条路和它唯一的差别就在这儿。挂上去不花任何代价，
 *   就别把这个差别留着当变量。
 */
function openPicker(accept, multiple, onChange) {
  const inp = document.createElement("input")
  inp.type = "file"; inp.accept = accept; inp.multiple = !!multiple
  inp.style.cssText = "position:fixed;left:-9999px;width:1px;height:1px;opacity:0"
  document.body.appendChild(inp)
  inp.addEventListener("change", () => {
    const files = [...(inp.files || [])]
    inp.remove()
    onChange(files)
  })
  inp.click()
}

/** 再传一张（可多选）。传完自动切到最后一张，让用户立刻看见自己传上来的是什么。 */
function pickMoreDocs() {
  // ★ 别静默 return。这颗按钮的灰/不灰是 renderStrip 那一刻的 busy() 快照，快照会过期
  //（刷新页面接回一轮还在跑的会话就是），于是按钮亮着、点下去什么都不发生 = 用户眼里的"坏了"。
  //   重画一次文件条：状态立刻自我纠正成灰的，旁边那句话也说清了为什么。
  if (busy()) { renderStrip(); return }
  openPicker(CFG.source.accept, true, async (files) => {
    if (!files.length) return
    const ok = okExt()
    const bad = files.filter((f) => !ok.includes(extOf(f.name)))
    const good = files.filter((f) => ok.includes(extOf(f.name)))
    if (bad.length) docMsg("只收 " + ok.map((x) => "." + x).join(" / ") + "；已跳过：" + bad.map((f) => f.name).join("、"))
    let last = ""
    for (let i = 0; i < good.length; i++) {
      const f = good[i]
      docMsg("正在上传 " + f.name + (good.length > 1 ? "（" + (i + 1) + "/" + good.length + "）" : "") + "…")
      try {
        await upload(f)
        // 同名重传 = 覆盖（服务端按名字落盘），列表里也只留一条，别出现两行同名
        docFiles = [...docFiles.filter((x) => x.name !== f.name), { name: f.name, size: f.size }]
        last = f.name
      } catch (e) {
        docMsg("上传失败：" + String((e && e.message) || e))
        renderStrip()
        return
      }
    }
    saveSettings()
    if (last) { docName = ""; switchDoc(last) } else { renderStrip(); renderDoc() }
  })
}

/** 删掉一张（服务端也真删，否则刷新一下它又回来了） */
async function removeDocFile(name) {
  if (busy()) { renderStrip(); return }          // 同 pickMoreDocs：快照过期时自我纠正，别静默吞掉
  const keep = docFiles.slice()
  docFiles = docFiles.filter((f) => f.name !== name)
  const wasCurrent = name === docName
  if (wasCurrent) {
    docName = docFiles.length ? docFiles[0].name : ""
    docSize = docFiles.length ? docFiles[0].size : null
    $("docName").textContent = docName || "—"
    $("docSub").textContent = [extOf(docName).toUpperCase(), fmtSize(docSize)].filter(Boolean).join(" · ")
  }
  renderStrip(); renderDoc()
  try {
    const r = await jget("api/upload/delete?name=" + encodeURIComponent(name) + sidQ(), { method: "POST" })
    if (!r.ok) throw new Error("HTTP " + r.status)
    saveSettings()
    if (wasCurrent && docName && CFG.source.kind === "table") loadHeaders()
  } catch (e) {
    docFiles = keep                                   // 删不掉就放回去，别让界面和磁盘对不上
    if (wasCurrent) { docName = name; docSize = (keep.find((f) => f.name === name) || {}).size }
    renderStrip(); renderDoc()
    docMsg("没能删掉 " + name + "（" + String((e && e.message) || e) + "）")
  }
}

/** 左栏那块区域里说一句话（上传进度 / 删除失败这类过程消息） */
function docMsg(t) { $("docView").innerHTML = '<div class="docmsg">' + esc(t) + "</div>" }

/* ---- 左栏：那份东西 ----
   kind=doc   ：pdf 走 api/raw（浏览器自带阅读器）、Word 走 api/preview（服务端转 HTML/PDF）
   kind=table ：csv/tsv 前端直接渲染成表格；xlsx 前端解析不了，如实说明并给下载 */
let zoom = 1
function docUrl() {
  const e = extOf(docName)
  const base = (e === "pdf" || CFG.source.kind === "table") ? "api/raw" : "api/preview"
  return base + "?name=" + encodeURIComponent(docName) + "&dir=up" + sidQ()
}

/* ---- xlsx 就地预览（不引任何库）----------------------------------------
   xlsx/xlsm 是一个 zip：里面 xl/worksheets/sheetN.xml 是单元格，xl/sharedStrings.xml 是字符串池。
   解压用浏览器自带的 DecompressionStream('deflate-raw')（Chromium / WebView2 / 新 Safari 都有），
   所以不需要 SheetJS 那几百 KB。解析不了就退回一句人话 —— 绝不画一张空表让人以为数据是空的。
   ⚠ 只做【只读预览】：不求还原公式、样式、合并单元格。日期做了转换（Excel 存的是序列号，
     不转的话满屏 45123 更看不懂），其余一律按字面显示。 */
const XLSX_MAX_ROWS = 200
let XLSX_VIEW = null      // { file, sheets:[{name,rows,total}], cur }

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === "undefined") throw new Error("这个浏览器不支持内置解压")
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))
  return new Uint8Array(await new Response(s).arrayBuffer())
}

/** zip → Map(路径 → Uint8Array)。只认标准 zip（不处理 zip64；碰上了就抛错走降级文案）。 */
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf)
  let eocd = -1
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--)
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break }
  if (eocd < 0) throw new Error("文件不是有效的 xlsx（找不到 zip 结构）")
  const count = dv.getUint16(eocd + 10, true)
  let p = dv.getUint32(eocd + 16, true)
  if (p === 0xffffffff) throw new Error("这是 zip64 格式的大文件，浏览器这边读不了")
  const out = new Map(), td = new TextDecoder()
  for (let i = 0; i < count && p + 46 <= u8.length; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break
    const method = dv.getUint16(p + 10, true)
    const csize = dv.getUint32(p + 20, true)
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true)
    const lho = dv.getUint32(p + 42, true)
    const name = td.decode(u8.subarray(p + 46, p + 46 + nlen))
    p += 46 + nlen + elen + clen
    // 本地头里的名字/扩展字段长度可能与中央目录不同，数据偏移必须照本地头重算
    const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true)
    const start = lho + 30 + lnlen + lelen
    const raw = u8.subarray(start, start + csize)
    // 只解我们要用的那几个文件：整本解压在几十 MB 的表上是白花几秒
    if (!/^xl\/(worksheets\/|sharedStrings|styles|workbook)/.test(name) && name !== "xl/_rels/workbook.xml.rels") continue
    out.set(name, method === 0 ? raw.slice() : await inflateRaw(raw))
  }
  return out
}

const A1COL = (ref) => {              // "BC12" → 列序号（0 基）
  let n = 0
  for (const ch of String(ref)) {
    const c = ch.charCodeAt(0)
    if (c >= 65 && c <= 90) n = n * 26 + (c - 64); else break
  }
  return Math.max(0, n - 1)
}

/** Excel 序列号 → YYYY-MM-DD[ HH:MM]（1900 历，含它那个著名的 1900-02-29 假闰日） */
function excelDate(v) {
  const d = new Date(Math.round((v - 25569) * 86400 * 1000))
  if (isNaN(d.getTime())) return String(v)
  const p = (x) => String(x).padStart(2, "0")
  const ymd = d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate())
  const frac = v - Math.floor(v)
  return frac > 1e-6 ? ymd + " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) : ymd
}

/** 解析出每个工作表的前 XLSX_MAX_ROWS 行（rows 为二维数组，total 为该表的总行数） */
async function xlsxSheets(buf) {
  const files = await unzip(buf)
  const td = new TextDecoder()
  const xml = (n) => (files.has(n) ? td.decode(files.get(n)) : "")
  const dom = (s) => new DOMParser().parseFromString(s, "application/xml")
  const tag = (node, n) => [...node.getElementsByTagName(n)]

  // 字符串池：富文本会被切成多个 <r><t>，拼起来才是完整一格
  const shared = []
  const ss = xml("xl/sharedStrings.xml")
  if (ss) for (const si of tag(dom(ss), "si")) shared.push(tag(si, "t").map((t) => t.textContent).join(""))

  // 哪些 style 是日期格式：内置 14–22 / 45–47，外加自定义格式里带 y-m-d 的
  const dateStyles = new Set()
  const st = xml("xl/styles.xml")
  if (st) {
    const sdoc = dom(st)
    const custom = new Map()
    for (const f of tag(sdoc, "numFmt")) {
      const code = f.getAttribute("formatCode") || ""
      if (/[ymdhs]/i.test(code.replace(/\[[^\]]*\]|"[^"]*"/g, "")) && !/^[#0.,%]+$/.test(code))
        custom.set(f.getAttribute("numFmtId"), true)
    }
    const cellXfs = sdoc.getElementsByTagName("cellXfs")[0]
    if (cellXfs) tag(cellXfs, "xf").forEach((xf, i) => {
      const id = xf.getAttribute("numFmtId") || "0"
      const n = Number(id)
      if ((n >= 14 && n <= 22) || (n >= 45 && n <= 47) || custom.has(id)) dateStyles.add(i)
    })
  }

  // 工作表清单与顺序：workbook.xml 的 <sheet r:id> → rels 里的 Target
  const rels = new Map()
  const rl = xml("xl/_rels/workbook.xml.rels")
  if (rl) for (const r of tag(dom(rl), "Relationship"))
    rels.set(r.getAttribute("Id"), (r.getAttribute("Target") || "").replace(/^\/?xl\//, "").replace(/^\.\//, ""))
  let entries = []
  const wb = xml("xl/workbook.xml")
  if (wb) for (const s of tag(dom(wb), "sheet")) {
    const rid = s.getAttribute("r:id") || s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id")
    const target = rels.get(rid)
    if (target) entries.push({ name: s.getAttribute("name") || target, path: "xl/" + target })
  }
  if (!entries.length)   // workbook.xml 读不出来就按文件名兜底
    entries = [...files.keys()].filter((k) => /^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()
      .map((k, i) => ({ name: "工作表 " + (i + 1), path: k }))

  const sheets = []
  for (const en of entries) {
    const body = xml(en.path)
    if (!body) continue
    const rowsXml = tag(dom(body), "row")
    const rows = []
    for (const r of rowsXml) {
      if (rows.length >= XLSX_MAX_ROWS) break
      const line = []
      for (const c of tag(r, "c")) {
        const ref = c.getAttribute("r") || ""
        const idx = ref ? A1COL(ref) : line.length
        const t = c.getAttribute("t") || ""
        const sIdx = Number(c.getAttribute("s") || "-1")
        let val = ""
