<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>科研医学 Agent</title>
<style>
  html, body { margin: 0; height: 100%; font-family: "Microsoft YaHei", system-ui, sans-serif;
               background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; padding: 24px; }
  .spin { width: 42px; height: 42px; margin: 0 auto 18px; border: 4px solid #334155;
          border-top-color: #38bdf8; border-radius: 50%; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 13px; color: #94a3b8; margin: 0; line-height: 1.7; }
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>科研医学 Agent 正在启动</h1>
    <p id="msg">首次启动需要初始化本地引擎，约需 10–60 秒…</p>
  </div>
</body>
</html>
