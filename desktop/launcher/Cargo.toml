[package]
name = "sciagent-desktop"
version = "0.1.33"
description = "Niuma Science 桌面版启动器"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
dirs = "6" # 取系统「下载」已知文件夹（用户可能挪过位置，不能硬拼 %USERPROFILE%\Downloads）

[target.'cfg(windows)'.dependencies]
# GetShortPathNameW：把带空格的安装目录换成 8.3 短名再交给技能（见 main.rs 的 space_free）。
# 版本跟 tauri 依赖树里已有的 0.61 对齐，不引入新的下载。
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
